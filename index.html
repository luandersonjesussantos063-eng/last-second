<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<meta name="theme-color" content="#050814">

<title>Last Second</title>

<style>

*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:
        radial-gradient(circle at 50% 20%, #182b55 0%, #080d1d 45%, #020308 100%);
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    text-align:center;
    touch-action:none;
}

/* =========================
   MENU
========================= */

#menu,
#gameOver{
    width:min(400px,94vw);
    height:min(540px,88vh);
    min-height:450px;

    margin:20px auto;

    background:
        linear-gradient(145deg,rgba(30,35,50,.97),rgba(7,9,15,.98));

    border:1px solid rgba(255,255,255,.12);
    border-radius:20px;

    box-shadow:
        0 0 40px rgba(0,140,255,.15),
        inset 0 0 30px rgba(255,255,255,.02);

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    position:relative;
    overflow:hidden;
}

#menu::before,
#gameOver::before{
    content:"";
    position:absolute;
    width:220px;
    height:220px;
    border-radius:50%;
    background:#008cff;
    filter:blur(100px);
    opacity:.08;
    top:-100px;
    left:-80px;
}

#titulo{
    font-size:clamp(38px,12vw,52px);
    font-weight:900;
    letter-spacing:5px;
    margin-bottom:45px;

    color:#fff;

    text-shadow:
        0 0 8px #008cff,
        0 0 25px rgba(0,140,255,.8),
        0 0 50px rgba(0,140,255,.35);
}

#subtitulo{
    margin-top:-30px;
    margin-bottom:38px;

    color:#9ca8bd;
    font-size:13px;
    letter-spacing:2px;
}

button{
    border:none;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
    touch-action:none;
    font-family:inherit;
}

#jogar,
#tentarNovamente{

    min-width:190px;

    padding:16px 35px;

    font-size:21px;

    border-radius:12px;

    background:
        linear-gradient(135deg,#ff2020,#a90000);

    box-shadow:
        0 8px 25px rgba(255,0,0,.25),
        inset 0 1px rgba(255,255,255,.2);

    transition:
        transform .12s,
        filter .12s;
}

#jogar:active,
#tentarNovamente:active{
    transform:scale(.94);
    filter:brightness(.85);
}

#melhor{
    margin-top:30px;
    font-size:18px;
    color:#9ca8bd;
}

#recordeMenu{
    color:#ffd000;
    font-weight:bold;
}

/* =========================
   JOGO
========================= */

#telaJogo{
    display:none;
    width:100%;
    height:100%;
}

#barraSuperior{

    width:min(400px,94vw);

    margin:8px auto;

    display:flex;
    justify-content:space-between;
    align-items:center;

    font-weight:bold;

    position:relative;
    z-index:20;
}

#pontuacao{
    font-size:20px;
}

#vidas{
    font-size:20px;
    letter-spacing:2px;
}

#jogo{

    width:min(400px,94vw);
    height:min(500px,calc(100vh - 130px));

    max-height:500px;

    position:relative;

    overflow:hidden;

    margin:auto;

    border:1px solid rgba(255,255,255,.15);
    border-radius:14px;

    background:
        radial-gradient(
            circle at 50% 15%,
            #1c3a67 0%,
            #0c1830 40%,
            #030711 85%
        );

    box-shadow:
        0 0 35px rgba(0,100,255,.2),
        inset 0 0 30px rgba(0,0,0,.6);
}

/* =========================
   LINHAS DE VELOCIDADE
========================= */

.linhaVelocidade{

    position:absolute;

    width:2px;

    height:40px;

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(255,255,255,.6),
            transparent
        );

    pointer-events:none;
}

/* =========================
   ESTRELAS
========================= */

.estrela{

    position:absolute;

    width:2px;
    height:2px;

    background:#fff;

    border-radius:50%;

    box-shadow:
        0 0 5px #fff;

    pointer-events:none;
}

/* =========================
   PERSONAGEM
========================= */

#personagem{

    width:40px;
    height:40px;

    position:absolute;

    bottom:12px;

    left:calc(50% - 20px);

    z-index:10;

    border-radius:
        50% 50% 30% 30%;

    background:
        linear-gradient(
            to bottom,
            #ffffff 0%,
            #55c9ff 35%,
            #008cff 100%
        );

    border:1px solid rgba(255,255,255,.7);

    box-shadow:
        0 0 12px #008cff,
        0 0 28px rgba(0,170,255,.7);

    animation:pulsar .35s infinite alternate;

    transition:
        opacity .1s,
        filter .1s;
}

#personagem::before{

    content:"";

    position:absolute;

    width:12px;
    height:12px;

    border-radius:50%;

    background:#fff;

    top:8px;
    left:13px;

    box-shadow:
        0 0 10px #fff;
}

@keyframes pulsar{

    from{
        transform:scale(.94);
    }

    to{
        transform:scale(1.05);
    }

}

#personagem.escudo{

    border:3px solid #00ffff;

    box-shadow:
        0 0 10px #00ffff,
        0 0 25px #00ffff,
        0 0 50px rgba(0,255,255,.8);
}

#personagem.dano{

    filter:
        brightness(2)
        saturate(0);

}

/* =========================
   OBSTÁCULOS
========================= */

.obstaculo{

    position:absolute;

    z-index:5;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    pointer-events:none;
}

.obstaculo.normal{

    width:40px;
    height:40px;

    background:
        radial-gradient(
            circle at 30% 25%,
            #ffdc80 0%,
            #ff4d36 28%,
            #9c1616 70%,
            #410707 100%
        );

    box-shadow:
        0 0 10px rgba(255,70,40,.7);
}

.obstaculo.rapido{

    width:30px;
    height:50px;

    border-radius:10px;

    background:
        linear-gradient(
            135deg,
            #ff7b00,
            #ff2100,
            #720000
        );

    box-shadow:
        0 0 14px rgba(255,60,0,.8);

    transform:rotate(45deg);
}

.obstaculo.grande{

    width:55px;
    height:55px;

    background:
        radial-gradient(
            circle at 30% 25%,
            #d8a7ff,
            #8d32d0 35%,
            #35005e 80%
        );

    box-shadow:
        0 0 18px rgba(170,50,255,.8);
}

/* =========================
   MOEDAS
========================= */

.moeda{

    width:24px;
    height:24px;

    position:absolute;

    z-index:6;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #fffbd0,
            #ffd000 42%,
            #a96800 100%
        );

    border:1px solid #ffe77a;

    box-shadow:
        0 0 8px #ffd000,
        0 0 18px rgba(255,208,0,.5);

    animation:girar .7s linear infinite;

    pointer-events:none;
}

@keyframes girar{

    0%{
        transform:rotateY(0deg);
    }

    50%{
        transform:rotateY(90deg);
    }

    100%{
        transform:rotateY(180deg);
    }

}

/* =========================
   POWER UPS
========================= */

.powerup{

    width:30px;
    height:30px;

    position:absolute;

    z-index:7;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:9px;

    font-size:18px;

    font-weight:bold;

    border:1px solid rgba(255,255,255,.5);

    pointer-events:none;
}

.powerup-escudo{

    background:
        linear-gradient(
            135deg,
            #00eaff,
            #006eff
        );

    box-shadow:
        0 0 15px #00ffff,
        0 0 30px rgba(0,255,255,.5);
}

.powerup-velocidade{

    background:
        linear-gradient(
            135deg,
            #fff700,
            #ff8c00
        );

    color:#111;

    box-shadow:
        0 0 15px #ffea00,
        0 0 30px rgba(255,180,0,.5);
}

/* =========================
   PARTÍCULAS
========================= */

.particula{

    position:absolute;

    width:5px;
    height:5px;

    border-radius:50%;

    pointer-events:none;

    z-index:30;
}

/* =========================
   TEXTO FLUTUANTE
========================= */

.textoFlutuante{

    position:absolute;

    z-index:40;

    font-weight:900;

    font-size:17px;

    pointer-events:none;

    text-shadow:
        0 2px 4px #000;

    animation:
        subirTexto .7s forwards;
}

@keyframes subirTexto{

    from{
        opacity:1;
        transform:translateY(0);
    }

    to{
        opacity:0;
        transform:translateY(-35px);
    }

}

/* =========================
   PAUSA
========================= */

#pausado{

    display:none;

    position:absolute;

    z-index:100;

    width:100%;
    height:100%;

    top:0;
    left:0;

    background:
        rgba(0,0,0,.75);

    backdrop-filter:blur(4px);

    align-items:center;
    justify-content:center;

    flex-direction:column;
}

#pausado h1{

    font-size:45px;

    margin:0 0 10px;

    text-shadow:
        0 0 15px #008cff;
}

#pausado p{
    color:#aaa;
}

/* =========================
   CONTROLES
========================= */

#controles{

    width:min(400px,94vw);

    margin:8px auto;

    display:flex;

    justify-content:space-between;

    gap:20px;
}

.controle{

    width:50%;
    height:58px;

    padding:0;

    background:
        linear-gradient(
            145deg,
            #292929,
            #151515
        );

    border:
        1px solid #555;

    border-radius:12px;

    font-size:28px;

    box-shadow:
        0 5px 15px rgba(0,0,0,.4);

    transition:
        transform .08s,
        background .08s;
}

.controle:active{

    transform:scale(.95);

    background:#333;
}

/* =========================
   GAME OVER
========================= */

#gameOver{
    display:none;
}

#gameOver h1{

    font-size:44px;

    margin:
        0 0 12px;

    color:#fff;

    text-shadow:
        0 0 12px #ff2020;
}

#gameOver h2{

    font-size:28px;

    margin:5px;
}

#gameOver h3{

    color:#9ca8bd;

    font-size:19px;

    margin:
        5px 0 30px;
}

#pontuacaoFinal{
    color:#fff;
}

#recordeFinal{
    color:#ffd000;
}

#novoRecorde{

    display:none;

    color:#ffd000;

    font-size:19px;

    font-weight:bold;

    margin-bottom:20px;

    animation:
        piscar .5s infinite alternate;
}

@keyframes piscar{

    from{
        opacity:.4;
        transform:scale(.98);
    }

    to{
        opacity:1;
        transform:scale(1.04);
    }

}

/* =========================
   RESPONSIVO
========================= */

@media (min-width:601px){

    #controles{
        display:none;
    }

}

@media (max-height:650px){

    #menu,
    #gameOver{

        height:calc(100vh - 20px);
        min-height:0;

        margin:10px auto;
    }

    #titulo{
        margin-bottom:35px;
    }

    #jogo{

        height:calc(100vh - 115px);
    }

    #personagem{
        bottom:7px;
    }

    #controles{
        margin:5px auto;
    }

    .controle{
        height:48px;
    }

}

</style>

</head>

<body>

<!-- =========================
     MENU
========================= -->

<div id="menu">

    <div id="titulo">
        LAST SECOND
    </div>

    <div id="subtitulo">
        SOBREVIVA O MÁXIMO QUE PUDER
    </div>

    <button id="jogar">
        ▶ PLAY
    </button>

    <div id="melhor">
        BEST:
        <span id="recordeMenu">0</span>
    </div>

</div>


<!-- =========================
     JOGO
========================= -->

<div id="telaJogo">

    <div id="barraSuperior">

        <div id="pontuacao">
            SCORE: 0
        </div>

        <div id="vidas">
            ❤️❤️❤️
        </div>

    </div>


    <div id="jogo">

        <div id="personagem"></div>


        <div id="pausado">

            <h1>
                PAUSED
            </h1>

            <p>
                Pressione P para continuar
            </p>

        </div>

    </div>


    <div id="controles">

        <button
            class="controle"
            id="esquerda">
            ◀
        </button>

        <button
            class="controle"
            id="direita">
            ▶
        </button>

    </div>

</div>


<!-- =========================
     GAME OVER
========================= -->

<div id="gameOver">

    <h1>
        GAME OVER
    </h1>

    <h2>
        SCORE:
        <span id="pontuacaoFinal">
            0
        </span>
    </h2>

    <h3>
        BEST:
        <span id="recordeFinal">
            0
        </span>
    </h3>

    <div id="novoRecorde">
        🏆 NEW RECORD!
    </div>

    <button id="tentarNovamente">
        ↻ TRY AGAIN
    </button>

</div>


<script>

/* =========================================================
   ELEMENTOS
========================================================= */

const menu =
    document.getElementById("menu");

const telaJogo =
    document.getElementById("telaJogo");

const gameOver =
    document.getElementById("gameOver");

const jogar =
    document.getElementById("jogar");

const tentarNovamente =
    document.getElementById("tentarNovamente");

const jogo =
    document.getElementById("jogo");

const personagem =
    document.getElementById("personagem");

const pontuacao =
    document.getElementById("pontuacao");

const vidasElemento =
    document.getElementById("vidas");

const pausadoElemento =
    document.getElementById("pausado");

const botaoEsquerda =
    document.getElementById("esquerda");

const botaoDireita =
    document.getElementById("direita");

const recordeMenu =
    document.getElementById("recordeMenu");

const pontuacaoFinal =
    document.getElementById("pontuacaoFinal");

const recordeFinal =
    document.getElementById("recordeFinal");

const novoRecordeElemento =
    document.getElementById("novoRecorde");


/* =========================================================
   ESTADO
========================================================= */

let recorde =
    Number(
        localStorage.getItem("lastSecondRecorde")
    ) || 0;

let recordeAnterior =
    recorde;

let posicao =
    0;

let pontos =
    0;

let vidas =
    3;

let velocidade =
    4;

let jogoRodando =
    false;

let pausado =
    false;

let esquerdaPressionada =
    false;

let direitaPressionada =
    false;

let escudoAtivo =
    false;

let velocidadeExtra =
    0;

let invulneravel =
    false;

let tempoPartida =
    0;

let combo =
    0;

let maiorCombo =
    0;

let loop =
    null;

let ultimoTempo =
    0;

let acumuladorSpawn =
    0;

let acumuladorMoeda =
    0;

let acumuladorPowerup =
    0;

let audioContext =
    null;

let musicaAtiva =
    false;

let musicaTimeout =
    null;

let musicaNota =
    0;


/* =========================================================
   ARRAYS
========================================================= */

let obstaculos =
    [];

let moedas =
    [];

let powerups =
    [];

let estrelas =
    [];

let linhasVelocidade =
    [];


/* =========================================================
   RECORD
========================================================= */

recordeMenu.innerText =
    recorde;


/* =========================================================
   EVENTOS
========================================================= */

jogar.addEventListener(
    "click",
    iniciarJogo
);

tentarNovamente.addEventListener(
    "click",
    iniciarJogo
);


/* =========================================================
   INICIAR JOGO
========================================================= */

function iniciarJogo(){

    limparTudo();

    menu.style.display =
        "none";

    gameOver.style.display =
        "none";

    telaJogo.style.display =
        "block";

    iniciarPartida();

}


/* =========================================================
   INICIAR PARTIDA
========================================================= */

function iniciarPartida(){

    if(loop !== null){

        cancelAnimationFrame(
            loop
        );

        loop =
            null;
    }

    pararMusica();

    pontos =
        0;

    vidas =
        3;

    velocidade =
        4;

    posicao =
        (jogo.clientWidth - 40) / 2;

    jogoRodando =
        true;

    pausado =
        false;

    esquerdaPressionada =
        false;

    direitaPressionada =
        false;

    escudoAtivo =
        false;

    velocidadeExtra =
        0;

    invulneravel =
        false;

    tempoPartida =
        0;

    combo =
        0;

    maiorCombo =
        0;

    acumuladorSpawn =
        0;

    acumuladorMoeda =
        0;

    acumuladorPowerup =
        0;

    ultimoTempo =
        performance.now();

    recordeAnterior =
        recorde;


    personagem.style.left =
        posicao + "px";

    personagem.style.opacity =
        "1";

    personagem.classList.remove(
        "escudo",
        "dano"
    );


    pontuacao.innerText =
        "SCORE: 0";

    atualizarVidas();


    pausadoElemento.style.display =
        "none";


    criarEstrelas();

    criarLinhas();


    iniciarMusica();


    /* Primeiros elementos */

    for(
        let i = 0;
        i < 4;
        i++
    ){

        obstaculos.push(
            criarObstaculo(
                -70 - i * 130
            )
        );

    }


    for(
        let i = 0;
        i < 2;
        i++
    ){

        moedas.push(
            criarMoeda(
                -180 - i * 230
            )
        );

    }


    loop =
        requestAnimationFrame(
            atualizarJogo
        );

}


/* =========================================================
   LOOP
========================================================= */

function atualizarJogo(tempoAtual){

    if(!jogoRodando){

        return;
    }


    loop =
        requestAnimationFrame(
            atualizarJogo
        );


    const delta =
        Math.min(
            40,
            tempoAtual - ultimoTempo
        );


    ultimoTempo =
        tempoAtual;


    if(pausado){

        return;
    }


    tempoPartida +=
        delta / 1000;


    atualizarDificuldade();


    moverJogador();


    moverEstrelas();


    moverLinhas(
        delta
    );


    atualizarObstaculos(
        delta
    );


    atualizarMoedas(
        delta
    );


    atualizarPowerups(
        delta
    );


    atualizarSpawns(
        delta
    );

}


/* =========================================================
   JOGADOR
========================================================= */

function moverJogador(){

    const limite =
        jogo.clientWidth - 40;


    const velocidadeJogador =
        0.38 + velocidadeExtra * 0.035;


    if(esquerdaPressionada){

        posicao -=
            7 *
            velocidadeJogador;

    }


    if(direitaPressionada){

        posicao +=
            7 *
            velocidadeJogador;

    }


    if(posicao < 0){

        posicao =
            0;

    }


    if(posicao > limite){

        posicao =
            limite;

    }


    personagem.style.left =
        posicao + "px";

}


/* =========================================================
   DIFICULDADE
========================================================= */

function atualizarDificuldade(){

    velocidade =
        Math.min(
            13,
            4 +
            tempoPartida * 0.09 +
            Math.floor(pontos / 15) * 0.25
        );

}


/* =========================================================
   ESTRELAS
========================================================= */

function criarEstrelas(){

    for(
        let i = 0;
        i < 45;
        i++
    ){

        const estrela =
            document.createElement(
                "div"
            );

        estrela.className =
            "estrela";


        estrela.style.left =
            Math.random() *
            (jogo.clientWidth - 3) +
            "px";


        estrela.style.top =
            Math.random() *
            jogo.clientHeight +
            "px";


        estrela.dataset.velocidade =
            0.7 +
            Math.random() * 2.5;


        jogo.appendChild(
            estrela
        );


        estrelas.push(
            estrela
        );

    }

}


/* =========================================================
   MOVER ESTRELAS
========================================================= */

function moverEstrelas(){

    estrelas.forEach(
        function(estrela){

            let top =
                parseFloat(
                    estrela.style.top
                );


            const v =
                Number(
                    estrela.dataset.velocidade
                );


            top +=
                v *
                (velocidade / 4);


            if(
                top >
                jogo.clientHeight
            ){

                top =
                    -5;


                estrela.style.left =
                    Math.random() *
                    (jogo.clientWidth - 3) +
                    "px";

            }


            estrela.style.top =
                top + "px";

        }
    );

}


/* =========================================================
   LINHAS DE VELOCIDADE
========================================================= */

function criarLinhas(){

    for(
        let i = 0;
        i < 10;
        i++
    ){

        const linha =
            document.createElement(
                "div"
            );

        linha.className =
            "linhaVelocidade";


        linha.style.left =
            Math.random() *
            (jogo.clientWidth - 2) +
            "px";


        linha.style.top =
            Math.random() *
            jogo.clientHeight +
            "px";


        linha.dataset.velocidade =
            2 +
            Math.random() * 4;


        jogo.appendChild(
            linha
        );


        linhasVelocidade.push(
            linha
        );

    }

}


/* =========================================================
   MOVER LINHAS
========================================================= */

function moverLinhas(delta){

    linhasVelocidade.forEach(
        function(linha){

            let top =
                parseFloat(
                    linha.style.top
                );


            const v =
                Number(
                    linha.dataset.velocidade
                );


            top +=
                v *
                (delta / 16) *
                (velocidade / 4);


            if(
                top >
                jogo.clientHeight
            ){

                top =
                    -50;


                linha.style.left =
                    Math.random() *
                    (jogo.clientWidth - 2) +
                    "px";

            }


            linha.style.top =
                top + "px";

/* =========================================================
   OBSTÁCULO
========================================================= */

function criarObstaculo(
    posicaoInicial
){

    const elemento =
        document.createElement(
            "div"
        );


    const sorteio =
        Math.random();


    let tipo =
        "normal";


    let largura =
        40;


    if(
        sorteio < .18 &&
        tempoPartida > 8
    ){

        tipo =
            "rapido";

        largura =
            30;

    }


    if(
        sorteio > .88 &&
        tempoPartida > 15
    ){

        tipo =
            "grande";

        largura =
            55;

    }


    elemento.classList.add(
        "obstaculo",
        tipo
    );


    elemento.style.top =
        posicaoInicial + "px";


    elemento.style.left =
        Math.random() *
        Math.max(
            1,
            jogo.clientWidth - largura
        ) +
        "px";


    jogo.appendChild(
        elemento
    );


    return{

        elemento:
            elemento,

        top:
            posicaoInicial,

        tipo:
            tipo,

        velocidade:
            velocidade *
            (
                tipo === "rapido"
                    ? 1.35
                    : tipo === "grande"
                        ? .82
                        : 1
            ),

        largura:
            largura,

        atingido:
            false

    };

}


/* =========================================================
   ATUALIZAR OBSTÁCULOS
========================================================= */

function atualizarObstaculos(delta){

    const limiteX =
        jogo.clientWidth - 40;


    obstaculos.forEach(
        function(obstaculo){

            if(obstaculo.atingido){

                return;

            }


            obstaculo.top +=
                obstaculo.velocidade *
                (delta / 16);


            obstaculo.elemento.style.top =
                obstaculo.top + "px";


            if(
                obstaculo.top >
                jogo.clientHeight + 60
            ){

                obstaculo.top =
                    -80;


                obstaculo.elemento.style.left =
                    Math.random() *
                    Math.max(
                        1,
                        limiteX
                    ) +
                    "px";


                obstaculo.velocidade =
                    velocidade *
                    (
                        obstaculo.tipo === "rapido"
                            ? 1.35
                            : obstaculo.tipo === "grande"
                                ? .82
                                : 1
                    );


                obstaculo.atingido =
                    false;


                pontos++;

                combo = 0;

                atualizarPontuacao();

            }


            if(
                colidiu(
                    personagem,
                    obstaculo.elemento
                )
            ){

                tratarColisaoObstaculo(
                    obstaculo
                );

            }

        }
    );

}


/* =========================================================
   COLISÃO OBSTÁCULO
========================================================= */

){

        true;


    if(escudoAtivo){

        criarExplosao(
            obstaculo.elemento,
            18
        );


        mostrarTexto(
            "BLOCK!",
            obstaculo.elemento,

        );


        tocarSom(

            .12
        );


        obstaculo.top =

        obstaculo.elemento.style.top =
            "-100px";


        obstaculo.elemento.style.left =
            Math.random() *
            (jogo.clientWidth - 40) +
            "px";


        setTimeout(
            function(){

                obstaculo.atingido =
                    false;

            },
            100
        );


        return;

    }


    perderVida();


    criarExplosao(
        personagem,
        14
    );


    obstaculo.top =

    obstaculo.elemento.style.top =

    setTimeout(
        function(){

            obstaculo.atingido =
                false;

        },
        200
    );

        delta;

        delta;


    const intervaloObstaculo =
        Math.max(
            420,
            1100 -
            tempoPartida * 7
        );


    if(
        acumuladorSpawn >
        intervaloObstaculo
    ){

        acumuladorSpawn =

        if(
            obstaculos.length < 10
        ){

            obstaculos.push(
                criarObstaculo(
                    -70
                )
            );

    }


    if(
        acumuladorMoeda >
        1800
    ){

        acumuladorMoeda =
            0;


        if(
            moedas.length < 5
        ){

            moedas.push(
                criarMoeda(
                    -50
                )
            );

        }

    }


    if(
        acumuladorPowerup >
        Math.max(
            6500,
            10000 -
            tempoPartida * 80
        )
    ){

        acumuladorPowerup =
            0;


        if(
            powerups.length < 2 &&
            Math.random() < .75
        ){

            powerups.push(
                criarPowerUp()
            );

        }

    }

/* =========================================================
   COLISÃO
========================================================= */

function colidiu(
    elementoA,
    elementoB
){

    const a =
        elementoA.getBoundingClientRect();


    const b =
        elementoB.getBoundingClientRect();


    const margem =
        6;


    return(

        a.left + margem <
        b.right - margem &&

        a.right - margem >
        b.left + margem &&

        a.top + margem <
        b.bottom - margem &&

        a.bottom - margem >
        b.top + margem

    );

}


/* =========================================================
   PARTÍCULAS
========================================================= */

function criarExplosao(
    elemento,
    quantidade
){

    const rect =
        elemento.getBoundingClientRect();


    const jogoRect =
        jogo.getBoundingClientRect();


    const centroX =
        rect.left -
        jogoRect.left +
        rect.width / 2;


    const centroY =
        rect.top -
        jogoRect.top +
        rect.height / 2;


    for(
        let i = 0;
        i < quantidade;
        i++
    ){

        const particula =
            document.createElement(
                "div"
            );


        particula.className =
            "particula";


        particula.style.left =
            centroX + "px";


        particula.style.top =
            centroY + "px";


        particula.style.background =
            i % 2 === 0
                ? "#00bfff"
                : "#ffd000";


        jogo.appendChild(
            particula
        );


        const angulo =
            Math.random() *
            Math.PI *
            2;


        const distancia =
            20 +
            Math.random() * 45;


        const destinoX =
            Math.cos(
                angulo
            ) *
            distancia;


        const destinoY =
            Math.sin(
                angulo
            ) *
            distancia;


        particula.animate(
            [
                {
                    transform:
                        "translate(-50%,-50%) scale(1)",
                    opacity:1
                },
                {
                    transform:
                        "translate(" +
                        destinoX +
                        "px," +
                        destinoY +
                        "px) scale(0)",
                    opacity:0
                }
            ],
            {
                duration:
                    450 +
                    Math.random() * 300,
                easing:
                    "ease-out"
            }
        );


        setTimeout(
            function(){

                particula.remove();

            },
            800
        );

    }

}


/* =========================================================
   TEXTO FLUTUANTE
========================================================= */

function mostrarTexto(
    texto,
    elemento,
    classeCor
){

    const rect =
        elemento.getBoundingClientRect();


    const jogoRect =
        jogo.getBoundingClientRect();


    const textoElemento =
        document.createElement(
            "div"
        );


    textoElemento.className =
        "textoFlutuante";


    textoElemento.innerText =
        texto;


    textoElemento.style.color =
        classeCor;


    textoElemento.style.left =
        (
            rect.left -
            jogoRect.left +
            rect.width / 2 -
            35
        ) +
        "px";


    textoElemento.style.top =
        (
            rect.top -
            jogoRect.top
        ) +
        "px";


    jogo.appendChild(
        textoElemento
    );


    setTimeout(
        function(){

            textoElemento.remove();

        },
        800
    );

}

    if(

    ){

========================================================= */

function configurarControle(
    botao,
    pressionar,
    soltar
){

    botao.addEventListener(
        "pointerdown",
        function(evento){

            evento.preventDefault();

            pressionar();


            try{

                botao.setPointerCapture(
                    evento.pointerId
                );

            }catch(e){}

        }
    );


    botao.addEventListener(
        "pointerup",
        function(evento){

            evento.preventDefault();

            soltar();

        }
    );


    botao.addEventListener(
        "pointercancel",
        soltar
    );


    botao.addEventListener(
        "lostpointercapture",
        soltar
    );

}

/* =========================================================
   ÁUDIO
========================================================= */

function obterAudio(){

    try{

        const AudioContextClass =
            window.AudioContext ||
            window.webkitAudioContext;


        if(
            !AudioContextClass
        ){

            return null;

        }


        if(
            !audioContext
        ){

            audioContext =
                new AudioContextClass();

        }


        if(
            audioContext.state ===
            "suspended"
        ){

            audioContext.resume();

        }


        return audioContext;

    }catch(erro){

        return null;

    }

}


/* =========================================================
   EFEITO SONORO
========================================================= */

function tocarSom(
    frequencia,
    tipo,
    duracao
){

    const audio =
        obterAudio();


    if(!audio){

        return;

    }


    try{

        const oscilador =
            audio.createOscillator();


        const ganho =
            audio.createGain();


        const agora =
            audio.currentTime;


        oscilador.type =
            tipo;


        oscilador.frequency.value =
            frequencia;


        ganho.gain.setValueAtTime(
            .08,
            agora
        );


        ganho.gain.exponentialRampToValueAtTime(
            .001,
            agora + duracao
        );


        oscilador.connect(
            ganho
        );


        ganho.connect(
            audio.destination
        );


        oscilador.start(
            agora
        );


        oscilador.stop(
            agora + duracao
        );

    }catch(e){}

}


/* =========================================================
   MÚSICA
========================================================= */

function iniciarMusica(){

    const audio =
        obterAudio();


    if(!audio){

        return;

    }


    musicaAtiva =
        true;


    musicaNota =
        0;


    if(
        musicaTimeout !== null
    ){

        clearTimeout(
            musicaTimeout
        );

    }


    tocarNotaMusica();

}


/* =========================================================
   NOTA MUSICAL
========================================================= */

function tocarNotaMusica(){

    if(
        !musicaAtiva ||
        pausado ||
        !jogoRodando
    ){

        return;

    }


    const audio =
        obterAudio();


    if(!audio){

        return;

    }


    try{

        const notas = [

            220,
            277,
            330,
            440,
            330,
            277,
            247,
            330

        ];


        const frequencia =
            notas[
                musicaNota %
                notas.length
            ];


        const oscilador =
            audio.createOscillator();


        const ganho =
            audio.createGain();


        const agora =
            audio.currentTime;


        oscilador.type =
            "triangle";


        oscilador.frequency.value =
            frequencia;


        ganho.gain.setValueAtTime(
            .025,
            agora
        );


        ganho.gain.exponentialRampToValueAtTime(
            .001,
            agora + .18
        );


        oscilador.connect(
            ganho
        );


        ganho.connect(
            audio.destination
        );


        oscilador.start(
            agora
        );


        oscilador.stop(
            agora + .18
        );


        musicaNota++;


        const intervalo =
            Math.max(
                100,
                280 -
                (velocidade - 4) * 12
            );


        musicaTimeout =
            setTimeout(
                tocarNotaMusica,
                intervalo
            );

    }catch(e){}

}


/* =========================================================
   PARAR MÚSICA
========================================================= */

function pararMusica(){

    musicaAtiva =
        false;


    if(
        musicaTimeout !== null
    ){

        clearTimeout(
            musicaTimeout
        );

        musicaTimeout =
            null;

    }

}
