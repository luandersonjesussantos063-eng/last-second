<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#06150b">
<title>LAST SECOND FC</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020806;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    touch-action:none;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
}

#app{
    position:relative;
    width:min(100vw,430px);
    height:min(100vh,820px);
    overflow:hidden;
    background:#087a35;
    box-shadow:0 0 50px #000;
}

.hidden{display:none!important}

/* ================= MENU ================= */

#menu{
    position:absolute;
    inset:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle at 50% 35%,#164b2a 0%,#082416 42%,#020805 100%);
    overflow:hidden;
}

.menuGlow{
    position:absolute;
    width:380px;
    height:380px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(43,255,119,.28),transparent 68%);
    filter:blur(15px);
    animation:menuPulse 3s infinite alternate;
}

@keyframes menuPulse{
    from{transform:scale(.9);opacity:.6}
    to{transform:scale(1.15);opacity:1}
}

.menuContent{
    position:relative;
    z-index:2;
    width:90%;
    text-align:center;
}

.logo{
    font-size:50px;
    line-height:.82;
    font-weight:1000;
    letter-spacing:2px;
    text-shadow:0 5px 0 #04451b,0 0 30px rgba(62,255,133,.6);
}

.logo span{
    display:block;
    margin-top:12px;
    font-size:25px;
    letter-spacing:7px;
    color:#73ffa0;
}

.version{
    margin-top:13px;
    font-size:11px;
    opacity:.45;
}

.status{
    margin:18px 0;
    color:#71ff9c;
    font-size:11px;
    letter-spacing:2px;
}

.menuButton{
    display:block;
    width:100%;
    max-width:290px;
    margin:9px auto;
    padding:16px;
    border:1px solid #53ff8b;
    border-radius:12px;
    background:linear-gradient(#20d85d,#0a8d36);
    color:white;
    font-size:18px;
    font-weight:900;
    box-shadow:0 6px 0 #045d23,0 0 18px rgba(40,255,110,.18);
    cursor:pointer;
}

.menuButton:active{
    transform:translateY(5px);
    box-shadow:0 1px 0 #045d23;
}

.menuButton.secondary{
    background:#10291a;
    border-color:#3a704b;
    box-shadow:0 5px 0 #07150b;
}

.burst{animation:menuBurst .55s forwards}

@keyframes menuBurst{
    0%{transform:scale(1);opacity:1}
    35%{transform:scale(1.08);filter:brightness(2)}
    100%{transform:scale(3);opacity:0}
}

/* ================= JOGO ================= */

#game{
    position:absolute;
    inset:0;
    background:#087a35;
}

#canvas{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    display:block;
    background:#087a35;
}

/* ================= HUD ================= */

#hud{
    position:absolute;
    left:0;
    right:0;
    top:0;
    height:76px;
    z-index:5;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 12px;
    background:linear-gradient(#03140ddd,transparent);
    pointer-events:none;
}

.hudBox{text-align:center}

.hudLabel{
    font-size:9px;
    opacity:.6;
    letter-spacing:1px;
}

#score{
    font-size:24px;
    font-weight:1000;
}

#timer{
    font-size:20px;
    font-weight:900;
}

.energyBar{
    width:82px;
    height:8px;
    overflow:hidden;
    border-radius:10px;
    background:#0008;
    border:1px solid #ffffff44;
}

#energy{
    display:block;
    width:100%;
    height:100%;
    background:#71ff9b;
}

#possession{
    position:absolute;
    top:58px;
    left:50%;
    transform:translateX(-50%);
    font-size:9px;
    font-weight:900;
    letter-spacing:1px;
    padding:4px 8px;
    border-radius:8px;
    background:#06170dcc;
    color:#71ff9b;
}

/* ================= PAUSA ================= */

#pauseButton{
    position:absolute;
    top:82px;
    right:10px;
    z-index:8;
    border:0;
    border-radius:9px;
    padding:8px 12px;
    background:#03140ddd;
    color:white;
    font-weight:900;
}

/* ================= CONTROLES ================= */

#controls{
    position:absolute;
    left:0;
    right:0;
    bottom:8px;
    height:150px;
    z-index:7;
    pointer-events:none;
}

.dpad{
    position:absolute;
    left:14px;
    bottom:2px;
    width:155px;
    height:135px;
    pointer-events:auto;
}

.control{
    position:absolute;
    width:48px;
    height:48px;
    border-radius:12px;
    border:1px solid #ffffff55;
    background:#06170ddd;
    color:white;
    font-size:21px;
    font-weight:900;
}

.up{left:53px;top:0}
.left{left:0;top:45px}
.down{left:53px;top:45px}
.right{left:106px;top:45px}

.actions{
    position:absolute;
    right:13px;
    bottom:12px;
    display:flex;
    align-items:end;
    gap:9px;
    pointer-events:auto;
}

.action{
    width:70px;
    height:70px;
    border-radius:50%;
    border:2px solid #ffffff77;
    background:#092817dd;
    color:white;
    font-weight:900;
    box-shadow:0 0 18px #0008;
}

.action.kick{
    background:#e8b914;
    color:#182008;
}

.action.pass{
    width:59px;
    height:59px;
    background:#8b5cf6;
}

.action.sprint{
    width:59px;
    height:59px;
    background:#0797df;
}

/* ================= OVERLAY ================= */

#overlay{
    position:absolute;
    inset:0;
    z-index:15;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000a;
}

.panel{
    width:86%;
    padding:25px;
    text-align:center;
    border-radius:18px;
    border:1px solid #55ed85;
    background:#07180e;
    box-shadow:0 0 45px #000;
}

.panel h2{
    margin:0 0 12px;
    font-size:32px;
}

.panel p{
    opacity:.8;
    line-height:1.5;
}

.panel button{
    margin:5px;
    padding:13px 20px;
    border:0;
    border-radius:10px;
    background:#18c653;
    color:white;
    font-weight:900;
}

/* ================= GOL ================= */

#goalText{
    position:absolute;
    left:50%;
    top:43%;
    z-index:10;
    transform:translate(-50%,-50%) scale(.4);
    opacity:0;
    pointer-events:none;
    color:white;
    font-size:48px;
    font-weight:1000;
    text-shadow:0 4px 0 #08752e,0 0 30px #fff;
    transition:.25s;
}

#goalText.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.15);
}

@media(min-width:700px){
    #app{border-radius:20px}
}
</style>
</head>

<body>

<div id="app">

<section id="menu">

    <div class="menuGlow"></div>

    <div class="menuContent">

        <div class="logo">
            LAST
            <span>SECOND FC</span>
        </div>

        <div class="version">
            V3.0 • FOOTBALL
        </div>

        <div class="status">
            ● SISTEMA ONLINE
        </div>

        <button class="menuButton" id="playButton">
            ▶ JOGAR
        </button>

        <button class="menuButton secondary" id="howButton">
            ? COMO JOGAR
        </button>

    </div>

</section>


<section id="game" class="hidden">

    <canvas id="canvas"></canvas>

    <div id="hud">

        <div class="hudBox">
            <div class="hudLabel">PLACAR</div>
            <div id="score">0 - 0</div>
        </div>

        <div class="hudBox">
            <div class="hudLabel">TEMPO</div>
            <div id="timer">01:30</div>
        </div>

        <div class="hudBox">
            <div class="hudLabel">ENERGIA</div>
            <div class="energyBar">
                <span id="energy"></span>
            </div>
        </div>

    </div>

    <div id="possession">
        SEM POSSE
    </div>

    <button id="pauseButton">Ⅱ</button>

    <div id="goalText">GOOOOOOL!</div>

    <div id="controls">

        <div class="dpad">

            <button class="control up" data-key="up">▲</button>
            <button class="control left" data-key="left">◀</button>
            <button class="control down" data-key="down">▼</button>
            <button class="control right" data-key="right">▶</button>

        </div>

        <div class="actions">

            <button class="action sprint" data-key="sprint">
                ⚡
            </button>

            <button class="action pass" id="passButton">
                PASSE
            </button>

            <button class="action kick" id="kickButton">
                CHUTE
            </button>

        </div>

    </div>

</section>


<div id="overlay" class="hidden">

    <div class="panel" id="panel"></div>

</div>

</div>


<script>

'use strict';

/* =========================================
   ELEMENTOS
========================================= */

const menu=document.getElementById('menu');
const game=document.getElementById('game');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');

const playButton=document.getElementById('playButton');
const howButton=document.getElementById('howButton');
const pauseButton=document.getElementById('pauseButton');

const kickButton=document.getElementById('kickButton');
const passButton=document.getElementById('passButton');

const overlay=document.getElementById('overlay');
const panel=document.getElementById('panel');

const scoreElement=document.getElementById('score');
const timerElement=document.getElementById('timer');
const energyElement=document.getElementById('energy');
const possessionElement=document.getElementById('possession');
const goalText=document.getElementById('goalText');


/* =========================================
   CANVAS
========================================= */

let W=430;
let H=760;
let dpr=1;


/* =========================================
   ESTADO
========================================= */

let running=false;
let paused=false;

let animationFrame=0;
let lastTime=0;

let timeLeft=90;

let homeScore=0;
let awayScore=0;

let goalCooldown=0;

let bestScore=0;


/* =========================================
   POSSE
========================================= */

let possession='none';


/* =========================================
   CONTROLES
========================================= */

const keys={
    up:false,
    down:false,
    left:false,
    right:false,
    sprint:false
};


/* =========================================
   JOGADOR
========================================= */

const player={
    x:215,
    y:590,
    r:17,

    vx:0,
    vy:0,

    dirX:0,
    dirY:-1,

    energy:100
};


/* =========================================
   COMPANHEIROS
========================================= */

const teammates=[

    {
        x:145,
        y:560,
        r:16,
        number:7
    },

    {
        x:285,
        y:560,
        r:16,
        number:11
    }

];


/* =========================================
   ADVERSÁRIOS
========================================= */

const enemies=[

    {
        x:145,
        y:220,
        r:17,
        number:8,
        speed:100
    },

    {
        x:285,
        y:220,
        r:17,
        number:10,
        speed:105
    },

    {
        x:215,
        y:330,
        r:18,
        number:9,
        speed:115
    }

];


/* =========================================
   GOLEIROS
========================================= */

const homeKeeper={
    x:215,
    y:700,
    r:19,
    number:1
};

const awayKeeper={
    x:215,
    y:62,
    r:19,
    number:1
};


/* =========================================
   BOLA
========================================= */

const ball={
    x:215,
    y:520,
    r:9,
    vx:0,
    vy:0
};


/* =========================================
   PARTICULAS
========================================= */

const particles=[];


/* =========================================
   TAMANHO
========================================= */

function resizeCanvas(){

    const rect=canvas.getBoundingClientRect();

    W=Math.max(280,rect.width);
    H=Math.max(500,rect.height);

    dpr=Math.min(window.devicePixelRatio||1,2);

    canvas.width=Math.floor(W*dpr);
    canvas.height=Math.floor(H*dpr);

    ctx.setTransform(dpr,0,0,dpr,0,0);
}

window.addEventListener('resize',resizeCanvas);


/* =========================================
   TEMPO
========================================= */

function formatTime(seconds){

    seconds=Math.max(0,Math.ceil(seconds));

    const minutes=Math.floor(seconds/60);
    const secs=seconds%60;

    return String(minutes).padStart(2,'0')+
        ':'+
        String(secs).padStart(2,'0');
}


/* =========================================
   HUD
========================================= */

function updateHUD(){

    scoreElement.textContent=
        homeScore+' - '+awayScore;

    timerElement.textContent=
        formatTime(timeLeft);

    energyElement.style.width=
        Math.max(
            0,
            Math.min(100,player.energy)
        )+'%';

    if(possession==='player'){

        possessionElement.textContent=
            '⚽ COM POSSE';

        possessionElement.style.color=
            '#71ff9b';

    }
    else{

        possessionElement.textContent=
            'SEM POSSE';

        possessionElement.style.color=
            '#ffffff88';

    }
}


/* =========================================
   RESET POSIÇÕES
========================================= */

function resetPositions(){

    player.x=W/2;
    player.y=H-175;

    player.vx=0;
    player.vy=0;

    player.dirX=0;
    player.dirY=-1;

    player.energy=100;


    possession='none';


    ball.x=W/2;
    ball.y=H-250;

    ball.vx=0;
    ball.vy=0;


    homeKeeper.x=W/2;
    homeKeeper.y=H-55;


    awayKeeper.x=W/2;
    awayKeeper.y=55;


    teammates[0].x=W*.34;
    teammates[0].y=H*.74;

    teammates[1].x=W*.66;
    teammates[1].y=H*.74;


    enemies[0].x=W*.34;
    enemies[0].y=H*.27;

    enemies[1].x=W*.66;
    enemies[1].y=H*.27;

    enemies[2].x=W/2;
    enemies[2].y=H*.40;


    goalCooldown=1;

    clearKeys();

    updateHUD();
}


/* =========================================
   LIMPAR TECLAS
========================================= */

function clearKeys(){

    keys.up=false;
    keys.down=false;
    keys.left=false;
    keys.right=false;
    keys.sprint=false;
}


/* =========================================
   COMEÇAR
========================================= */

function startMatch(){

    menu.classList.add('hidden');
    game.classList.remove('hidden');

    resizeCanvas();

    homeScore=0;
    awayScore=0;

    timeLeft=90;

    paused=false;
    running=true;

    resetPositions();

    particles.length=0;

    updateHUD();

    lastTime=performance.now();

    cancelAnimationFrame(animationFrame);

    animationFrame=
        requestAnimationFrame(gameLoop);
}


/* =========================================
   JOGAR
========================================= */

playButton.addEventListener(
    'click',
    function(){

        playButton.classList.add('burst');

        setTimeout(
            function(){

                playButton.classList.remove('burst');

                startMatch();

            },
            450
        );

    }
);


/* =========================================
   COMO JOGAR
========================================= */

howButton.addEventListener(
    'click',
    function(){

        panel.innerHTML=`

            <h2>COMO JOGAR</h2>

            <p>

                <b>WASD / SETAS</b><br>
                Movimentar jogador

                <br><br>

                <b>ESPAÇO / CHUTE</b><br>
                Chutar a bola

                <br><br>

                <b>E / PASSE</b><br>
                Passar para um companheiro

                <br><br>

                <b>SHIFT / ⚡</b><br>
                Correr mais rápido

                <br><br>

                <b>NOVA V3</b><br>
                Chegue perto da bola para
                dominar e conduzir.

                <br><br>

                Faça mais gols antes
                do tempo acabar!

            </p>

            <button id="closeHelp">
                ENTENDI
            </button>
        `;

        overlay.classList.remove('hidden');

        document.getElementById('closeHelp').onclick=
            function(){

                overlay.classList.add('hidden');

            };

    }
);


/* =========================================
   MOVIMENTO
========================================= */

function updatePlayer(dt){

    let dx=
        (keys.right?1:0)-
        (keys.left?1:0);

    let dy=
        (keys.down?1:0)-
        (keys.up?1:0);


    const length=Math.hypot(dx,dy);


    if(length>0){

        dx/=length;
        dy/=length;

        player.dirX=dx;
        player.dirY=dy;

    }


    const sprinting=
        keys.sprint &&
        length>0 &&
        player.energy>0;


    const speed=sprinting?285:190;


    if(sprinting){

        player.energy=Math.max(
            0,
            player.energy-38*dt
        );

    }
    else{

        player.energy=Math.min(
            100,
            player.energy+20*dt
        );

    }


    player.vx=dx*speed;
    player.vy=dy*speed;


    player.x+=player.vx*dt;
    player.y+=player.vy*dt;


    player.x=Math.max(
        25,
        Math.min(W-25,player.x)
    );


    /*
       V3:
       agora o jogador pode atravessar
       o meio do campo.
    */

    player.y=Math.max(
        35,
        Math.min(H-38,player.y)
    );


    /*
       Se estiver com a bola,
       ela acompanha o jogador.
    */

    if(possession==='player'){

        updatePossessedBall();

    }
}


/* =========================================
   DOMÍNIO DA BOLA
========================================= */

function updatePossession(){

    if(
        possession!=='none' ||
        goalCooldown>0
    ){

        return;
    }


    const distance=
        Math.hypot(
            ball.x-player.x,
            ball.y-player.y
        );


    const ballSpeed=
        Math.hypot(
            ball.vx,
            ball.vy
        );


    /*
       Só domina automaticamente
       quando a bola não está muito rápida.
    */

    if(
        distance<38 &&
        ballSpeed<230
    ){

        possession='player';

        ball.vx=0;
        ball.vy=0;

        updatePossessedBall();

        burst(
            player.x,
            player.y,
            'DOMÍNIO!'
        );

        updateHUD();

    }
}


/* =========================================
   BOLA COM O JOGADOR
========================================= */

function updatePossessedBall(){

    if(possession!=='player'){
        return;
    }


    const dirLength=
        Math.hypot(
            player.dirX,
            player.dirY
        )||1;


    const dx=
        player.dirX/dirLength;

    const dy=
        player.dirY/dirLength;


    /*
       A bola fica à frente
       do jogador.
    */

    const distance=25;


    ball.x=
        player.x+
        dx*distance;

    ball.y=
        player.y+
        dy*distance;


    ball.vx=player.vx;
    ball.vy=player.vy;
}


/* =========================================
   ADVERSÁRIO ROUBA
========================================= */

function enemySteal(){

    if(possession!=='player'){
        return;
    }


    for(const enemy of enemies){

        const distance=
            Math.hypot(
                enemy.x-player.x,
                enemy.y-player.y
            );


        if(distance<34){

            possession='none';


            const dx=
                player.x-enemy.x;

            const dy=
                player.y-enemy.y;

            const d=
                Math.hypot(dx,dy)||1;


            ball.x=
                player.x+
                dx/d*25;

            ball.y=
                player.y+
                dy/d*25;


            ball.vx=
                dx/d*190;

            ball.vy=
                dy/d*190;


            burst(
                player.x,
                player.y,
                'ROUBADA!'
            );


            updateHUD();

            return;
        }

    }
}


/* =========================================
   COMPANHEIROS
========================================= */

function updateTeammates(dt){

    teammates.forEach(
        function(t,index){

            const targetX=
                index===0
                ? W*.34
                : W*.66;

            let targetY=H*.72;


            if(ball.y<H*.55){
                targetY=H*.60;
            }


            if(
                Math.hypot(
                    t.x-player.x,
                    t.y-player.y
                )<55
            ){

                targetY-=20;

            }


            const dx=targetX-t.x;
            const dy=targetY-t.y;

            const distance=
                Math.hypot(dx,dy);


            if(distance>4){

                t.x+=
                    dx/distance*
                    55*
                    dt;

                t.y+=
                    dy/distance*
                    55*
                    dt;

            }


            t.x=Math.max(
                25,
                Math.min(W-25,t.x)
            );

            t.y=Math.max(
                35,
                Math.min(H-70,t.y)
            );

        }
    );
}


/* =========================================
   ADVERSÁRIOS
========================================= */

function updateEnemies(dt){

    enemies.forEach(
        function(enemy){

            let targetX=ball.x;
            let targetY=ball.y;


            /*
               Quando o jogador tem a bola,
               eles perseguem o jogador.
            */

            if(possession==='player'){

                targetX=player.x;
                targetY=player.y;

            }


            const dx=targetX-enemy.x;
            const dy=targetY-enemy.y;

            const distance=
                Math.hypot(dx,dy)||1;


            enemy.x+=
                dx/distance*
                enemy.speed*
                dt;

            enemy.y+=
                dy/distance*
                enemy.speed*
                dt;


            enemy.x=Math.max(
                25,
                Math.min(W-25,enemy.x)
            );


            enemy.y=Math.max(
                35,
                Math.min(H*.62,enemy.y)
            );


            /*
               Se a bola estiver solta,
               adversário pode disputar.
            */

            if(possession==='none'){

                const bd=
                    Math.hypot(
                        ball.x-enemy.x,
                        ball.y-enemy.y
                    );


                if(
                    bd<
                    enemy.r+
                    ball.r+
                    7
                ){

                    const bx=
                        ball.x-enemy.x;

                    const by=
                        ball.y-enemy.y;

                    const d=
                        Math.hypot(bx,by)||1;


                    ball.vx=
                        bx/d*250;

                    ball.vy=
                        by/d*250;

                }

            }

        }
    );


    enemySteal();
}


/* =========================================
   GOLEIROS
========================================= */

function updateKeepers(dt){

    const difference=
        ball.x-awayKeeper.x;


    awayKeeper.x+=Math.max(
        -180*dt,
        Math.min(180*dt,difference)
    );


    awayKeeper.x=Math.max(
        W/2-70,
        Math.min(W/2+70,awayKeeper.x)
    );


    homeKeeper.x=Math.max(
        W/2-70,
        Math.min(W/2+70,ball.x)
    );


    const ad=
        Math.hypot(
            ball.x-awayKeeper.x,
            ball.y-awayKeeper.y
        );


    if(
        ad<
        awayKeeper.r+
        ball.r+
        6 &&
        ball.y<115 &&
        ball.vy<0
    ){

        ball.vy=
            Math.abs(ball.vy)+220;

        ball.vx+=
            (ball.x-awayKeeper.x)*5;


        possession='none';

        burst(
            ball.x,
            ball.y,
            'DEFESA!'
        );

    }


    const hd=
        Math.hypot(
            ball.x-homeKeeper.x,
            ball.y-homeKeeper.y
        );


    if(
        hd<
        homeKeeper.r+
        ball.r+
        6 &&
        ball.y>H-115 &&
        ball.vy>0
    ){

        ball.vy=
            -Math.abs(ball.vy)-220;

        ball.vx+=
            (ball.x-homeKeeper.x)*5;


        possession='none';

        burst(
            ball.x,
            ball.y,
            'DEFESA!'
        );

    }
}


/* =========================================
   BOLA
========================================= */

function updateBall(dt){

    /*
       Com posse, a bola já foi posicionada
       junto ao jogador.
    */

    if(possession==='player'){

        updatePossessedBall();

        return;
    }


    ball.x+=ball.vx*dt;
    ball.y+=ball.vy*dt;


    const friction=Math.pow(.18,dt);

    ball.vx*=friction;
    ball.vy*=friction;


    if(ball.x<ball.r+12){

        ball.x=ball.r+12;
        ball.vx*= -.65;

    }


    if(ball.x>W-ball.r-12){

        ball.x=W-ball.r-12;
        ball.vx*= -.65;

    }


    if(ball.y<-5){

        if(
            Math.abs(ball.x-W/2)<65
        ){

            scoreGoal('home');

        }
        else{

            ball.y=8;
            ball.vy*= -.6;

        }

    }


    if(ball.y>H+5){

        if(
            Math.abs(ball.x-W/2)<65
        ){

            scoreGoal('away');

        }
        else{

            ball.y=H-8;
            ball.vy*= -.6;

        }

    }


    collideBallWithEntity(
        teammates[0],
        45
    );

    collideBallWithEntity(
        teammates[1],
        45
    );


    /*
       O jogador tenta dominar antes
       da colisão física.
    */

    updatePossession();


    if(possession==='none'){

        collideBallWithEntity(
            enemies[0],
            45
        );

        collideBallWithEntity(
            enemies[1],
            45
        );

        collideBallWithEntity(
            enemies[2],
            45
        );

    }

}


/* =========================================
   COLISÃO
========================================= */

function collideBallWithEntity(
    entity,
    pushPower
){

    const dx=ball.x-entity.x;
    const dy=ball.y-entity.y;

    const distance=
        Math.hypot(dx,dy);


    const minDistance=
        ball.r+entity.r;


    if(
        distance>0 &&
        distance<minDistance
    ){

        const nx=dx/distance;
        const ny=dy/distance;


        ball.x=
            entity.x+
            nx*(minDistance+1);

        ball.y=
            entity.y+
            ny*(minDistance+1);


        ball.vx+=nx*pushPower;
        ball.vy+=ny*pushPower;

    }

}


/* =========================================
   CHUTE
========================================= */

function kickBall(){

    if(
        !running ||
        paused ||
        goalCooldown>0
    ){

        return;
    }


    if(possession==='player'){

        let dx=player.dirX;
        let dy=player.dirY;


        if(
            Math.hypot(dx,dy)<.1
        ){

            dx=0;
            dy=-1;

        }


        const sprinting=
            keys.sprint &&
            player.energy>5;


        /*
           Chute normal = 500
           Chute correndo = 700
        */

        const power=
            sprinting
            ? 700
            : 500;


        ball.x=
            player.x+
            dx*29;

        ball.y=
            player.y+
            dy*29;


        ball.vx=dx*power;
        ball.vy=dy*power;


        possession='none';


        if(sprinting){

            player.energy=
                Math.max(
                    0,
                    player.energy-8
                );

        }


        burst(
            ball.x,
            ball.y,
            sprinting
            ? 'CHUTE FORTE!'
            : 'CHUTE!'
        );


        updateHUD();

        return;
    }


    const dx=
        ball.x-player.x;

    const dy=
        ball.y-player.y;


    const distance=
        Math.hypot(dx,dy);


    if(distance>60){
        return;
    }


    let dirX=player.dirX;
    let dirY=player.dirY;


    if(
        Math.hypot(dirX,dirY)<.1
    ){

        dirX=0;
        dirY=-1;

    }


    ball.vx=dirX*500;
    ball.vy=dirY*500;


    burst(
        ball.x,
        ball.y,
        'CHUTE!'
    );

}


/* =========================================
   PASSE
========================================= */

function passBall(){

    if(
        !running ||
        paused ||
        goalCooldown>0
    ){

        return;
    }


    if(possession!=='player'){

        return;

    }


    let target=teammates[0];


    const distanceA=
        Math.hypot(
            teammates[0].x-player.x,
            teammates[0].y-player.y
        );


    const distanceB=
        Math.hypot(
            teammates[1].x-player.x,
            teammates[1].y-player.y
        );


    if(distanceB<distanceA){
        target=teammates[1];
    }


    const dx=
        target.x-ball.x;

    const dy=
        target.y-ball.y;


    const d=
        Math.hypot(dx,dy)||1;


    ball.x=
        player.x+
        dx/d*28;

    ball.y=
        player.y+
        dy/d*28;


    ball.vx=
        dx/d*390;

    ball.vy=
        dy/d*390;


    possession='none';


    burst(
        ball.x,
        ball.y,
        'PASSE!'
    );


    updateHUD();
}


/* =========================================
   GOL
========================================= */

function scoreGoal(team){

    if(goalCooldown>0){
        return;
    }


    goalCooldown=2;

    possession='none';


    if(team==='home'){

        homeScore++;

        showGoal('GOOOOOL!');

    }
    else{

        awayScore++;

        showGoal(
            'GOL DO ADVERSÁRIO!'
        );

    }


    updateHUD();


    setTimeout(
        function(){

            if(running){
                resetPositions();
            }

        },
        1100
    );

}


/* =========================================
   TEXTO DE GOL
========================================= */

function showGoal(text){

    goalText.textContent=text;

    goalText.classList.add('show');


    burst(
        W/2,
        H/2,
        text
    );


    setTimeout(
        function(){

            goalText.classList.remove(
                'show'
            );

        },
        850
    );

}


/* =========================================
   PARTICULAS
========================================= */

function burst(x,y,text){

    particles.push({

        x:x,
        y:y,

        vx:0,
        vy:-25,

        r:5,

        life:1,

        color:'#ffffff',

        text:text

    });


    for(let i=0;i<18;i++){

        const angle=
            Math.random()*
            Math.PI*
            2;

        const speed=
            60+
            Math.random()*180;


        particles.push({

            x:x,
            y:y,

            vx:
                Math.cos(angle)*
                speed,

            vy:
                Math.sin(angle)*
                speed,

            r:
                2+
                Math.random()*3,

            life:1,

            color:
                i%2
                ? '#71ff9b'
                : '#ffffff'

        });

    }

}


/* =========================================
   ATUALIZA PARTICULAS
========================================= */

function updateParticles(dt){

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p=particles[i];

        p.life-=dt*1.7;

        p.x+=p.vx*dt;
        p.y+=p.vy*dt;

        p.vx*=.94;
        p.vy*=.94;


        if(p.life<=0){

            particles.splice(i,1);

        }

    }

}


/* =========================================
   CAMPO
========================================= */

function drawField(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    ctx.fillStyle='#087a35';

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    const stripeHeight=H/14;


    for(let i=0;i<14;i++){

        ctx.fillStyle=
            i%2===0
            ? '#087a35'
            : '#0a843a';


        ctx.fillRect(
            0,
            i*stripeHeight,
            W,
            stripeHeight
        );

    }


    ctx.strokeStyle=
        'rgba(255,255,255,.88)';

    ctx.lineWidth=2.5;


    ctx.strokeRect(
        10,
        10,
        W-20,
        H-20
    );


    ctx.beginPath();

    ctx.moveTo(
        10,
        H/2
    );

    ctx.lineTo(
        W-10,
        H/2
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.arc(
        W/2,
        H/2,
        58,
        0,
        Math.PI*2
    );

    ctx.stroke();


    ctx.fillStyle='#ffffff';

    ctx.beginPath();

    ctx.arc(
        W/2,
        H/2,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.strokeRect(
        W/2-88,
        10,
        176,
        105
    );


    ctx.strokeRect(
        W/2-88,
        H-115,
        176,
        105
    );


    ctx.strokeRect(
        W/2-48,
        10,
        96,
        52
    );


    ctx.strokeRect(
        W/2-48,
        H-62,
        96,
        52
    );


    ctx.fillStyle=
        'rgba(255,255,255,.95)';


    ctx.fillRect(
        W/2-62,
        0,
        124,
        10
    );


    ctx.fillRect(
        W/2-62,
        H-10,
        124,
        10
    );

}


/* =========================================
   JOGADOR
========================================= */

function drawPlayer(
    entity,
    color,
    number,
    outline
){

    ctx.save();

    ctx.translate(
        entity.x,
        entity.y
    );


    ctx.fillStyle=
        'rgba(0,0,0,.25)';


    ctx.beginPath();

    ctx.ellipse(
        0,
        entity.r+5,
        entity.r,
        6,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle=color;

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        entity.r,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.strokeStyle=
        outline||'#ffffff';

    ctx.lineWidth=2;

    ctx.stroke();


    /*
       Indicador do jogador principal
    */

    if(entity===player){

        ctx.strokeStyle=
            possession==='player'
            ? '#71ff9b'
            : '#ffffff88';

        ctx.lineWidth=3;

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            entity.r+5,
            0,
            Math.PI*2
        );

        ctx.stroke();

    }


    ctx.fillStyle='#ffffff';

    ctx.font='bold 11px Arial';

    ctx.textAlign='center';

    ctx.textBaseline='middle';


    ctx.fillText(
        number,
        0,
        0
    );


    ctx.restore();

}


/* =========================================
   BOLA
========================================= */

function drawBall(){

    ctx.save();


    ctx.translate(
        ball.x,
        ball.y
    );


    ctx.fillStyle=
        'rgba(0,0,0,.25)';


    ctx.beginPath();

    ctx.ellipse(
        2,
        5,
        9,
        4,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Brilho verde quando está
       sob domínio do jogador.
    */

    if(possession==='player'){

        ctx.shadowColor=
            '#71ff9b';

        ctx.shadowBlur=14;

    }


    ctx.fillStyle='#ffffff';

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        ball.r,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.shadowBlur=0;


    ctx.strokeStyle='#222222';

    ctx.lineWidth=1.3;

    ctx.stroke();


    ctx.fillStyle='#171717';

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.restore();

}


/* =========================================
   PARTICULAS DESENHO
========================================= */

function drawParticles(){

    particles.forEach(
        function(p){

            ctx.globalAlpha=
                Math.max(
                    0,
                    p.life
                );


            ctx.fillStyle=p.color;


            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                p.r,
                0,
                Math.PI*2
            );

            ctx.fill();

        }
    );


    ctx.globalAlpha=1;

}


/* =========================================
   DESENHO
========================================= */

function draw(){

    drawField();


    teammates.forEach(
        function(t){

            drawPlayer(
                t,
                '#1575ff',
                t.number
            );

        }
    );


    enemies.forEach(
        function(e){

            drawPlayer(
                e,
                '#e53232',
                e.number
            );

        }
    );


    drawPlayer(
        homeKeeper,
        '#f3c51d',
        homeKeeper.number
    );


    drawPlayer(
        awayKeeper,
        '#f3c51d',
        awayKeeper.number
    );


    drawPlayer(
        player,
        '#116eff',
        '10',
        '#8fd0ff'
    );


    drawBall();

    drawParticles();

}


/* =========================================
   LOOP
========================================= */

function gameLoop(now){

    if(!running){
        return;
    }


    const dt=
        Math.min(
            (now-lastTime)/1000,
            .033
        );


    lastTime=now;


    if(!paused){

        timeLeft-=dt;


        goalCooldown=
            Math.max(
                0,
                goalCooldown-dt
            );


        updatePlayer(dt);

        updateTeammates(dt);

        updateEnemies(dt);

        updateKeepers(dt);

        updateBall(dt);

        updateParticles(dt);


        updateHUD();


        if(timeLeft<=0){

            timeLeft=0;

            draw();

            endMatch();

            return;

        }


        draw();

    }


    animationFrame=
        requestAnimationFrame(
            gameLoop
        );

}


/* =========================================
   PAUSA
========================================= */

function togglePause(){

    if(!running){
        return;
    }


    paused=!paused;


    if(paused){

        panel.innerHTML=`

            <h2>PAUSADO</h2>

            <p>
                A partida está pausada.
            </p>

            <button id="resumeButton">
                CONTINUAR
            </button>

            <button id="quitButton">
                SAIR
            </button>

        `;


        overlay.classList.remove(
            'hidden'
        );


        document
            .getElementById('resumeButton')
            .onclick=
            function(){

                paused=false;

                overlay.classList.add(
                    'hidden'
                );

                lastTime=
                    performance.now();

            };


        document
            .getElementById('quitButton')
            .onclick=
            function(){

                running=false;

                clearKeys();

                overlay.classList.add(
                    'hidden'
                );

                game.classList.add(
                    'hidden'
                );

                menu.classList.remove(
                    'hidden'
                );

            };

    }
    else{

        overlay.classList.add(
            'hidden'
        );

        lastTime=
            performance.now();

    }

}


/* =========================================
   FIM
========================================= */

function endMatch(){

    running=false;

    clearKeys();


    let result;


    if(homeScore>awayScore){

        result='VITÓRIA! 🏆';

    }
    else if(homeScore<awayScore){

        result='DERROTA';

    }
    else{

        result='EMPATE';

    }


    if(homeScore>bestScore){

        bestScore=homeScore;


        try{

            localStorage.setItem(
                'lastSecondFCBestV30',
                String(bestScore)
            );

        }
        catch(error){}

    }


    panel.innerHTML=`

        <h2>${result}</h2>

        <p>

            PLACAR FINAL

            <br>

            <strong
                style="font-size:38px;"
            >
                ${homeScore}
                -
                ${awayScore}
            </strong>

        </p>

        <p>
            Recorde:
            ${bestScore}
            vitória(s)
        </p>

        <button id="againButton">
            JOGAR NOVAMENTE
        </button>

        <button id="menuButton">
            MENU
        </button>

    `;


    overlay.classList.remove(
        'hidden'
    );


    document
        .getElementById('againButton')
        .onclick=
        function(){

            overlay.classList.add(
                'hidden'
            );

            startMatch();

        };


    document
        .getElementById('menuButton')
        .onclick=
        function(){

            overlay.classList.add(
                'hidden'
            );

            game.classList.add(
                'hidden'
            );

            menu.classList.remove(
                'hidden'
            );

        };

}


/* =========================================
   BOTÕES
========================================= */

kickButton.addEventListener(
    'click',
    kickBall
);


passButton.addEventListener(
    'click',
    passBall
);


pauseButton.addEventListener(
    'click',
    togglePause
);


/* =========================================
   TECLADO
========================================= */

document.addEventListener(
    'keydown',
    function(event){

        const key=
            event.key.toLowerCase();


        if(
            key==='arrowup'||
            key==='w'
        ){

            keys.up=true;
            event.preventDefault();

        }


        if(
            key==='arrowdown'||
            key==='s'
        ){

            keys.down=true;
            event.preventDefault();

        }


        if(
            key==='arrowleft'||
            key==='a'
        ){

            keys.left=true;
            event.preventDefault();

        }


        if(
            key==='arrowright'||
            key==='d'
        ){

            keys.right=true;
            event.preventDefault();

        }


        if(key==='shift'){

            keys.sprint=true;
            event.preventDefault();

        }


        if(key===' '){

            kickBall();
            event.preventDefault();

        }


        if(key==='e'){

            passBall();
            event.preventDefault();

        }


        if(key==='p'){

            togglePause();
            event.preventDefault();

        }

    }
);


/* =========================================
   SOLTAR TECLAS
========================================= */

document.addEventListener(
    'keyup',
    function(event){

        const key=
            event.key.toLowerCase();


        if(
            key==='arrowup'||
            key==='w'
        ){
            keys.up=false;
        }


        if(
            key==='arrowdown'||
            key==='s'
        ){
            keys.down=false;
        }


        if(
            key==='arrowleft'||
            key==='a'
        ){
            keys.left=false;
        }


        if(
            key==='arrowright'||
            key==='d'
        ){
            keys.right=false;
        }


        if(key==='shift'){
            keys.sprint=false;
        }

    }
);


/* =========================================
   TOUCH
========================================= */

function bindHold(element,key){

    element.addEventListener(
        'pointerdown',
        function(event){

            event.preventDefault();

            keys[key]=true;


            if(element.setPointerCapture){

                try{

                    element.setPointerCapture(
                        event.pointerId
                    );

                }
                catch(error){}

            }

        }
    );


    [
        'pointerup',
        'pointercancel',
        'pointerleave'
    ]
    .forEach(
        function(eventName){

            element.addEventListener(
                eventName,
                function(event){

                    event.preventDefault();

                    keys[key]=false;

                }
            );

        }
    );

}


document
    .querySelectorAll('[data-key]')
    .forEach(
        function(element){

            bindHold(
                element,
                element.dataset.key
            );

        }
    );


/* =========================================
   RECORD
========================================= */

try{

    bestScore=
        Number(
            localStorage.getItem(
                'lastSecondFCBestV30'
            )||
            localStorage.getItem(
                'lastSecondFCBestV20'
            )||
            localStorage.getItem(
                'lastSecondFCBestV23'
            )||
            0
        );

}
catch(error){

    bestScore=0;

}


/* =========================================
   ESTADO INICIAL
========================================= */

menu.classList.remove('hidden');
game.classList.add('hidden');
overlay.classList.add('hidden');

updateHUD();

</script>
