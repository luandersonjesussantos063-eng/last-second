<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<meta name="theme-color" content="#020617">

<title>LAST SECOND 2.0</title>

<style>

/* =========================
   BASE
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

body{
    background:#020617;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
    touch-action:none;
}

#jogo{
    position:relative;
    width:400px;
    height:600px;
    max-width:100vw;
    max-height:100vh;
    margin:auto;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(30,64,175,.28),
            transparent 25%
        ),
        radial-gradient(
            circle at 80% 70%,
            rgba(126,34,206,.22),
            transparent 30%
        ),
        linear-gradient(
            #020617,
            #07142f,
            #020617
        );
}

/* =========================
   ESTRELAS
========================= */

.estrela{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
    opacity:.7;
    animation:piscando 1.5s infinite alternate;
}

@keyframes piscando{
    from{
        opacity:.2;
    }

    to{
        opacity:1;
    }
}

/* =========================
   MENU
========================= */

#menu{
    position:absolute;
    inset:0;
    z-index:100;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(
            circle at center,
            rgba(30,64,175,.25),
            transparent 50%
        ),
        rgba(0,0,15,.45);
}

.logo{
    font-size:42px;
    font-weight:900;
    letter-spacing:4px;
    color:#67e8f9;

    text-shadow:
        0 0 10px #06b6d4,
        0 0 30px #2563eb;

    margin-bottom:5px;
}

.versao{
    color:#facc15;
    font-size:11px;
    font-weight:bold;
    letter-spacing:3px;
    margin-bottom:8px;
}

.subtitulo{
    color:#94a3b8;
    font-size:12px;
    letter-spacing:3px;
    margin-bottom:30px;
}

#play{
    border:none;

    background:
        linear-gradient(
            135deg,
            #06b6d4,
            #2563eb
        );

    color:white;

    font-size:21px;
    font-weight:bold;

    padding:15px 48px;

    border-radius:12px;

    cursor:pointer;

    box-shadow:
        0 0 15px rgba(6,182,212,.6),
        0 0 35px rgba(37,99,235,.35);
}

#play:active{
    transform:scale(.95);
}

.melhor{
    margin-top:22px;
    color:#64748b;
    font-size:14px;
}

/* =========================
   HUD
========================= */

#hud{
    position:absolute;
    top:0;
    left:0;

    width:100%;

    z-index:50;

    display:none;

    padding:9px;

    justify-content:space-between;
    align-items:flex-start;

    pointer-events:none;
}

.hudBox{
    background:rgba(2,6,23,.72);

    border:1px solid
        rgba(103,232,249,.22);

    border-radius:8px;

    padding:5px 8px;

    min-width:62px;

    text-align:center;
}

.hudLabel{
    color:#64748b;
    font-size:8px;
    letter-spacing:1px;
}

.hudValor{
    color:#e0f2fe;
    font-size:14px;
    font-weight:bold;
}

#vidas{
    color:#fb7185;
    letter-spacing:1px;
}

#xpArea{
    position:absolute;

    left:50%;
    transform:translateX(-50%);

    top:53px;

    width:170px;
    height:6px;

    background:
        rgba(15,23,42,.9);

    border-radius:10px;

    overflow:hidden;

    z-index:55;

    display:none;
}

#xpBar{
    width:0%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            #a855f7,
            #22d3ee
        );

    box-shadow:
        0 0 8px #22d3ee;
}

/* =========================
   NAVE DO JOGADOR
========================= */

#jogador{
    position:absolute;

    width:42px;
    height:52px;

    z-index:20;

    transform:
        translate(-50%,-50%);
}

.naveCorpo{
    position:absolute;

    left:7px;
    top:5px;

    width:28px;
    height:40px;

    background:
        linear-gradient(
            90deg,
            #1e40af,
            #67e8f9,
            #2563eb
        );

    clip-path:
        polygon(
            50% 0%,
            92% 72%,
            72% 65%,
            65% 100%,
            35% 100%,
            28% 65%,
            8% 72%
        );

    filter:
        drop-shadow(0 0 5px #22d3ee)
        drop-shadow(0 0 12px #2563eb);
}

.naveCabine{
    position:absolute;

    width:12px;
    height:18px;

    left:15px;
    top:9px;

    border-radius:50% 50% 40% 40%;

    background:#e0f2fe;

    box-shadow:
        0 0 8px #67e8f9;
}

.asaEsq,
.asaDir{
    position:absolute;

    top:26px;

    width:15px;
    height:13px;

    background:#1d4ed8;
}

.asaEsq{
    left:0;

    clip-path:
        polygon(
            100% 0,
            100% 100%,
            0 100%
        );
}

.asaDir{
    right:0;

    clip-path:
        polygon(
            0 0,
            100% 100%,
            0 100%
        );
}

.motorEsq,
.motorDir{
    position:absolute;

    bottom:-3px;

    width:7px;
    height:13px;

    background:#f97316;

    border-radius:
        0 0 50% 50%;

    box-shadow:
        0 0 10px #f97316;

    animation:
        fogo .08s infinite alternate;
}

.motorEsq{
    left:10px;
}

.motorDir{
    right:10px;
}

@keyframes fogo{

    from{
        height:8px;
        opacity:.7;
    }

    to{
        height:15px;
        opacity:1;
    }
}

/* =========================
   ESCUDO
========================= */

.escudoVisual{
    position:absolute;

    inset:-10px;

    border:2px solid #22d3ee;

    border-radius:50%;

    box-shadow:
        0 0 10px #22d3ee,
        inset 0 0 15px
        rgba(34,211,238,.4);

    animation:
        pulsoEscudo .7s infinite alternate;
}

@keyframes pulsoEscudo{

    from{
        transform:scale(.95);
        opacity:.6;
    }

    to{
        transform:scale(1.08);
        opacity:1;
    }
}

/* =========================
   TIRO
========================= */

.laser{
    position:absolute;

    width:4px;
    height:20px;

    background:#67e8f9;

    border-radius:5px;

    box-shadow:
        0 0 5px #22d3ee,
        0 0 12px #2563eb;

    z-index:17;
}

/* =========================
   TIRO INIMIGO
========================= */

.tiroInimigo{
    position:absolute;

    width:6px;
    height:17px;

    background:#ef4444;

    border-radius:5px;

    box-shadow:
        0 0 7px #ef4444,
        0 0 15px #dc2626;

    z-index:18;
}

/* =========================
   INIMIGO
========================= */

.inimigo{
    position:absolute;
    z-index:15;
}

/* NAVE INIMIGA */

.naveInimiga{
    position:absolute;

    width:42px;
    height:28px;

    background:
        linear-gradient(
            #ef4444,
            #7f1d1d
        );

    border-radius:
        50% 50% 35% 35%;

    box-shadow:
        0 0 8px #ef4444,
        0 0 18px
        rgba(239,68,68,.5);
}

.naveInimiga::before{
    content:"";

    position:absolute;

    width:17px;
    height:10px;

    left:12px;
    top:-4px;

    background:#fca5a5;

    border-radius:
        50% 50% 20% 20%;
}

.luz{
    position:absolute;

    width:6px;
    height:6px;

    border-radius:50%;

    background:#fef08a;

    box-shadow:
        0 0 7px #fef08a;

    bottom:3px;
}

.luz1{
    left:6px;
}

.luz2{
    left:18px;
}

.luz3{
    right:6px;
}

/* =========================
   ALIEN
========================= */

.alien{
    position:absolute;

    width:38px;
    height:43px;

    background:#22c55e;

    border-radius:
        48% 48% 42% 42%;

    box-shadow:
        0 0 10px #22c55e,
        0 0 22px
        rgba(34,197,94,.4);
}

.alien::before{
    content:"";

    position:absolute;

    width:12px;
    height:17px;

    left:5px;
    top:9px;

    background:white;

    border-radius:50%;

    box-shadow:
        16px 0 0 white;
}

.alien::after{
    content:"";

    position:absolute;

    width:6px;
    height:6px;

    left:9px;
    top:14px;

    background:#020617;

    border-radius:50%;

    box-shadow:
        16px 0 0 #020617;
}

.antenna{
    position:absolute;

    width:2px;
    height:9px;

    background:#86efac;

    top:-7px;
}

.ant1{
    left:10px;
    transform:rotate(-20deg);
}

.ant2{
    right:10px;
    transform:rotate(20deg);
}

/* =========================
   ASTEROIDE
========================= */

.asteroide{
    position:absolute;

    width:42px;
    height:42px;

    background:
        radial-gradient(
            circle at 30% 25%,
            #a78bfa 0 8%,
            transparent 9%
        ),
        radial-gradient(
            circle at 70% 65%,
            #4c1d95 0 12%,
            transparent 13%
        ),
        linear-gradient(
            135deg,
            #64748b,
            #312e81
        );

    border-radius:
        42% 58% 51% 49%;

    box-shadow:
        0 0 8px
        rgba(129,140,248,.45);
}

/* =========================
   CRISTAL
========================= */

.cristal{
    position:absolute;

    width:20px;
    height:26px;

    background:
        linear-gradient(
            135deg,
            #67e8f9,
            #2563eb
        );

    clip-path:
        polygon(
            50% 0,
            100% 38%,
            72% 100%,
            28% 100%,
            0 38%
        );

    box-shadow:
        0 0 15px #22d3ee;

    animation:
        girarCristal .8s
        infinite alternate;
}

@keyframes girarCristal{

    from{
        transform:
            rotate(-10deg)
            scale(.9);
    }

    to{
        transform:
            rotate(10deg)
            scale(1.1);
    }
}

/* =========================
   POWERUPS
========================= */

.powerup{
    position:absolute;

    width:30px;
    height:30px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:17px;
    font-weight:bold;

    z-index:14;
}

.shield{
    border:2px solid #22d3ee;

    background:
        rgba(34,211,238,.15);

    box-shadow:
        0 0 15px #22d3ee;
}

.turbo{
    border:2px solid #f97316;

    background:
        rgba(249,115,22,.15);

    box-shadow:
        0 0 15px #f97316;
}

/* =========================
   BOSS
========================= */

#boss{
    position:absolute;

    left:50%;

    top:-120px;

    transform:
        translateX(-50%);

    width:120px;
    height:75px;

    z-index:16;

    display:none;
}

.bossCorpo{
    position:absolute;

    width:120px;
    height:58px;

    background:
        linear-gradient(
            #7e22ce,
            #3b0764
        );

    border-radius:
        50% 50% 35% 35%;

    box-shadow:
        0 0 15px #a855f7,
        0 0 35px
        rgba(168,85,247,.6);
}

.bossCúpula{
    position:absolute;

    width:45px;
    height:28px;

    left:37px;
    top:-12px;

    background:
        linear-gradient(
            #67e8f9,
            #2563eb
        );

    border-radius:
        50% 50% 20% 20%;

    box-shadow:
        0 0 10px #22d3ee;
}

.bossLuz{
    position:absolute;

    width:10px;
    height:10px;

    border-radius:50%;

    background:#facc15;

    box-shadow:
        0 0 10px #facc15;

    bottom:7px;
}

.bossL1{
    left:18px;
}

.bossL2{
    left:55px;
}

.bossL3{
    right:18px;
}

#bossBarArea{
    position:absolute;

    top:72px;

    left:50%;

    transform:
        translateX(-50%);

    width:180px;
    height:9px;

    background:
        rgba(15,23,42,.9);

    border:
        1px solid
        rgba(168,85,247,.5);

    border-radius:10px;

    overflow:hidden;

    display:none;

    z-index:60;
}

#bossBar{
    width:100%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            #ef4444,
            #a855f7
        );

    box-shadow:
        0 0 10px #a855f7;
}

#bossNome{
    position:absolute;

    top:54px;

    left:50%;

    transform:
        translateX(-50%);

    color:#d8b4fe;

    font-size:9px;

    font-weight:bold;

    letter-spacing:2px;

    display:none;

    z-index:60;
}

/* =========================
   PARTICULAS
========================= */

.particula{
    position:absolute;

    width:4px;
    height:4px;

    border-radius:50%;

    background:#67e8f9;

    pointer-events:none;

    z-index:30;
}

.particulaBoss{
    background:#c084fc;
}

/* =========================
   TEXTO
========================= */

.textoFlutuante{
    position:absolute;

    z-index:40;

    color:#67e8f9;

    font-size:14px;

    font-weight:bold;

    pointer-events:none;

    animation:
        subirTexto .7s forwards;
}

@keyframes subirTexto{

    from{
        opacity:1;
        transform:translateY(0);
    }

    to{
        opacity:0;
        transform:translateY(-35px);
    }
}

/* =========================
   PAUSA
========================= */

#pausa{
    position:absolute;

    inset:0;

    z-index:90;

    display:none;

    align-items:center;
    justify-content:center;

    background:
        rgba(2,6,23,.7);

    backdrop-filter:
        blur(4px);
}

.pausaCaixa{
    text-align:center;
}

.pausaCaixa h2{
    color:#67e8f9;

    font-size:30px;

    margin-bottom:8px;
}

.pausaCaixa p{
    color:#94a3b8;

    font-size:13px;
}

/* =========================
   UPGRADE
========================= */

#upgrade{
    position:absolute;

    inset:0;

    z-index:95;

    display:none;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    background:
        rgba(2,6,23,.88);

    backdrop-filter:
        blur(6px);
}

.upgradeTitulo{
    color:#67e8f9;

    font-size:25px;

    font-weight:bold;

    margin-bottom:7px;

    text-shadow:
        0 0 12px #22d3ee;
}

.upgradeSub{
    color:#94a3b8;

    font-size:11px;

    margin-bottom:20px;
}

.upgradeOpcoes{
    width:320px;

    display:flex;

    flex-direction:column;

    gap:10px;
}

.upgradeBtn{
    width:100%;

    padding:13px;

    border:1px solid
        rgba(103,232,249,.3);

    border-radius:10px;

    background:
        rgba(15,23,42,.9);

    color:white;

    text-align:left;

    cursor:pointer;
}

.upgradeBtn:hover{
    background:
        rgba(30,64,175,.6);
}

.upgradeNome{
    display:block;

    color:#67e8f9;

    font-weight:bold;

    font-size:15px;

    margin-bottom:3px;
}

.upgradeDesc{
    display:block;

    color:#94a3b8;

    font-size:11px;
}

/* =========================
   GAME OVER
========================= */

#gameover{
    position:absolute;

    inset:0;

    z-index:100;

    display:none;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    background:
        rgba(2,6,23,.84);

    backdrop-filter:
        blur(5px);
}

.gameoverTitulo{
    color:#fb7185;

    font-size:34px;

    font-weight:900;

    letter-spacing:2px;

    text-shadow:
        0 0 15px #ef4444;

    margin-bottom:10px;
}

.resultado{
    color:#cbd5e1;

    margin:4px;
}

#novoRecorde{
    color:#facc15;

    font-weight:bold;

    margin:12px;

    display:none;
}

#tentar{
    margin-top:20px;

    padding:13px 32px;

    border:none;

    border-radius:10px;

    background:#2563eb;

    color:white;

    font-weight:bold;

    font-size:17px;

    cursor:pointer;
}

/* =========================
   CONTROLES
========================= */

#controles{
    position:absolute;

    bottom:15px;
    left:0;

    width:100%;

    z-index:70;

    display:none;

    justify-content:
        space-between;

    padding:0 18px;
}

.controle{
    width:70px;
    height:52px;

    border-radius:15px;

    border:
        1px solid
        rgba(103,232,249,.3);

    background:
        rgba(15,23,42,.65);

    color:#67e8f9;

    font-size:23px;

    font-weight:bold;
}

.controle:active{
    background:
        rgba(37,99,235,.55);

    transform:scale(.94);
}

#botaoTiro{
    position:absolute;

    bottom:16px;

    left:50%;

    transform:
        translateX(-50%);

    width:70px;
    height:52px;

    border-radius:50%;

    border:
        1px solid
        rgba(248,113,113,.5);

    background:
        rgba(127,29,29,.55);

    color:#fca5a5;

    font-size:22px;

    z-index:70;

    display:none;
}

/* =========================
   BARRA TURBO
========================= */

#barraTurbo{
    position:absolute;

    left:50%;

    transform:
        translateX(-50%);

    bottom:82px;

    width:130px;
    height:7px;

    background:
        rgba(15,23,42,.8);

    border-radius:10px;

    overflow:hidden;

    display:none;

    z-index:60;
}

#turboProgresso{
    width:0%;

    height:100%;

    background:#f97316;

    box-shadow:
        0 0 8px #f97316;
}

/* =========================
   RESPONSIVO
========================= */

@media(max-height:650px){

    #jogo{
        height:100vh;
    }
}

</style>

</head>

<body>

<div id="jogo">

    <!-- MENU -->

    <div id="menu">

        <div class="logo">
            LAST SECOND
        </div>

        <div class="versao">
            VERSION 2.0
        </div>

        <div class="subtitulo">
            SPACE WAR
        </div>

        <button id="play">
            🚀 PLAY
        </button>

        <div class="melhor">
            BEST:
            <span id="melhorMenu">0</span>
        </div>

    </div>


    <!-- HUD -->

    <div id="hud">

        <div class="hudBox">

            <div class="hudLabel">
                SCORE
            </div>

            <div
                class="hudValor"
                id="score">
                0
            </div>

        </div>


        <div class="hudBox">

            <div class="hudLabel">
                WAVE
            </div>

            <div
                class="hudValor"
                id="wave">
                1
            </div>

        </div>


        <div class="hudBox">

            <div class="hudLabel">
                LV
            </div>

            <div
                class="hudValor"
                id="nivel">
                1
            </div>

        </div>


        <div class="hudBox">

            <div class="hudLabel">
                ❤️
            </div>

            <div
                class="hudValor"
                id="vidas">
                ❤️❤️❤️
            </div>

        </div>

    </div>


    <!-- XP -->

    <div id="xpArea">

        <div id="xpBar"></div>

    </div>


    <!-- NAVE -->

    <div id="jogador">

        <div class="naveCorpo"></div>

        <div class="naveCabine"></div>

        <div class="asaEsq"></div>

        <div class="asaDir"></div>

        <div class="motorEsq"></div>

        <div class="motorDir"></div>

        <div
            class="escudoVisual"
            id="escudoVisual"
            style="display:none">
        </div>

    </div>


    <!-- BOSS -->

    <div id="boss">

        <div class="bossCorpo"></div>

        <div class="bossCúpula"></div>

        <div class="bossLuz bossL1"></div>

        <div class="bossLuz bossL2"></div>

        <div class="bossLuz bossL3"></div>

    </div>


    <div id="bossNome">
        👾 ALIEN COMMANDER
    </div>


    <div id="bossBarArea">

        <div id="bossBar"></div>

    </div>


    <!-- TURBO -->

    <div id="barraTurbo">

        <div id="turboProgresso"></div>

    </div>


    <!-- CONTROLES -->

    <div id="controles">

        <button
            class="controle"
            id="esquerda">
            ◀
        </button>

        <button
            id="botaoTiro">
            🔥
        </button>

        <button
            class="controle"
            id="direita">
            ▶
        </button>

    </div>


    <!-- PAUSA -->

    <div id="pausa">

        <div class="pausaCaixa">

            <h2>
                PAUSED
            </h2>

            <p>
                Pressione P para continuar
            </p>

        </div>

    </div>


    <!-- UPGRADE -->

    <div id="upgrade">

        <div class="upgradeTitulo">
            ⬆️ LEVEL UP!
        </div>

        <div class="upgradeSub">
            Escolha uma melhoria

function criarAudio(){

    if(!somContexto){

        try{

            somContexto =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }catch(e){

            somContexto = null;
        }
    }

    if(
        somContexto &&
        somContexto.state === "suspended"
    ){

        somContexto.resume();
    }
}


function som(
    frequencia,
    duracao = .08,
    tipo = "sine",
    volume = .04
){

    if(!somContexto)
        return;

    try{

        const oscilador =
            somContexto.createOscillator();

        const ganho =
            somContexto.createGain();

        oscilador.type =
            tipo;

        oscilador.frequency.value =
            frequencia;

        ganho.gain.value =
            volume;

        oscilador.connect(
            ganho
        );

        ganho.connect(
            somContexto.destination
        );

        oscilador.start();

        ganho.gain.exponentialRampToValueAtTime(
            .001,
            somContexto.currentTime +
            duracao
        );

        oscilador.stop(
            somContexto.currentTime +
            duracao
        );

    }catch(e){}
}

        Math.max(
            .12,
            .35 -

            .045
        );

    if(tiroTimer > 0)
        return;

    tiroTimer =
        cadencia;

    const dano =
        1 +
        upgradesEscolhidos.dano;

    const quantidade =
        upgradesEscolhidos.cadencia >= 4
        ? 2
        : 1;

    for(
        let i = 0;
        i < quantidade;
        i++
    ){

        const elemento =
            document.createElement(
                "div"

        elemento.className =
            "laser";

        const deslocamento =

            : 0;

            x:
                jogadorX +
                deslocamento -

            y:

/* =========================

function destruirInimigo(

    dano
){

    inimigo.vida -= dano;

    explodir(
        inimigo.x +
        inimigo.largura / 2,

        inimigo.y +
        inimigo.altura / 2
    );

    if(inimigo.vida > 0){

        som(
            220,
            .05,
            "square",
            .025
        );

        return;
    }

    const ganho =
        inimigo.tipo === "asteroide"
        ? 20
        : 15;

    score += ganho;

    ganharXP(
        inimigo.tipo === "alien"
        ? 18
        : 12
    );

    mostrarTexto(
        "+" + ganho,
        inimigo.x,
        inimigo.y
    );

    som(
        inimigo.tipo === "alien"
        ? 500
        : 300,
        .1,
        "sawtooth",
        .04
    );

    inimigo.elemento.remove();

    inimigos.splice(
        indice,

    if(
        Math.random() < .12

/* =========================
   ATUALIZAR INIMIGOS

function atualizarInimigos(delta){

    for(

        i >= 0;
        i--
    ){

        const inimigo =
            inimigos[i];

        inimigo.y +=
            inimigo.velocidade *
            delta;

        if(
            inimigo.tipo ===
            "alien"
        ){

            inimigo.x +=
                Math.sin(
                    tempoDecorrido *
                    4 +
                    inimigo.fase
                ) *
                75 *
                delta;
        }

        if(
            inimigo.tipo ===
            "nave"
        ){

            inimigo.x +=
                inimigo.direcao *
                18 *
                delta;

            if(
                inimigo.x < 5 ||
                inimigo.x > 350
            ){

                inimigo.direcao *=
                    -1;
            }
        }

        atualizarElemento(
            inimigo
        );

        if(inimigo.y > 650){

                40,

                inimigo.y,
                inimigo.largura,

/* =========================
   DANO
========================= */

function receberDano(
    inimigo,
    indice
){

    if(
        escudoTempo > 0 ||
        invencivelTempo > 0
    ){

        explodir(
            inimigo.x +
            inimigo.largura / 2,

            inimigo.y +
            inimigo.altura / 2
        );

        score += 5;

        scoreElemento.textContent =
            Math.floor(score);

        inimigo.elemento.remove();

        inimigos.splice(
            indice,
            1
        );

        som(
            300,
            .1,
            "square",
            .04
        );

        return;
    }

    vidas--;

    atualizarVidas();

    invencivelTempo =
        1.5;

    explodir(
        jogadorX,
        jogadorY
    );

    som(
        100,
        .3,
        "sawtooth",
        .07
    );

    inimigo.elemento.remove();

    inimigos.splice(
        indice,
        1
    );

    jogador.style.opacity =
        ".35";

    setTimeout(
        () => {

            if(rodando){

                jogador.style.opacity =
                    "1";
            }

        },
        150
    );

    if(vidas <= 0){

        finalizarJogo();
    }
}


function receberDanoDireto(){

    if(
        escudoTempo > 0 ||
        invencivelTempo > 0
    ){

        explodir(
            jogadorX,
            jogadorY
        );

        som(
            400,
            .1,
            "square",
            .04
        );

        return;
    }

    vidas--;

    atualizarVidas();

    invencivelTempo =
        1.5;

    explodir(
        jogadorX,
        jogadorY
    );

    som(
        100,
        .3,
        "sawtooth",
        .07
    );

    if(vidas <= 0){

        finalizarJogo();
    }
}

function iniciarBoss(){

        return;

    bossAtivo = true;

    bossVidaMax =

    bossVida =

    bossX = 200;

    bossTiroTimer = 1;

    boss.style.display =

    bossBarArea.style.display =

    atualizarBoss();

    som(

    );

function atualizarBoss(){

    boss.style.left =
        bossX + "px";

    boss.style.top =
        bossY + "px";

    const porcentagem =
        Math.max(
            0,
            bossVida /
            bossVidaMax *
            100
        );

    bossBar.style.width =
        porcentagem + "%";
}


function atualizarBossJogo(
    delta
){

    if(!bossAtivo)
        return;

    bossX +=
        bossDirecao *
        65 *
        delta;

    if(
        bossX < 75 ||
        bossX > 325
    ){

        bossDirecao *=
            -1;
    }

    /*
     * O chefe tenta ficar
     * próximo da nave.
     */

    if(
        bossX <
        jogadorX - 20
    ){

        bossX +=
            18 * delta;
    }

    if(
        bossX >
        jogadorX + 20
    ){

        bossX -=
            18 * delta;
    }

    bossTiroTimer -=
        delta;

    if(bossTiroTimer <= 0){

        criarTiroInimigo();

        bossTiroTimer =
            Math.max(
                .35,
                .9 -
                wave * .025
            );
    }

    atualizarBoss();
}


function danoBoss(
    dano
){

    if(!bossAtivo)
        return;

    bossVida -=
        dano;

    ganharXP(5);

    explodir(
        bossX +
        (Math.random() * 70 - 35),

        bossY +
        (Math.random() * 30 - 15)
    );

    som(
        180,
        .05,
        "square",
        .03
    );

    if(bossVida <= 0){

        derrotarBoss();
    }

    atualizarBoss();
}


function derrotarBoss(){

    bossAtivo = false;

    score +=
        300 +
        wave * 30;

    ganharXP(100);

    for(
        let i = 0;
        i < 45;
        i++
    ){

        explodir(
            bossX +
            (Math.random() * 100 - 50),

            bossY +
            (Math.random() * 50 - 25)
        );
    }

    mostrarTexto(
        "BOSS DEFEATED!",
        bossX - 55,
        bossY
    );

    som(
        70,
        .8,
        "sawtooth",
        .08
    );

    boss.style.display =
        "none";

    bossBarArea.style.display =
        "none";

    bossNome.style.display =
        "none";

    tirosInimigos.forEach(
        tiro =>
            tiro.elemento.remove()
    );

    tirosInimigos = [];

    vidas = Math.min(
        3,
        vidas + 1
    );

    atualizarVidas();
}

            cristal.elemento.remove();

        if(

                40,

                cristal.y,
                20,
                26
            )

            score += 10;

                "+10 ENERGY",
                cristal.x,
                cristal.y
            );

            som(
                700,
                .1,
                "square",
                .04
            );

            cristal.elemento.remove();

            cristais.splice(
                i,
                1
            );
        }
    }
}


/* =========================
   POWERUPS
========================= */

function criarPowerup(){

    const elemento =
        document.createElement(
            "div"
        );

    const ehEscudo =
        Math.random() < .5;

    elemento.className =
        "powerup " +
        (
            ehEscudo
            ? "shield"
            : "turbo"
        );

    elemento.textContent =
        ehEscudo
        ? "🛡️"
        : "⚡";

    const objeto = {

        elemento:elemento,

        tipo:
            ehEscudo
            ? "escudo"
            : "turbo",

        x:
            30 +
            Math.random() *
            340,

        y:-40,

        velocidade:
            velocidadeBase *
            .7
    };

    powerups.push(
        objeto
    );

    jogo.appendChild(
        elemento
    );

    atualizarElemento(
        objeto
    );
}


function atualizarPowerups(
    delta
){

    for(
        let i =
            powerups.length - 1;
        i >= 0;
        i--
    ){

        const powerup =
            powerups[i];

        powerup.y +=
            powerup.velocidade *
            delta;

        atualizarElemento(
            powerup
        );

        if(powerup.y > 650){

            powerup.elemento.remove();

            powerups.splice(
                i,
                1
            );

            continue;
        }

        if(
            colidiu(
                jogadorX - 17,
                jogadorY - 20,
                34,
                40,

                powerup.x,
                powerup.y,
                30,
                30
            )
        ){

            if(
                powerup.tipo ===
                "escudo"
            ){

                escudoTempo =
                    7 +
                    upgradesEscolhidos.escudo;

                escudoVisual.style.display =
                    "block";

                mostrarTexto(
                    "SHIELD!",
                    powerup.x,
                    powerup.y
                );

                som(
                    500,
                    .18,
                    "sine",
                    .05
                );

            }else{

                turboTempo = 5;

                mostrarTexto(
                    "TURBO!",
                    powerup.x,
                    powerup.y
                );

                som(
                    900,
                    .18,
                    "sawtooth",
                    .04
                );
            }

            powerup.elemento.remove();

            powerups.splice(
                i,
                1
            );
        }
    }
}


/* =========================
   XP
========================= */

function ganharXP(
    quantidade
){

    xp +=
        quantidade *
        (
            1 +
            upgradesEscolhidos.xp *
            .2
        );

    verificarNivel();
}


function verificarNivel(){

    if(
        xp >=
        xpNecessario
    ){

        xp -=
            xpNecessario;

        nivel++;

        xpNecessario =
            Math.floor(
                xpNecessario *
                1.28
            );

        nivelElemento.textContent =
            nivel;

        mostrarUpgrade();
    }

    atualizarXP();
}


function atualizarXP(){

    const porcentagem =
        Math.min(
            100,
            xp /
            xpNecessario *
            100
        );

    xpBar.style.width =
        porcentagem + "%";
}


/* =========================
   UPGRADES
========================= */

function mostrarUpgrade(){

    emUpgrade = true;

    pararMusica();

    upgrade.style.display =
        "flex";

    upgradeOpcoes.innerHTML =
        "";

    const opcoes = [
        {
            nome:"🔫 PLASMA POWER",
            desc:"+1 dano por tiro",
            acao:"dano"
        },
        {
            nome:"⚡ ENGINE",
            desc:"+35 velocidade de movimento",
            acao:"velocidade"
        },
        {
            nome:"🔥 RAPID FIRE",
            desc:"Atira mais rápido",
            acao:"cadencia"
        },
        {
            nome:"❤️ HULL",
            desc:"+1 vida máxima e recupera 1 vida",
            acao:"vida"
        },
        {
            nome:"🛡️ FORCE FIELD",
            desc:"+1 segundo no escudo",
            acao:"escudo"
        },
        {
            nome:"💎 ENERGY CORE",
            desc:"+20% XP recebido",
            acao:"xp"
        }
    ];

    const embaralhadas =
        opcoes
        .sort(
            () =>
                Math.random() -
                .5
        )
        .slice(0,3);

    embaralhadas.forEach(
        opcao => {

            const botao =
                document.createElement(
                    "button"
                );

            botao.className =
                "upgradeBtn";

            botao.innerHTML = `
                <span class="upgradeNome">
                    ${opcao.nome}
                </span>

                <span class="upgradeDesc">
                    ${opcao.desc}
                </span>
            `;

            botao.addEventListener(
                "click",
                () => {

                    aplicarUpgrade(
                        opcao.acao
                    );
                }
            );

            upgradeOpcoes.appendChild(
                botao
            );
        }
    );
}


function aplicarUpgrade(
    tipo
){

    if(tipo === "dano"){

        upgradesEscolhidos.dano++;

    }

    if(tipo === "velocidade"){

        upgradesEscolhidos.velocidade++;

        jogadorVelocidade +=
            35;
    }

    if(tipo === "cadencia"){

        upgradesEscolhidos.cadencia++;
    }

    if(tipo === "vida"){

        upgradesEscolhidos.vida++;

        vidas =
            Math.min(
                5,
                vidas + 1
            );

        atualizarVidas();
    }

    if(tipo === "escudo"){

        upgradesEscolhidos.escudo++;
    }

    if(tipo === "xp"){

        upgradesEscolhidos.xp++;
    }

    upgrade.style.display =
        "none";

    emUpgrade = false;

    iniciarMusica();
}


/* =========================
   PARTICULAS
========================= */

function explodir(
    x,
    y
){

    for(
        let i = 0;
        i < 10;
        i++
    ){

        const elemento =
            document.createElement(
                "div"
            );

        elemento.className =
            "particula";

        elemento.style.left =
            x + "px";

        elemento.style.top =
            y + "px";

        jogo.appendChild(
            elemento
        );

        const angulo =
            Math.random() *
            Math.PI *
            2;

        const velocidade =
            40 +
            Math.random() *
            100;

        particulas.push({

            elemento:elemento,

            x:x,

            y:y,

            vx:
                Math.cos(angulo) *
                velocidade,

            vy:
                Math.sin(angulo) *
                velocidade,

            vida:.5
        });
    }
}


function atualizarParticulas(
    delta
){

    for(
        let i =
            particulas.length - 1;
        i >= 0;
        i--
    ){

        const p =
            particulas[i];

        p.vida -=
            delta;

        p.x +=
            p.vx *
            delta;

        p.y +=
            p.vy *
            delta;

        p.vy +=
            80 *
            delta;

        p.elemento.style.left =
            p.x + "px";

        p.elemento.style.top =
            p.y + "px";

        p.elemento.style.opacity =
            Math.max(
                0,
                p.vida * 2
            );

        if(p.vida <= 0){

            p.elemento.remove();

            particulas.splice(
                i,
                1
            );
        }
    }
}


/* =========================
   TEXTO
========================= */

function mostrarTexto(
    texto,
    x,
    y
){

    const elemento =
        document.createElement(
            "div"
        );

    elemento.className =
        "textoFlutuante";

    elemento.textContent =
        texto;

    elemento.style.left =
        x + "px";

    elemento.style.top =
        y + "px";

    jogo.appendChild(
        elemento
    );

    setTimeout(
        () =>
            elemento.remove(),
        700
    );
}


/* =========================
   ELEMENTO
========================= */

function atualizarElemento(
    objeto
){

    objeto.elemento.style.left =
        objeto.x + "px";

    objeto.elemento.style.top =
        objeto.y + "px";
}


/* =========================
   COLISÃO
========================= */

function colidiu(
    ax,
    ay,
    aw,
    ah,

    bx,
    by,
    bw,
    bh
){

    return (
        ax < bx + bw &&
        ax + aw > bx &&
        ay < by + bh &&
        ay + ah > by
    );
}


/* =========================
   VIDAS
========================= */

function atualizarVidas(){

    let texto = "";

    for(
        let i = 0;
        i < vidas;
        i++
    ){

        texto +=
            "❤️";
    }

    vidasElemento.textContent =
        texto;
}


/* =========================
   TURBO
========================= */

function atualizarTurbo(
    delta
){

    if(turboTempo > 0){

        turboTempo -=
            delta;

        barraTurbo.style.display =
            "block";

        turboProgresso.style.width =
            Math.max(
                0,
                turboTempo /
                5 *
                100
            ) + "%";

        jogador.style.transform =
            "translate(-50%,-50%) scale(1.08)";

    }else{

        barraTurbo.style.display =
            "none";

        turboProgresso.style.width =
            "0%";

        jogador.style.transform =
            "translate(-50%,-50%)";
    }
}


/* =========================
   ESCUDO
========================= */

function atualizarEscudo(
    delta
){

    if(escudoTempo > 0){

        escudoTempo -=
            delta;

        escudoVisual.style.display =
            "block";

    }else{

        escudoVisual.style.display =
            "none";
    }
}


/* =========================
   WAVE
========================= */

function atualizarDificuldade(){

    wave =
        Math.floor(
            tempoDecorrido /
            15
        ) + 1;

    /*
     * Chefão a cada 5 waves.
     */

    if(
        wave > 1 &&
        wave % 5 === 0 &&
        !bossAtivo &&
        bossTimer === 0
    ){

        iniciarBoss();

        bossTimer = 1;
    }

    if(
        wave % 5 !== 0
    ){

        bossTimer = 0;
    }

    waveElemento.textContent =
        wave;

    velocidadeBase =
        150 +
        (wave - 1) *
        18;
}


/* =========================
   LIMPAR
========================= */

function limparObjetos(){

    inimigos.forEach(
        item =>
            item.elemento.remove()
    );

    tiros.forEach(
        item =>
            item.elemento.remove()
    );

    tirosInimigos.forEach(
        item =>
            item.elemento.remove()
    );

    cristais.forEach(
        item =>
            item.elemento.remove()
    );

    powerups.forEach(
        item =>
            item.elemento.remove()
    );

    particulas.forEach(
        item =>
            item.elemento.remove()
    );

    inimigos = [];

    tiros = [];

    tirosInimigos = [];

    cristais = [];

    powerups = [];

    particulas = [];
}


/* =========================
   GAME LOOP
========================= */

function loop(
    tempo
){

    if(!rodando)
        return;

    if(!ultimoTempo)
        ultimoTempo = tempo;

    let delta =
        (tempo -
        ultimoTempo) /
        1000;

    ultimoTempo =
        tempo;

    if(delta > .05)
        delta = .05;

    if(
        !pausado &&
        !emUpgrade
    ){

        tempoDecorrido +=
            delta;

        atualizarDificuldade();

        atualizarJogador();

        atualizarInimigos(
            delta
        );

        atualizarTiros(
            delta
        );

        atualizarTirosInimigos(
            delta
        );

        atualizarCristais(
            delta
        );

        atualizarPowerups(
            delta
        );

        atualizarParticulas(
            delta
        );

        atualizarTurbo(
            delta
        );

        atualizarEscudo(
            delta
        );

        atualizarBossJogo(
            delta
        );

        if(invencivelTempo > 0){

            invencivelTempo -=
                delta;
        }

        if(tiroTimer > 0){

            tiroTimer -=
                delta;
        }

        /*
         * Disparo automático
         * quando o botão está pressionado.
         */

        if(atirando){

            disparar();
        }

        /*
         * Pontuação pelo tempo.
         */

        score +=
            delta *
            (
                turboTempo > 0
                ? 16
                : 10
            );

        scoreElemento.textContent =
            Math.floor(score);

        /*
         * Spawn.
         */

        spawnTimer +=
            delta;

        const intervalo =
            Math.max(
                .28,
                .95 -
                wave *
                .045
            );

        if(
            spawnTimer >=
            intervalo
        ){

            spawnTimer = 0;

            criarInimigo();

            if(
                wave >= 5 &&
                Math.random() < .18
            ){

                setTimeout(
                    () => {

                        if(
                            rodando &&
                            !pausado &&
                            !emUpgrade &&
                            !bossAtivo
                        ){

                            criarInimigo();
                        }

                    },
                    180
                );
            }
        }

        /*
         * Cristais.
         */

        cristalTimer +=
            delta;

        if(
            cristalTimer >=
            1.8
        ){

            cristalTimer = 0;

            criarCristal();
        }

        /*
         * Powerups.
         */

        powerupTimer +=
            delta;

        if(
            powerupTimer >=
            9
        ){

            powerupTimer = 0;

            if(
                Math.random() <
                .7
            ){

                criarPowerup();
            }
        }
    }

    requestAnimationFrame(
        loop
    );
}


/* =========================
   INICIAR
========================= */

function iniciarJogo(){

    criarAudio();

    pararMusica();

    limparObjetos();

    score = 0;

    vidas = 3;

    wave = 1;

    nivel = 1;

    xp = 0;

    xpNecessario = 100;

    tempoDecorrido = 0;

    velocidadeBase = 150;

    jogadorVelocidade = 280;

    spawnTimer = 0;

    cristalTimer = 0;

    powerupTimer = 0;

    tiroTimer = 0;

    bossTimer = 0;

    escudoTempo = 0;

    turboTempo = 0;

    invencivelTempo = 0;

    jogadorX = 200;

    jogadorY = 520;

    bossAtivo = false;

    bossVida = 0;

    emUpgrade = false;

    pausado = false;

    rodando = true;

    ultimoTempo = 0;

    atirando = false;

    upgradesEscolhidos = {

        dano:0,

        velocidade:0,

        cadencia:0,

        vida:0,

        escudo:0,

        xp:0
    };

    menu.style.display =
        "none";

    gameover.style.display =
        "none";

    pausa.style.display =
        "none";

    upgrade.style.display =
        "none";

    hud.style.display =
        "flex";

    xpArea.style.display =
        "block";

    atualizarVidas();

    atualizarXP();

    scoreElemento.textContent =
        "0";

    waveElemento.textContent =
        "1";

    nivelElemento.textContent =
        "1";

    jogador.style.opacity =
        "1";

    jogador.style.left =
        jogadorX + "px";

    jogador.style.top =
        jogadorY + "px";

    boss.style.display =
        "none";

    bossBarArea.style.display =
        "none";

    bossNome.style.display =
        "none";

    if(
        "ontouchstart" in window ||
        navigator.maxTouchPoints > 0
    ){

        controles.style.display =
            "flex";

        botaoTiro.style.display =
            "block";
    }

    iniciarMusica();

    requestAnimationFrame(
        loop
    );
}


/* =========================
   GAME OVER
========================= */

function finalizarJogo(){

    rodando = false;

    pausado = false;

    emUpgrade = false;

    atirando = false;

    pararMusica();

    const pontuacao =
        Math.floor(score);

    let recordeNovo = false;

    if(
        pontuacao >
        melhor
    ){

        melhor =
            pontuacao;

        recordeNovo = true;

        try{

            localStorage.setItem(
                "lastSecondBest",
                melhor
            );

        }catch(e){}
    }

    scoreFinal.textContent =
        pontuacao;

    bestFinal.textContent =
        melhor;

    melhorMenu.textContent =
        melhor;

    novoRecorde.style.display =
        recordeNovo
        ? "block"
        : "none";

    hud.style.display =
        "none";

    xpArea.style.display =
        "none";

    controles.style.display =
        "none";

    upgrade.style.display =
        "none";

    boss.style.display =
        "none";

    bossBarArea.style.display =
        "none";

    bossNome.style.display =
        "none";

    gameover.style.display =
        "flex";
}


/* =========================
   PAUSA
========================= */

function alternarPausa(){

    if(
        !rodando ||
        emUpgrade
    ){

        return;
    }

    pausado =
        !pausado;

    pausa.style.display =
        pausado
        ? "flex"
        : "none";

    if(pausado){

        pararMusica();

    }else{

        iniciarMusica();

        ultimoTempo =
            performance.now();
    }
}


/* =========================
   TECLADO
========================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "ArrowLeft" ||
            event.key.toLowerCase() ===
            "a"
        ){

            movimentoEsquerda =
                true;
        }

        if(
            event.key ===
            "ArrowRight" ||
            event.key.toLowerCase() ===
            "d"
        ){

            movimentoDireita =
                true;
        }

        if(
            event.code ===
            "Space"
        ){

            event.preventDefault();

            atirando =
                true;

            disparar();
        }

        if(
            event.key.toLowerCase() ===
            "p"
        ){

            alternarPausa();
        }
    }
);


document.addEventListener(
    "keyup",
    function(event){

        if(
            event.key ===
            "ArrowLeft" ||
            event.key.toLowerCase() ===
            "a"
        ){

            movimentoEsquerda =
                false;
        }

        if(
            event.key ===
            "ArrowRight" ||
            event.key.toLowerCase() ===
            "d"
        ){

            movimentoDireita =
                false;
        }

        if(
            event.code ===
            "Space"
        ){

            atirando =
                false;
        }
    }
);


/* =========================
   CONTROLES MOBILE
========================= */

const botaoEsquerda =
    document.getElementById(
        "esquerda"
    );

const botaoDireita =
    document.getElementById(
        "direita"
    );


function pressionarEsquerda(
    event
){

    event.preventDefault();

    movimentoEsquerda =
        true;
}


function soltarEsquerda(
    event
){

    event.preventDefault();

    movimentoEsquerda =
        false;
}


function pressionarDireita(
    event
){

    event.preventDefault();

    movimentoDireita =
        true;
}


function soltarDireita(
    event
){

    event.preventDefault();

    movimentoDireita =
        false;
}


function pressionarTiro(
    event
){

    event.preventDefault();

    atirando =
        true;

    disparar();
}


function soltarTiro(
    event
){

    event.preventDefault();

    atirando =
        false;
}


/* ESQUERDA */

botaoEsquerda.addEventListener(
    "pointerdown",
    pressionarEsquerda
);

botaoEsquerda.addEventListener(
    "pointerup",
    soltarEsquerda
);

botaoEsquerda.addEventListener(
    "pointercancel",
    soltarEsquerda
);

botaoEsquerda.addEventListener(
    "pointerleave",
    soltarEsquerda
);


/* DIREITA */

botaoDireita.addEventListener(
    "pointerdown",
    pressionarDireita
);

botaoDireita.addEventListener(
    "pointerup",
    soltarDireita
);

botaoDireita.addEventListener(
    "pointercancel",
    soltarDireita
);

botaoDireita.addEventListener(
    "pointerleave",
    soltarDireita
);


/* TIRO */

botaoTiro.addEventListener(
    "pointerdown",
    pressionarTiro
);

botaoTiro.addEventListener(
    "pointerup",
    soltarTiro
);

botaoTiro.addEventListener(
    "pointercancel",
    soltarTiro
);

botaoTiro.addEventListener(
    "pointerleave",
    soltarTiro
);


/* =========================
   BOTÕES
========================= */

play.addEventListener(
    "click",
    iniciarJogo
);

tentar.addEventListener(
    "click",
    iniciarJogo
);


/* =========================
   INICIALIZAÇÃO
========================= */

jogador.style.left =
    jogadorX + "px";

jogador.style.top =
    jogadorY + "px";

</script>
