<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0,
maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#020617">

<title>LAST SECOND</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

body{
    background:#020617;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
    touch-action:none;
}

#jogo{
    position:relative;
    width:400px;
    height:600px;
    max-width:100vw;
    max-height:100vh;
    margin:auto;
    overflow:hidden;
    background:
        radial-gradient(circle at 20% 20%,rgba(30,64,175,.25),transparent 25%),
        radial-gradient(circle at 80% 70%,rgba(126,34,206,.18),transparent 30%),
        linear-gradient(#020617,#07142f,#020617);
}

/* ESTRELAS */

.estrela{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
    opacity:.8;
    animation:piscando 1.5s infinite alternate;
}

@keyframes piscando{
    from{opacity:.25}
    to{opacity:1}
}

/* MENU */

#menu{
    position:absolute;
    inset:0;
    z-index:100;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at center,rgba(30,64,175,.25),transparent 50%),
        rgba(0,0,15,.45);
}

.logo{
    font-size:43px;
    font-weight:900;
    letter-spacing:4px;
    color:#67e8f9;
    text-shadow:
        0 0 10px #06b6d4,
        0 0 30px #2563eb;
    margin-bottom:6px;
}

.subtitulo{
    color:#94a3b8;
    font-size:12px;
    letter-spacing:3px;
    margin-bottom:35px;
}

#play{
    border:none;
    background:linear-gradient(135deg,#06b6d4,#2563eb);
    color:white;
    font-size:22px;
    font-weight:bold;
    padding:15px 48px;
    border-radius:12px;
    cursor:pointer;
    box-shadow:
        0 0 15px rgba(6,182,212,.6),
        0 0 35px rgba(37,99,235,.35);
}

#play:active{
    transform:scale(.95);
}

.melhor{
    margin-top:25px;
    color:#64748b;
    font-size:14px;
}

/* HUD */

#hud{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    z-index:50;
    display:none;
    padding:12px;
    justify-content:space-between;
    align-items:flex-start;
    pointer-events:none;
}

.hudBox{
    background:rgba(2,6,23,.7);
    border:1px solid rgba(103,232,249,.25);
    border-radius:8px;
    padding:7px 10px;
    backdrop-filter:blur(4px);
}

.hudLabel{
    color:#64748b;
    font-size:9px;
    letter-spacing:1px;
}

.hudValor{
    color:#e0f2fe;
    font-size:16px;
    font-weight:bold;
}

#vidas{
    color:#fb7185;
    letter-spacing:2px;
}

/* NAVE DO JOGADOR */

#jogador{
    position:absolute;
    width:42px;
    height:52px;
    z-index:20;
    transform:translate(-50%,-50%);
}

.naveCorpo{
    position:absolute;
    left:7px;
    top:5px;
    width:28px;
    height:40px;
    background:linear-gradient(
        90deg,
        #1e40af,
        #67e8f9,
        #2563eb
    );
    clip-path:polygon(
        50% 0%,
        92% 72%,
        72% 65%,
        65% 100%,
        35% 100%,
        28% 65%,
        8% 72%
    );
    filter:
        drop-shadow(0 0 5px #22d3ee)
        drop-shadow(0 0 12px #2563eb);
}

.naveCabine{
    position:absolute;
    width:12px;
    height:18px;
    left:15px;
    top:9px;
    border-radius:50% 50% 40% 40%;
    background:#e0f2fe;
    box-shadow:0 0 8px #67e8f9;
}

.asaEsq,
.asaDir{
    position:absolute;
    top:26px;
    width:15px;
    height:13px;
    background:#1d4ed8;
}

.asaEsq{
    left:0;
    clip-path:polygon(100% 0,100% 100%,0 100%);
}

.asaDir{
    right:0;
    clip-path:polygon(0 0,100% 100%,0 100%);
}

.motorEsq,
.motorDir{
    position:absolute;
    bottom:-3px;
    width:7px;
    height:13px;
    background:#f97316;
    border-radius:0 0 50% 50%;
    box-shadow:0 0 10px #f97316;
    animation:fogo .08s infinite alternate;
}

.motorEsq{left:10px}
.motorDir{right:10px}

@keyframes fogo{
    from{height:8px;opacity:.7}
    to{height:14px;opacity:1}
}

/* ESCUDO */

.escudoVisual{
    position:absolute;
    inset:-9px;
    border:2px solid #22d3ee;
    border-radius:50%;
    box-shadow:
        0 0 10px #22d3ee,
        inset 0 0 15px rgba(34,211,238,.4);
    animation:pulsoEscudo .7s infinite alternate;
}

@keyframes pulsoEscudo{
    from{transform:scale(.95);opacity:.6}
    to{transform:scale(1.08);opacity:1}
}

/* INIMIGO - NAVE */

.inimigo{
    position:absolute;
    z-index:15;
}

.naveInimiga{
    position:absolute;
    width:42px;
    height:28px;
    background:linear-gradient(#ef4444,#7f1d1d);
    border-radius:50% 50% 35% 35%;
    box-shadow:
        0 0 8px #ef4444,
        0 0 18px rgba(239,68,68,.5);
}

.naveInimiga::before{
    content:"";
    position:absolute;
    width:17px;
    height:10px;
    left:12px;
    top:-4px;
    background:#fca5a5;
    border-radius:50% 50% 20% 20%;
}

.luz{
    position:absolute;
    width:6px;
    height:6px;
    border-radius:50%;
    background:#fef08a;
    box-shadow:0 0 7px #fef08a;
    bottom:3px;
}

.luz1{left:6px}
.luz2{left:18px}
.luz3{right:6px}

/* ALIEN */

.alien{
    position:absolute;
    width:38px;
    height:43px;
    background:#22c55e;
    border-radius:48% 48% 42% 42%;
    box-shadow:
        0 0 10px #22c55e,
        0 0 22px rgba(34,197,94,.4);
}

.alien::before{
    content:"";
    position:absolute;
    width:12px;
    height:17px;
    left:5px;
    top:9px;
    background:white;
    border-radius:50%;
    box-shadow:
        16px 0 0 white;
}

.alien::after{
    content:"";
    position:absolute;
    width:6px;
    height:6px;
    left:9px;
    top:14px;
    background:#020617;
    border-radius:50%;
    box-shadow:
        16px 0 0 #020617;
}

.antenna{
    position:absolute;
    width:2px;
    height:9px;
    background:#86efac;
    top:-7px;
}

.ant1{left:10px;transform:rotate(-20deg)}
.ant2{right:10px;transform:rotate(20deg)}

/* ASTEROIDE */

.asteroide{
    position:absolute;
    width:42px;
    height:42px;
    background:
        radial-gradient(circle at 30% 25%,#a78bfa 0 8%,transparent 9%),
        radial-gradient(circle at 70% 65%,#4c1d95 0 12%,transparent 13%),
        linear-gradient(135deg,#64748b,#312e81);
    border-radius:42% 58% 51% 49%;
    box-shadow:0 0 8px rgba(129,140,248,.45);
}

/* CRISTAL */

.cristal{
    position:absolute;
    width:20px;
    height:26px;
    background:linear-gradient(
        135deg,
        #67e8f9,
        #2563eb
    );
    clip-path:polygon(
        50% 0,
        100% 38%,
        72% 100%,
        28% 100%,
        0 38%
    );
    box-shadow:0 0 15px #22d3ee;
    animation:girarCristal .8s infinite alternate;
}

@keyframes girarCristal{
    from{transform:rotate(-10deg) scale(.9)}
    to{transform:rotate(10deg) scale(1.1)}
}

/* POWERUPS */

.powerup{
    position:absolute;
    width:30px;
    height:30px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    font-weight:bold;
    z-index:14;
}

.shield{
    border:2px solid #22d3ee;
    background:rgba(34,211,238,.15);
    box-shadow:0 0 15px #22d3ee;
}

.turbo{
    border:2px solid #f97316;
    background:rgba(249,115,22,.15);
    box-shadow:0 0 15px #f97316;
}

/* PARTICULAS */

.particula{
    position:absolute;
    width:4px;
    height:4px;
    border-radius:50%;
    background:#67e8f9;
    pointer-events:none;
    z-index:30;
}

.textoFlutuante{
    position:absolute;
    z-index:40;
    color:#67e8f9;
    font-size:14px;
    font-weight:bold;
    pointer-events:none;
    animation:subirTexto .7s forwards;
}

@keyframes subirTexto{
    from{
        opacity:1;
        transform:translateY(0);
    }
    to{
        opacity:0;
        transform:translateY(-35px);
    }
}

/* PAUSE */

#pausa{
    position:absolute;
    inset:0;
    z-index:90;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(2,6,23,.7);
    backdrop-filter:blur(4px);
}

.pausaCaixa{
    text-align:center;
}

.pausaCaixa h2{
    color:#67e8f9;
    font-size:30px;
    margin-bottom:8px;
}

.pausaCaixa p{
    color:#94a3b8;
    font-size:13px;
}

/* GAME OVER */

#gameover{
    position:absolute;
    inset:0;
    z-index:100;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:rgba(2,6,23,.82);
    backdrop-filter:blur(5px);
}

.gameoverTitulo{
    color:#fb7185;
    font-size:34px;
    font-weight:900;
    letter-spacing:2px;
    text-shadow:0 0 15px #ef4444;
    margin-bottom:10px;
}

.resultado{
    color:#cbd5e1;
    margin:4px;
}

#novoRecorde{
    color:#facc15;
    font-weight:bold;
    margin:12px;
    display:none;
}

#tentar{
    margin-top:20px;
    padding:13px 32px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-weight:bold;
    font-size:17px;
    cursor:pointer;
}

/* CONTROLES MOBILE */

#controles{
    position:absolute;
    bottom:15px;
    left:0;
    width:100%;
    z-index:70;
    display:none;
    justify-content:space-between;
    padding:0 18px;
}

.controle{
    width:75px;
    height:55px;
    border-radius:15px;
    border:1px solid rgba(103,232,249,.3);
    background:rgba(15,23,42,.65);
    color:#67e8f9;
    font-size:25px;
    font-weight:bold;
}

.controle:active{
    background:rgba(37,99,235,.55);
    transform:scale(.94);
}

/* TURBO */

#barraTurbo{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    bottom:82px;
    width:130px;
    height:7px;
    background:rgba(15,23,42,.8);
    border-radius:10px;
    overflow:hidden;
    display:none;
    z-index:60;
}

#turboProgresso{
    width:0%;
    height:100%;
    background:#f97316;
    box-shadow:0 0 8px #f97316;
}

/* RESPONSIVO */

@media(max-height:650px){
    #jogo{
        height:100vh;
    }
}

</style>
</head>

<body>

<div id="jogo">

    <div id="menu">

        <div class="logo">LAST SECOND</div>

        <div class="subtitulo">
            SOBREVIVA NO ESPAÇO
        </div>

        <button id="play">
            🚀 PLAY
        </button>

        <div class="melhor">
            BEST: <span id="melhorMenu">0</span>
        </div>

    </div>

    <div id="hud">

        <div class="hudBox">
            <div class="hudLabel">SCORE</div>
            <div class="hudValor" id="score">0</div>
        </div>

        <div class="hudBox">
            <div class="hudLabel">WAVE</div>
            <div class="hudValor" id="wave">1</div>
        </div>

        <div class="hudBox">
            <div class="hudLabel">VIDAS</div>
            <div class="hudValor" id="vidas">❤️❤️❤️</div>
        </div>

    </div>

    <div id="jogador">

        <div class="naveCorpo"></div>

        <div class="naveCabine"></div>

        <div class="asaEsq"></div>
        <div class="asaDir"></div>

        <div class="motorEsq"></div>
        <div class="motorDir"></div>

        <div class="escudoVisual" id="escudoVisual"
             style="display:none"></div>

    </div>

    <div id="barraTurbo">
        <div id="turboProgresso"></div>
    </div>

    <div id="controles">

        <button class="controle" id="esquerda">
            ◀
        </button>

        <button class="controle" id="direita">
            ▶
        </button>

    </div>

    <div id="pausa">

        <div class="pausaCaixa">

            <h2>PAUSED</h2>

            <p>
                Pressione P para continuar
            </p>

        </div>

    </div>

    <div id="gameover">

        <div class="gameoverTitulo">
            GAME OVER
        </div>

        <div class="resultado">
            SCORE:
            <strong id="scoreFinal">0</strong>
        </div>

        <div class="resultado">
            BEST:
            <strong id="bestFinal">0</strong>
        </div>

        <div id="novoRecorde">
            🏆 NEW RECORD!
        </div>

        <button id="tentar">
            🚀 TRY AGAIN
        </button>

    </div>

</div>

<script>

/* =========================
   ELEMENTOS
========================= */

const jogo = document.getElementById("jogo");
const jogador = document.getElementById("jogador");

const menu = document.getElementById("menu");
const hud = document.getElementById("hud");

const play = document.getElementById("play");
const tentar = document.getElementById("tentar");

const scoreElemento = document.getElementById("score");
const waveElemento = document.getElementById("wave");

const vidasElemento = document.getElementById("vidas");

const melhorMenu = document.getElementById("melhorMenu");

const gameover = document.getElementById("gameover");

const scoreFinal = document.getElementById("scoreFinal");
const bestFinal = document.getElementById("bestFinal");

const novoRecorde = document.getElementById("novoRecorde");

const pausa = document.getElementById("pausa");

const controles = document.getElementById("controles");

const barraTurbo = document.getElementById("barraTurbo");
const turboProgresso = document.getElementById("turboProgresso");

const escudoVisual =
    document.getElementById("escudoVisual");


/* =========================
   ESTRELAS
========================= */

function criarEstrelas(){

    for(let i = 0; i < 45; i++){

        const estrela =
            document.createElement("div");

        estrela.className = "estrela";

        estrela.style.left =
            Math.random() * 398 + "px";

        estrela.style.top =
            Math.random() * 598 + "px";

        estrela.style.animationDelay =
            Math.random() * 2 + "s";

        jogo.appendChild(estrela);
    }
}

criarEstrelas();


/* =========================
   VARIÁVEIS
========================= */

let rodando = false;
let pausado = false;

let score = 0;
let vidas = 3;

let melhor = 0;

let wave = 1;

let ultimoTempo = 0;

let tempoDecorrido = 0;

let velocidadeBase = 150;

let spawnTimer = 0;

let cristalTimer = 0;

let powerupTimer = 0;

let escudoTempo = 0;

let turboTempo = 0;

let invencivelTempo = 0;

let movimentoEsquerda = false;
let movimentoDireita = false;

let somContexto = null;

let musicaTimer = null;


/* =========================
   LOCAL STORAGE
========================= */

try{

    melhor =
        Number(localStorage.getItem("lastSecondBest")) || 0;

}catch(e){

    melhor = 0;
}

melhorMenu.textContent = melhor;


/* =========================
   POSIÇÃO DO JOGADOR
========================= */

let jogadorX = 200;

let jogadorY = 520;

const jogadorVelocidade = 280;


/* =========================
   ARRAYS
========================= */

let inimigos = [];
let cristais = [];
let powerups = [];
let particulas = [];


/* =========================
   ÁUDIO
========================= */

function criarAudio(){

    if(!somContexto){

        try{

            somContexto =
                new (window.AudioContext ||
                window.webkitAudioContext)();

        }catch(e){

            somContexto = null;
        }
    }

    if(
        somContexto &&
        somContexto.state === "suspended"
    ){

        somContexto.resume();
    }
}


function som(
    frequencia,
    duracao = 0.08,
    tipo = "sine",
    volume = 0.04
){

    if(!somContexto) return;

    try{

        const oscilador =
            somContexto.createOscillator();

        const ganho =
            somContexto.createGain();

        oscilador.type = tipo;

        oscilador.frequency.value =
            frequencia;

        ganho.gain.value =
            volume;

        oscilador.connect(ganho);

        ganho.connect(
            somContexto.destination
        );

        oscilador.start();

        ganho.gain.exponentialRampToValueAtTime(
            0.001,
            somContexto.currentTime + duracao
        );

        oscilador.stop(
            somContexto.currentTime + duracao
        );

    }catch(e){}
}


/* =========================
   MÚSICA
========================= */

function iniciarMusica(){

    pararMusica();

    if(!somContexto) return;

    let notas = [
        196,
        247,
        294,
        330,
        294,
        247
    ];

    let indice = 0;

    function tocar(){

        if(!rodando || pausado) return;

        som(
            notas[indice % notas.length],
            .13,
            "triangle",
            .018
        );

        indice++;

        musicaTimer =
            setTimeout(tocar,220);
    }

    tocar();
}


function pararMusica(){

    if(musicaTimer){

        clearTimeout(musicaTimer);

        musicaTimer = null;
    }
}


/* =========================
   POSIÇÃO
========================= */

function atualizarJogador(){

    if(movimentoEsquerda){

        jogadorX -=
            jogadorVelocidade / 60;
    }

    if(movimentoDireita){

        jogadorX +=
            jogadorVelocidade / 60;
    }

    const limiteEsquerdo = 28;
    const limiteDireito = 372;

    if(jogadorX < limiteEsquerdo)
        jogadorX = limiteEsquerdo;

    if(jogadorX > limiteDireito)
        jogadorX = limiteDireito;

    jogador.style.left =
        jogadorX + "px";

    jogador.style.top =
        jogadorY + "px";
}


/* =========================
   CRIAR INIMIGO
========================= */

function criarInimigo(){

    const tipos = [
        "nave",
        "alien",
        "asteroide"
    ];

    let tipo;

    const sorteio = Math.random();

    if(sorteio < .5){

        tipo = "nave";

    }else if(sorteio < .78){

        tipo = "alien";

    }else{

        tipo = "asteroide";
    }

    const inimigo =
        document.createElement("div");

    inimigo.className =
        "inimigo";

    let largura = 42;
    let altura = 42;

    if(tipo === "nave"){

        inimigo.innerHTML = `
            <div class="naveInimiga">
                <span class="luz luz1"></span>
                <span class="luz luz2"></span>
                <span class="luz luz3"></span>
            </div>
        `;

        largura = 42;
        altura = 28;
    }

    if(tipo === "alien"){

        inimigo.innerHTML = `
            <div class="alien">
                <span class="antenna ant1"></span>
                <span class="antenna ant2"></span>
            </div>
        `;

        largura = 38;
        altura = 43;
    }

    if(tipo === "asteroide"){

        inimigo.innerHTML =
            `<div class="asteroide"></div>`;

        largura = 42;
        altura = 42;
    }

    const x =
        25 + Math.random() * 350;

    const velocidade =
        velocidadeBase *
        (
            .75 +
            Math.random() * .65
        );

    const objeto = {

        elemento:inimigo,

        tipo:tipo,

        x:x,

        y:-60,

        largura:largura,

        altura:altura,

        velocidade:velocidade,

        direcao:
            Math.random() < .5 ? -1 : 1,

        fase:
            Math.random() * Math.PI * 2,

        ativo:true
    };

    inimigos.push(objeto);

    jogo.appendChild(inimigo);

    atualizarElemento(
        objeto
    );
}


/* =========================
   ATUALIZAR ELEMENTO
========================= */

function atualizarElemento(objeto){

    objeto.elemento.style.left =
        objeto.x + "px";

    objeto.elemento.style.top =
        objeto.y + "px";
}


/* =========================
   CRISTAL
========================= */

function criarCristal(){

    const elemento =
        document.createElement("div");

    elemento.className =
        "cristal";

    const objeto = {

        elemento:elemento,

        x:25 + Math.random() * 350,

        y:-40,

        velocidade:
            velocidadeBase * .75,

        ativo:true
    };

    cristais.push(objeto);

    jogo.appendChild(elemento);

    atualizarElemento(objeto);
}


/* =========================
   POWERUP
========================= */

function criarPowerup(){

    const elemento =
        document.createElement("div");

    const ehEscudo =
        Math.random() < .5;

    elemento.className =
        "powerup " +
        (ehEscudo ? "shield" : "turbo");

    elemento.textContent =
        ehEscudo ? "🛡️" : "⚡";

    const objeto = {

        elemento:elemento,

        tipo:
            ehEscudo ? "escudo" : "turbo",

        x:30 + Math.random() * 340,

        y:-40,

        velocidade:
            velocidadeBase * .7,

        ativo:true
    };

    powerups.push(objeto);

    jogo.appendChild(elemento);

    atualizarElemento(objeto);
}


/* =========================
   COLISÃO
========================= */

function colidiu(
    ax,
    ay,
    aw,
    ah,
    bx,
    by,
    bw,
    bh
){

    return (
        ax < bx + bw &&
        ax + aw > bx &&
        ay < by + bh &&
        ay + ah > by
    );
}


/* =========================
   PARTICULAS
========================= */

function explodir(x,y){

    for(let i=0;i<12;i++){

        const elemento =
            document.createElement("div");

        elemento.className =
            "particula";

        elemento.style.left =
            x + "px";

        elemento.style.top =
            y + "px";

        jogo.appendChild(elemento);

        const angulo =
            Math.random() * Math.PI * 2;

        const velocidade =
            40 + Math.random() * 100;

        particulas.push({

            elemento:elemento,

            x:x,

            y:y,

            vx:
                Math.cos(angulo) *
                velocidade,

            vy:
                Math.sin(angulo) *
                velocidade,

            vida:.5
        });
    }
}


function atualizarParticulas(delta){

    for(
        let i = particulas.length - 1;
        i >= 0;
        i--
    ){

        const p =
            particulas[i];

        p.vida -= delta;

        p.x += p.vx * delta;

        p.y += p.vy * delta;

        p.vy += 80 * delta;

        p.elemento.style.left =
            p.x + "px";

        p.elemento.style.top =
            p.y + "px";

        p.elemento.style.opacity =
            Math.max(0,p.vida * 2);

        if(p.vida <= 0){

            p.elemento.remove();

            particulas.splice(i,1);
        }
    }
}


/* =========================
   TEXTO FLUTUANTE
========================= */

function mostrarTexto(
    texto,
    x,
    y
){

    const elemento =
        document.createElement("div");

    elemento.className =
        "textoFlutuante";

    elemento.textContent =
        texto;

    elemento.style.left =
        x + "px";

    elemento.style.top =
        y + "px";

    jogo.appendChild(elemento);

    setTimeout(
        () => elemento.remove(),
        700
    );
}


/* =========================
   VIDAS
========================= */

function atualizarVidas(){

    let texto = "";

    for(let i=0;i<vidas;i++){

        texto += "❤️";
    }

    vidasElemento.textContent =
        texto;
}


/* =========================
   PEGAR CRISTAL
========================= */

function coletarCristal(i){

    const cristal =
        cristais[i];

    score += 10;

    scoreElemento.textContent =
        score;

    mostrarTexto(
        "+10 ENERGY",
        cristal.x,
        cristal.y
    );

    explodir(
        cristal.x,
        cristal.y
    );

    som(700,.1,"square",.04);

    cristal.elemento.remove();

    cristais.splice(i,1);
}


/* =========================
   PEGAR POWERUP
========================= */

function coletarPowerup(i){

    const powerup =
        powerups[i];

    if(powerup.tipo === "escudo"){

        escudoTempo = 7;

        escudoVisual.style.display =
            "block";

        mostrarTexto(
            "SHIELD!",
            powerup.x,
            powerup.y
        );

        som(500,.18,"sine",.05);

    }else{

        turboTempo = 5;

        mostrarTexto(
            "TURBO!",
            powerup.x,
            powerup.y
        );

        som(900,.18,"sawtooth",.04);
    }

    powerup.elemento.remove();

    powerups.splice(i,1);
}


/* =========================
   DANO
========================= */

function receberDano(inimigo){

    if(
        escudoTempo > 0 ||
        invencivelTempo > 0
    ){

        explodir(
            inimigo.x + inimigo.largura / 2,
            inimigo.y + inimigo.altura / 2
        );

        score += 5;

        scoreElemento.textContent =
            score;

        mostrarTexto(
            "+5",
            inimigo.x,
            inimigo.y
        );

        inimigo.elemento.remove();

        inimigos =
            inimigos.filter(
                item => item !== inimigo
            );

        som(300,.12,"square",.04);

        return;
    }

    vidas--;

    atualizarVidas();

    invencivelTempo = 1.5;

    explodir(
        jogadorX,
        jogadorY
    );

    som(100,.3,"sawtooth",.07);

    jogador.style.opacity = ".35";

    setTimeout(()=>{

        if(rodando){

            jogador.style.opacity = "1";
        }

    },150);

    inimigo.elemento.remove();

    inimigos =
        inimigos.filter(
            item => item !== inimigo
        );

    if(vidas <= 0){

        finalizarJogo();
    }
}


/* =========================
   ATUALIZAR INIMIGOS
========================= */

function atualizarInimigos(delta){

    for(
        let i = inimigos.length - 1;
        i >= 0;
        i--
    ){

        const inimigo =
            inimigos[i];

        if(!inimigo.ativo)
            continue;

        inimigo.y +=
            inimigo.velocidade *
            delta;

        /*
         * Alienígenas fazem movimentos
         * laterais.
         */

        if(inimigo.tipo === "alien"){

            inimigo.x +=
                Math.sin(
                    tempoDecorrido * 4 +
                    inimigo.fase
                ) *
                75 *
                delta;
        }

        /*
         * Algumas naves fazem
         * movimentos diagonais.
         */

        if(inimigo.tipo === "nave"){

            inimigo.x +=
                inimigo.direcao *
                18 *
                delta;

            if(
                inimigo.x < 10 ||
                inimigo.x > 348
            ){

                inimigo.direcao *= -1;
            }
        }

        atualizarElemento(
            inimigo
        );

        /*
         * Saiu da tela.
         */

        if(inimigo.y > 650){

            inimigo.elemento.remove();

            inimigos.splice(i,1);

            continue;
        }

        /*
         * Colisão com jogador.
         */

        if(
            colidiu(
                jogadorX - 17,
                jogadorY - 20,
                34,
                40,

                inimigo.x,
                inimigo.y,
                inimigo.largura,
                inimigo.altura
            )
        ){

            receberDano(
                inimigo
            );
        }
    }
}


/* =========================
   ATUALIZAR CRISTAIS
========================= */

function atualizarCristais(delta){

    for(
        let i = cristais.length - 1;
        i >= 0;
        i--
    ){

        const cristal =
            cristais[i];

        cristal.y +=
            cristal.velocidade *
            delta;

        atualizarElemento(
            cristal
        );

        if(cristal.y > 650){

            cristal.elemento.remove();

            cristais.splice(i,1);

            continue;
        }

        if(
            colidiu(
                jogadorX - 17,
                jogadorY - 20,
                34,
                40,

                cristal.x,
                cristal.y,
                20,
                26
            )
        ){

            coletarCristal(i);
        }
    }
}


/* =========================
   ATUALIZAR POWERUPS
========================= */

function atualizarPowerups(delta){

    for(
        let i = powerups.length - 1;
        i >= 0;
        i--
    ){

        const powerup =
            powerups[i];

        powerup.y +=
            powerup.velocidade *
            delta;

        atualizarElemento(
            powerup
        );

        if(powerup.y > 650){

            powerup.elemento.remove();

            powerups.splice(i,1);

            continue;
        }

        if(
            colidiu(
                jogadorX - 17,
                jogadorY - 20,
                34,
                40,

                powerup.x,
                powerup.y,
                30,
                30
            )
        ){

            coletarPowerup(i);
        }
    }
}


/* =========================
   LIMPAR OBJETOS
========================= */

function limparObjetos(){

    inimigos.forEach(
        item => item.elemento.remove()
    );

    cristais.forEach(
        item => item.elemento.remove()
    );

    powerups.forEach(
        item => item.elemento.remove()
    );

    particulas.forEach(
        item => item.elemento.remove()
    );

    inimigos = [];
    cristais = [];
    powerups = [];
    particulas = [];
}


/* =========================
   DIFICULDADE
========================= */

function atualizarDificuldade(){

    wave =
        Math.floor(
            tempoDecorrido / 15
        ) + 1;

    waveElemento.textContent =
        wave;

    velocidadeBase =
        150 +
        (wave - 1) * 18;
}


/* =========================
   TURBO
========================= */

function atualizarTurbo(delta){

    if(turboTempo > 0){

        turboTempo -= delta;

        barraTurbo.style.display =
            "block";

        turboProgresso.style.width =
            Math.max(
                0,
                turboTempo / 5 * 100
            ) + "%";

        jogador.style.transform =
            "translate(-50%,-50%) scale(1.08)";

    }else{

        barraTurbo.style.display =
            "none";

        turboProgresso.style.width =
            "0%";

        jogador.style.transform =
            "translate(-50%,-50%)";
    }
}


/* =========================
   ESCUDO
========================= */

function atualizarEscudo(delta){

    if(escudoTempo > 0){

        escudoTempo -= delta;

        escudoVisual.style.display =
            "block";

    }else{

        escudoVisual.style.display =
            "none";
    }
}


/* =========================
   GAME LOOP
========================= */

function loop(tempo){

    if(!rodando)
        return;

    if(!ultimoTempo)
        ultimoTempo = tempo;

    let delta =
        (tempo - ultimoTempo) / 1000;

    ultimoTempo = tempo;

    /*
     * Evita problemas se a aba
     * ficar congelada.
     */

    if(delta > .05)
        delta = .05;

    if(!pausado){

        tempoDecorrido += delta;

        atualizarDificuldade();

        atualizarJogador();

        atualizarInimigos(delta);

        atualizarCristais(delta);

        atualizarPowerups(delta);

        atualizarParticulas(delta);

        atualizarTurbo(delta);

        atualizarEscudo(delta);

        if(invencivelTempo > 0){

            invencivelTempo -= delta;
        }

        /*
         * Score automático.
         */

        score +=
            delta * (
                turboTempo > 0 ? 16 : 10
            );

        scoreElemento.textContent =
            Math.floor(score);

        /*
         * Spawn dos inimigos.
         */

        spawnTimer += delta;

        const intervalo =
            Math.max(
                .28,
                .95 -
                wave * .045
            );

        if(spawnTimer >= intervalo){

            spawnTimer = 0;

            criarInimigo();

            /*
             * Waves altas podem
             * gerar inimigos extras.
             */

            if(
                wave >= 5 &&
                Math.random() < .18
            ){

                setTimeout(
                    () => {

                        if(rodando && !pausado)
                            criarInimigo();

                    },
                    180
                );
            }
        }

        /*
         * Cristais.
         */

        cristalTimer += delta;

        if(cristalTimer >= 1.8){

            cristalTimer = 0;

            criarCristal();
        }

        /*
         * Powerups.
         */

        powerupTimer += delta;

        if(powerupTimer >= 9){

            powerupTimer = 0;

            if(Math.random() < .7){

                criarPowerup();
            }
        }
    }

    requestAnimationFrame(loop);
}


/* =========================
   INICIAR JOGO
========================= */

function iniciarJogo(){

    criarAudio();

    pararMusica();

    limparObjetos();

    score = 0;

    vidas = 3;

    wave = 1;

    tempoDecorrido = 0;

    velocidadeBase = 150;

    spawnTimer = 0;

    cristalTimer = 0;

    powerupTimer = 0;

    escudoTempo = 0;

    turboTempo = 0;

    invencivelTempo = 0;

    jogadorX = 200;

    jogadorY = 520;

    pausado = false;

    rodando = true;

    ultimoTempo = 0;

    menu.style.display =
        "none";

    gameover.style.display =
        "none";

    pausa.style.display =
        "none";

    hud.style.display =
        "flex";

    atualizarVidas();

    scoreElemento.textContent =
        "0";

    waveElemento.textContent =
        "1";

    jogador.style.opacity =
        "1";

    jogador.style.left =
        jogadorX + "px";

    jogador.style.top =
        jogadorY + "px";

    if(
        "ontouchstart" in window ||
        navigator.maxTouchPoints > 0
    ){

        controles.style.display =
            "flex";
    }

    iniciarMusica();

    requestAnimationFrame(loop);
}


/* =========================
   GAME OVER
========================= */

function finalizarJogo(){

    rodando = false;

    pausado = false;

    pararMusica();

    const pontuacao =
        Math.floor(score);

    let recordeNovo = false;

    if(pontuacao > melhor){

        melhor = pontuacao;

        recordeNovo = true;

        try{

            localStorage.setItem(
                "lastSecondBest",
                melhor
            );

        }catch(e){}
    }

    scoreFinal.textContent =
        pontuacao;

    bestFinal.textContent =
        melhor;

    melhorMenu.textContent =
        melhor;

    novoRecorde.style.display =
        recordeNovo
        ? "block"
        : "none";

    hud.style.display =
        "none";

    controles.style.display =
        "none";

    gameover.style.display =
        "flex";
}


/* =========================
   PAUSA
========================= */

function alternarPausa(){

    if(!rodando)
        return;

    pausado = !pausado;

    pausa.style.display =
        pausado
        ? "flex"
        : "none";

    if(pausado){

        pararMusica();

    }else{

        iniciarMusica();

        ultimoTempo =
            performance.now();
    }
}


/* =========================
   TECLADO
========================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "ArrowLeft" ||
            event.key.toLowerCase() === "a"
        ){

            movimentoEsquerda = true;
        }

        if(
            event.key === "ArrowRight" ||
            event.key.toLowerCase() === "d"
        ){

            movimentoDireita = true;
        }

        if(
            event.key.toLowerCase() === "p"
        ){

            alternarPausa();
        }
    }
);


document.addEventListener(
    "keyup",
    function(event){

        if(
            event.key === "ArrowLeft" ||
            event.key.toLowerCase() === "a"
        ){

            movimentoEsquerda = false;
        }

        if(
            event.key === "ArrowRight" ||
            event.key.toLowerCase() === "d"
        ){

            movimentoDireita = false;
        }
    }
);


/* =========================
   CONTROLE ESQUERDA
========================= */

const botaoEsquerda =
    document.getElementById("esquerda");

const botaoDireita =
    document.getElementById("direita");


function pressionarEsquerda(event){

    event.preventDefault();

    movimentoEsquerda = true;
}


function soltarEsquerda(event){

    event.preventDefault();

    movimentoEsquerda = false;
}


function pressionarDireita(event){

    event.preventDefault();

    movimentoDireita = true;
}


function soltarDireita(event){

    event.preventDefault();

    movimentoDireita = false;
}


botaoEsquerda.addEventListener(
    "pointerdown",
    pressionarEsquerda
);

botaoEsquerda.addEventListener(
    "pointerup",
    soltarEsquerda
);

botaoEsquerda.addEventListener(
    "pointercancel",
    soltarEsquerda
);

botaoEsquerda.addEventListener(
    "pointerleave",
    soltarEsquerda
);


botaoDireita.addEventListener(
    "pointerdown",
    pressionarDireita
);

botaoDireita.addEventListener(
    "pointerup",
    soltarDireita
);

botaoDireita.addEventListener(
    "pointercancel",
    soltarDireita
);

botaoDireita.addEventListener(
    "pointerleave",
    soltarDireita
);


/* =========================
   BOTÕES
========================= */

play.addEventListener(
    "click",
    iniciarJogo
);

tentar.addEventListener(
    "click",
    iniciarJogo
);


/* =========================
   INICIALIZAÇÃO
========================= */

jogador.style.left =
    jogadorX + "px";

jogador.style.top =
    jogadorY + "px";

</script>
