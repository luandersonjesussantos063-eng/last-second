<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <title>Last Second</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        /* TELA INICIAL */

        #menu {
            width: 400px;
            height: 500px;
            margin: 50px auto;
            background: #1c1c1c;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #titulo {
            font-size: 48px;
            margin-bottom: 50px;
        }

        #jogar {
            padding: 15px 50px;
            font-size: 24px;
            font-weight: bold;

            background: #e60000;
            color: white;

            border: none;
            border-radius: 10px;

            cursor: pointer;
        }

        #jogar:hover {
            background: #ff3333;
        }

        #melhor {
            margin-top: 30px;
            font-size: 20px;
        }


        /* JOGO */

        #jogo {
    width: 400px;
    height: 500px;
    background: radial-gradient(circle at 50% 20%, #1d3557, #050814 75%);
    position: relative;
    overflow: hidden;
    margin: auto;
    border: 2px solid #333;
} {
            width: 400px;
            height: 500px;

            background: white;

            margin: 20px auto;

            position: relative;

            overflow: hidden;
        }

        #pontuacao {
            font-size: 24px;
            margin: 15px;
        }

        #personagem {
    width: 40px;
    height: 40px;
    background: linear-gradient(to top, #008cff, #ffffff);
    border-radius: 50% 50% 25% 25%;
    box-shadow: 0 0 15px #00aaff;
    position: absolute;
    bottom: 10px;
    left: 180px;
} {
            width: 40px;
            height: 40px;

            background: blue;

            position: absolute;

            bottom: 10px;
            left: 180px;
        }

        .obstaculo {
    width: 40px;
    height: 40px;
    background: radial-gradient(
        circle at 30% 30%,
        #ffcc66 0%,
        #e74c3c 30%,
        #7a1f1f 75%
    );
    border-radius: 50%;
    position: absolute;
    box-shadow: 0 0 10px rgba(255, 80, 50, 0.7);
} {
            width: 40px;
            height: 40px;

            background: red;

            position: absolute;
        }


        /* GAME OVER */

        #gameOver {
            display: none;

            width: 400px;
            height: 500px;

            margin: 50px auto;

            background: #1c1c1c;

            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #gameOver h1 {
            font-size: 45px;
        }

        #tentarNovamente {
            padding: 15px 30px;

            font-size: 20px;

            background: #e60000;
            color: white;

            border: none;
            border-radius: 10px;

            cursor: pointer;
        }

  .estrela {
    position: absolute;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 6px white;
}  </style>

</head>


<body>


    <!-- MENU -->

    <div id="menu">

        <div id="titulo">
            LAST SECOND
        </div>

        <button id="jogar">
            ▶ PLAY
        </button>

        <div id="melhor">
            BEST: <span id="recordeMenu">0</span>
        </div>

    </div>


    <!-- JOGO -->

    <div id="telaJogo" style="display: none;">

        <div id="pontuacao">
            SCORE: 0
        </div>

        <div id="jogo">

            <div id="personagem"></div>

        </div>

    </div>


    <!-- GAME OVER -->

    <div id="gameOver">

        <h1>GAME OVER</h1>

        <h2>
            SCORE: <span id="pontuacaoFinal">0</span>
        </h2>

        <h3>
            BEST: <span id="recordeFinal">0</span>
        </h3>

        <button id="tentarNovamente">
            ↻ TRY AGAIN
        </button>

    </div>



    <script>


        // ==========================
        // ELEMENTOS
        // ==========================

        let menu =
            document.getElementById("menu");

        let telaJogo =
            document.getElementById("telaJogo");

        let gameOver =
            document.getElementById("gameOver");

        let jogar =
            document.getElementById("jogar");

        let tentarNovamente =
            document.getElementById("tentarNovamente");


        // ==========================
        // RECORD
        // ==========================

        let recorde =
            Number(localStorage.getItem("recorde")) || 0;

        document.getElementById("recordeMenu").innerText =
            recorde;


        // ==========================
        // INICIAR JOGO
        // ==========================

        jogar.addEventListener("click", iniciarJogo);

        tentarNovamente.addEventListener(
            "click",
            iniciarJogo
        );


        function iniciarJogo() {

            menu.style.display = "none";

            gameOver.style.display = "none";

            telaJogo.style.display = "block";

            iniciarPartida();

        }


        // ==========================
        // PARTIDA
        // ==========================

        function iniciarPartida() {

    let jogo =
        document.getElementById("jogo");

    function criarEstrelas() {

        for (let i = 0; i < 30; i++) {

            const estrela =
                document.createElement("div");

            estrela.classList.add("estrela");

            estrela.style.left =
                Math.random() * 397 + "px";

            estrela.style.top =
                Math.random() * 500 + "px";

            jogo.appendChild(estrela);
        }
    }

    criarEstrelas();

        jogo.appendChild(estrela);
    }
}function moverEstrelas() {
    const estrelas = document.querySelectorAll(".estrela");

    estrelas.forEach(estrela => {
        let posicao = parseFloat(estrela.style.top);

        posicao += 2;

        if (posicao > 500) {
            posicao = -5;
            estrela.style.left = Math.random() * 397 + "px";
        }

        estrela.style.top = posicao + "px";
    });
}

            let personagem =
                document.getElementById("personagem");


            // Limpa obstáculos antigos

            document.querySelectorAll(".obstaculo")
                .forEach(function(obstaculo) {

                    obstaculo.remove();

                });


            let posicao = 180;

            let pontos = 0;

            let velocidade = 5;


            personagem.style.left =
                posicao + "px";


            // ==========================
            // MOVIMENTO
            // ==========================

            document.onkeydown = function(evento) {

                if (evento.key === "ArrowLeft") {

                    posicao -= 15;

                }

                if (evento.key === "ArrowRight") {

                    posicao += 15;

                }


                if (posicao < 0) {

                    posicao = 0;

                }

                if (posicao > 360) {

                    posicao = 360;

                }


                personagem.style.left =
                    posicao + "px";

            };


            // ==========================
            // CRIAR OBSTÁCULO
            // ==========================

            function criarObstaculo() {

                let obstaculo =
                    document.createElement("div");

                obstaculo.classList.add(
                    "obstaculo"
                );

                obstaculo.style.top = "-40px";

                obstaculo.style.left =
                    Math.floor(
                        Math.random() * 360
                    ) + "px";


                jogo.appendChild(obstaculo);


                return {

                    elemento: obstaculo,

                    altura: -40

                };

            }


            let obstaculos = [

                criarObstaculo(),

                criarObstaculo(),

                criarObstaculo()

            ];


            // ==========================
            // LOOP
            // ==========================

            let jogoRodando = true;


            let loop = setInterval(function() {


                if (!jogoRodando) {

                    clearInterval(loop);

                    return;

                }


                obstaculos.forEach(function(obstaculo) {


                    obstaculo.altura += velocidade;


                    obstaculo.elemento.style.top =
                        obstaculo.altura + "px";


                    // Saiu da tela

                    if (obstaculo.altura > 500) {

                        obstaculo.altura = -40;


                        obstaculo.elemento.style.left =
                            Math.floor(
                                Math.random() * 360
                            ) + "px";


                        pontos++;


                        document.getElementById(
                            "pontuacao"
                        ).innerText =
                            "SCORE: " + pontos;


                        // Aumenta dificuldade

                        if (pontos % 5 === 0) {

                            velocidade++;

                        }


                        // Novo recorde

                        if (pontos > recorde) {

                            recorde = pontos;

                            localStorage.setItem(
                                "recorde",
                                recorde
                            );

                        }

                    }


                    // ==========================
                    // COLISÃO
                    // ==========================

                    let jogador =
                        personagem.getBoundingClientRect();


                    let inimigo =
                        obstaculo.elemento
                            .getBoundingClientRect();


                    if (

                        jogador.left <
                        inimigo.right &&

                        jogador.right >
                        inimigo.left &&

                        jogador.top <
                        inimigo.bottom &&

                        jogador.bottom >
                        inimigo.top

                    ) {

                        finalizarJogo();

                    }

                });


            }, 50);


            // ==========================
            // GAME OVER
            // ==========================

            function finalizarJogo() {

                if (!jogoRodando) {

                    return;

                }


                jogoRodando = false;


                clearInterval(loop);


                telaJogo.style.display =
                    "none";


                gameOver.style.display =
                    "flex";


                document.getElementById(
                    "pontuacaoFinal"
                ).innerText = pontos;


                document.getElementById(
                    "recordeFinal"
                ).innerText = recorde;


                document.getElementById(
                    "recordeMenu"
                ).innerText = recorde;

            }

        }


    </script>

</body>

</html>
