<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#071a10">
<title>LAST SECOND FC</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#020b06;
    color:#fff;
    touch-action:none;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
}

.app{
    position:relative;
    width:min(100vw,430px);
    height:min(100vh,820px);
    overflow:hidden;
    background:#08752e;
    box-shadow:0 0 45px #000;
    border:1px solid #173d28;
}

.screen{
    position:absolute;
    inset:0;
}

.hidden{
    display:none!important;
}

/* MENU */

#menu{
    z-index:20;
    background:
        radial-gradient(
            circle at 50% 35%,
            #123d25 0,
            #061b10 45%,
            #020a05 100%
        );
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.glow{
    position:absolute;
    width:360px;
    height:360px;
    border-radius:50%;
    background:rgba(39,255,120,.12);
    filter:blur(35px);
    animation:pulse 2.5s infinite alternate;
}

@keyframes pulse{
    to{
        transform:scale(1.2);
        opacity:.55;
    }
}

.menu-content{
    position:relative;
    text-align:center;
    width:90%;
    z-index:2;
}

.logo{
    font-weight:900;
    font-size:48px;
    line-height:.88;
    letter-spacing:2px;
    text-shadow:
        0 5px 0 #064d1e,
        0 0 25px rgba(50,255,130,.55);
}

.logo span{
    display:block;
    font-size:25px;
    letter-spacing:8px;
    color:#70ff9e;
    margin-top:10px;
}

.version{
    font-size:11px;
    opacity:.5;
    margin:12px;
}

.status{
    font-size:11px;
    color:#73ff9d;
    letter-spacing:2px;
    margin:18px;
}

.menu-btn{
    width:100%;
    max-width:290px;
    border:1px solid #49f985;
    background:linear-gradient(180deg,#21d75d,#0b8d37);
    color:white;
    font-size:18px;
    font-weight:900;
    border-radius:12px;
    padding:16px;
    margin:7px;
    cursor:pointer;
    box-shadow:
        0 7px 0 #045d23,
        0 0 18px rgba(50,255,120,.18);
    transition:.15s;
}

.menu-btn:active{
    transform:translateY(5px);
    box-shadow:0 2px 0 #045d23;
}

.secondary{
    background:#10291a;
    border-color:#376b49;
    box-shadow:0 5px 0 #07140b;
}

.burst{
    animation:burst .55s forwards;
}

@keyframes burst{
    0%{
        transform:scale(1);
        opacity:1;
    }

    45%{
        transform:scale(1.08);
        filter:brightness(2);
    }

    100%{
        transform:scale(2.8);
        opacity:0;
    }
}

/* JOGO */

#game{
    background:#0a7d35;
}

.hud{
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:64px;
    z-index:5;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 12px;
    background:linear-gradient(#03140acc,#03140a00);
    pointer-events:none;
}

.score{
    font-size:24px;
    font-weight:900;
}

.timer{
    font-size:20px;
    font-weight:900;
}

.energy{
    width:80px;
    height:8px;
    border:1px solid #fff5;
    border-radius:8px;
    overflow:hidden;
    background:#0005;
}

.energy i{
    display:block;
    height:100%;
    width:100%;
    background:#7dff9d;
}

.canvas{
    width:100%;
    height:100%;
    display:block;
}

.pause-btn{
    position:absolute;
    right:10px;
    top:70px;
    z-index:6;
    border:0;
    border-radius:9px;
    background:#03140dcc;
    color:white;
    padding:8px 12px;
    font-weight:900;
}

/* CONTROLES */

.controls{
    position:absolute;
    left:0;
    right:0;
    bottom:12px;
    height:150px;
    z-index:7;
    pointer-events:none;
}

.dpad{
    position:absolute;
    left:18px;
    bottom:4px;
    width:150px;
    height:130px;
    pointer-events:auto;
}

.ctrl{
    position:absolute;
    width:48px;
    height:48px;
    border:1px solid #ffffff55;
    border-radius:12px;
    background:#06170dcc;
    color:#fff;
    font-size:22px;
    font-weight:900;
}

.up{
    left:51px;
    top:0;
}

.left{
    left:0;
    top:45px;
}

.down{
    left:51px;
    top:45px;
}

.right{
    left:102px;
    top:45px;
}

.actions{
    position:absolute;
    right:18px;
    bottom:15px;
    display:flex;
    gap:12px;
    align-items:end;
    pointer-events:auto;
}

.act{
    width:74px;
    height:74px;
    border-radius:50%;
    border:2px solid #fff8;
    background:#0b321ddd;
    color:#fff;
    font-weight:900;
    box-shadow:0 0 18px #0008;
}

.kick{
    background:#eab308;
    color:#172008;
    border-color:#fff;
}

.sprint{
    width:58px;
    height:58px;
    background:#0ea5e9;
}

/* JANELA */

#overlay{
    position:absolute;
    inset:0;
    z-index:15;
    background:#0009;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.panel{
    width:86%;
    background:#07180e;
    border:1px solid #55ed85;
    border-radius:18px;
    padding:25px;
    box-shadow:0 0 40px #000;
}

.panel h2{
    margin:0 0 12px;
    font-size:32px;
}

.panel p{
    opacity:.8;
}

.panel button{
    border:0;
    border-radius:10px;
    padding:13px 22px;
    background:#18c653;
    color:white;
    font-weight:900;
    margin:5px;
}

@media(min-width:700px){
    .app{
        border-radius:20px;
    }
}
</style>
</head>

<body>

<div class="app" id="app">

<section id="menu" class="screen">

    <div class="glow"></div>

    <div class="menu-content">

        <div class="logo">
            LAST
            <span>SECOND FC</span>
        </div>

        <div class="version">
            V1.0 • FUTEBOL
        </div>

        <div class="status">
            ● SISTEMA ONLINE
        </div>

        <button class="menu-btn" id="playBtn">
            ▶ JOGAR
        </button>

        <button class="menu-btn secondary" id="howBtn">
            ? COMO JOGAR
        </button>

    </div>

</section>

<section id="game" class="screen hidden">

    <div class="hud">

        <div>
            ⚽ <span id="score">0 - 0</span>
        </div>

        <div class="timer" id="timer">
            01:30
        </div>

        <div>
            ⚡
            <div class="energy">
                <i id="energy"></i>
            </div>
        </div>

    </div>

    <button class="pause-btn" id="pauseBtn">
        Ⅱ
    </button>

    <canvas id="canvas" class="canvas"></canvas>

    <div class="controls">

        <div class="dpad">

            <button class="ctrl up" data-key="up">
                ▲
            </button>

            <button class="ctrl left" data-key="left">
                ◀
            </button>

            <button class="ctrl down" data-key="down">
                ▼
            </button>

            <button class="ctrl right" data-key="right">
                ▶
            </button>

        </div>

        <div class="actions">

            <button class="act sprint" data-key="sprint">
                ⚡
            </button>

            <button class="act kick" id="kickBtn">
                CHUTE
            </button>

        </div>

    </div>

</section>

<div id="overlay" class="hidden">
    <div class="panel" id="panel"></div>
</div>

</div>

<script>
'use strict';

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const menu = document.getElementById('menu');
const game = document.getElementById('game');
const playBtn = document.getElementById('playBtn');
const howBtn = document.getElementById('howBtn');

const overlay = document.getElementById('overlay');
const panel = document.getElementById('panel');

const scoreEl = document.getElementById('score');
const timerEl = document.getElementById('timer');
const energyEl = document.getElementById('energy');

const pauseBtn = document.getElementById('pauseBtn');
const kickBtn = document.getElementById('kickBtn');

let W = 430;
let H = 760;
let dpr = 1;

let raf = 0;
let last = 0;

let running = false;
let paused = false;

let timeLeft = 90;

let homeScore = 0;
let awayScore = 0;

let goalLock = 0;
let best = 0;

const keys = {
    up:false,
    down:false,
    left:false,
    right:false,
    sprint:false
};

const player = {
    x:W / 2,
    y:H - 170,
    r:17,
    vx:0,
    vy:0,
    energy:100,
    dirX:0,
    dirY:-1
};

const ball = {
    x:W / 2,
    y:H - 230,
    r:9,
    vx:0,
    vy:0
};

const keeper = {
    x:W / 2,
    y:75,
    r:18,
    vx:0
};

const enemy = {
    x:W / 2,
    y:250,
    r:18,
    vx:0,
    vy:0
};

const particles = [];

/* TAMANHO DO CAMPO */

function resize(){

    const rect = canvas.getBoundingClientRect();

    dpr = Math.min(window.devicePixelRatio || 1,2);

    canvas.width = Math.floor(rect.width * dpr);
    canvas.height = Math.floor(rect.height * dpr);

    W = rect.width;
    H = rect.height;

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    if(!running){

        player.x = W / 2;
        player.y = H - 170;

        ball.x = W / 2;
        ball.y = H - 230;

        keeper.x = W / 2;

        enemy.x = W / 2;
        enemy.y = H * .33;
    }
}

window.addEventListener('resize',resize);

/* TEMPO */

function formatTime(seconds){

    seconds = Math.max(
        0,
        Math.ceil(seconds)
    );

    return (
        String(Math.floor(seconds / 60)).padStart(2,'0')
        +
        ':'
        +
        String(seconds % 60).padStart(2,'0')
    );
}

/* RESET */

function resetPositions(){

    player.x = W / 2;
    player.y = H - 170;

    player.vx = 0;
    player.vy = 0;

    player.dirX = 0;
    player.dirY = -1;

    ball.x = W / 2;
    ball.y = H - 230;

    ball.vx = 0;
    ball.vy = 0;

    keeper.x = W / 2;

    enemy.x = W / 2;
    enemy.y = H * .33;

    enemy.vx = 0;
    enemy.vy = 0;

    goalLock = 1;
}

/* COMEÇAR */

function startGame(){

    playBtn.classList.add('burst');

    setTimeout(function(){

        menu.classList.add('hidden');

        game.classList.remove('hidden');

        playBtn.classList.remove('burst');

        startMatch();

    },500);
}

/* PARTIDA */

function startMatch(){

    homeScore = 0;
    awayScore = 0;

    timeLeft = 90;

    paused = false;
    running = true;

    resetPositions();

    updateHud();

    last = performance.now();

    cancelAnimationFrame(raf);

    raf = requestAnimationFrame(loop);
}

/* FIM */

function endGame(){

    running = false;

    let result;

    if(homeScore > awayScore){
        result = 'VITÓRIA!';
    }
    else if(homeScore < awayScore){
        result = 'DERROTA';
    }
    else{
        result = 'EMPATE';
    }

    if(homeScore > best){

        best = homeScore;

        try{
            localStorage.setItem(
                'lastSecondFCBest',
                String(best)
            );
        }
        catch(e){}
    }

    panel.innerHTML = `
        <h2>${result}</h2>

        <p>
            Placar final
            <br>
            <b style="font-size:32px">
                ${homeScore} - ${awayScore}
            </b>
        </p>

        <p>
            Recorde de vitórias: ${best}
        </p>

        <button id="again">
            JOGAR NOVAMENTE
        </button>

        <button id="menuBack">
            MENU
        </button>
    `;

    overlay.classList.remove('hidden');

    document.getElementById('again').onclick = function(){

        overlay.classList.add('hidden');

        startMatch();
    };

    document.getElementById('menuBack').onclick = function(){

        overlay.classList.add('hidden');

        game.classList.add('hidden');

        menu.classList.remove('hidden');
    };
}

/* GOL */

function goal(team){

    if(goalLock > 0){
        return;
    }

    goalLock = 2;

    if(team === 'home'){
        homeScore++;
    }
    else{
        awayScore++;
    }

    updateHud();

    burst(
        W / 2,
        team === 'home' ? 55 : H - 55,
        'GOOOL!'
    );

    setTimeout(function(){

        if(running){
            resetPositions();
        }

    },900);
}

/* HUD */

function updateHud(){

    scoreEl.textContent =
        homeScore + ' - ' + awayScore;

    timerEl.textContent =
        formatTime(timeLeft);

    energyEl.style.width =
        player.energy + '%';
}

/* CHUTE */

function kick(){

    if(!running || paused || goalLock > 0){
        return;
    }

    let dx = player.dirX;
    let dy = player.dirY;

    if(Math.hypot(dx,dy) < .1){

        dx = 0;
        dy = -1;
    }

    const dist =
        Math.hypot(
            ball.x - player.x,
            ball.y - player.y
        );

    if(dist < 48){

        ball.vx = dx * 480;
        ball.vy = dy * 480;

        burst(
            ball.x,
            ball.y,
            'CHUTE!'
        );
    }
}

/* JOGADOR */

function movePlayer(dt){

    let x =
        (keys.right ? 1 : 0)
        -
        (keys.left ? 1 : 0);

    let y =
        (keys.down ? 1 : 0)
        -
        (keys.up ? 1 : 0);

    const len = Math.hypot(x,y);

    if(len){

        x /= len;
        y /= len;

        player.dirX = x;
        player.dirY = y;
    }

    const sprint =
        keys.sprint &&
        player.energy > 1;

    const speed =
        sprint ? 285 : 190;

    if(sprint){

        player.energy =
            Math.max(
                0,
                player.energy - 35 * dt
            );
    }
    else{

        player.energy =
            Math.min(
                100,
                player.energy + 18 * dt
            );
    }

    player.vx = x * speed;
    player.vy = y * speed;

    player.x += player.vx * dt;
    player.y += player.vy * dt;

    player.x =
        Math.max(
            24,
            Math.min(W - 24,player.x)
        );

    player.y =
        Math.max(
            H * .5 + 10,
            Math.min(H - 42,player.y)
        );
}

/* IA */

function ai(dt){

    let targetX = ball.x;
    let targetY = ball.y;

    let dx = targetX - enemy.x;
    let dy = targetY - enemy.y;

    let d = Math.hypot(dx,dy) || 1;

    enemy.vx = dx / d * 125;
    enemy.vy = dy / d * 125;

    enemy.x += enemy.vx * dt;
    enemy.y += enemy.vy * dt;

    enemy.x =
        Math.max(
            24,
            Math.min(W - 24,enemy.x)
        );

    enemy.y =
        Math.max(
            105,
            Math.min(H * .52,enemy.y)
        );

    const kdx =
        ball.x - keeper.x;

    keeper.x += Math.max(
        -145 * dt,
        Math.min(145 * dt,kdx)
    );

    keeper.x =
        Math.max(
            55,
            Math.min(W - 55,keeper.x)
        );
}

/* BOLA */

function ballPhysics(dt){

    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    ball.vx *= Math.pow(.25,dt);
    ball.vy *= Math.pow(.25,dt);

    if(ball.x < 18){

        ball.x = 18;
        ball.vx *= -.65;
    }

    if(ball.x > W - 18){

        ball.x = W - 18;
        ball.vx *= -.65;
    }

    /* GOL SUPERIOR */

    if(ball.y < 0){

        if(Math.abs(ball.x - W / 2) < 80){

            goal('home');
        }
        else{

            ball.y = 8;
            ball.vy *= -.6;
        }
    }

    /* GOL INFERIOR */

    if(ball.y > H){

        if(Math.abs(ball.x - W / 2) < 80){

            goal('away');
        }
        else{

            ball.y = H - 8;
            ball.vy *= -.6;
        }
    }

    /* COLISÃO COM JOGADOR */

    const pd =
        Math.hypot(
            ball.x - player.x,
            ball.y - player.y
        );

    if(pd < player.r + ball.r + 5){

        const dx = ball.x - player.x;
        const dy = ball.y - player.y;

        const d =
            Math.hypot(dx,dy) || 1;

        ball.x =
            player.x +
            dx / d *
            (player.r + ball.r + 4);

        ball.y =
            player.y +
            dy / d *
            (player.r + ball.r + 4);

        ball.vx += dx / d * 70;
        ball.vy += dy / d * 70;
    }

    /* COLISÃO COM ADVERSÁRIO */

    const ed =
        Math.hypot(
            ball.x - enemy.x,
            ball.y - enemy.y
        );

    if(ed < enemy.r + ball.r + 4){

        const dx = ball.x - enemy.x;
        const dy = ball.y - enemy.y;

        const d =
            Math.hypot(dx,dy) || 1;

        ball.vx = dx / d * 250;
        ball.vy = dy / d * 250;
    }

    /* GOLEIRO */

    const kd =
        Math.hypot(
            ball.x - keeper.x,
            ball.y - keeper.y
        );

    if(
        kd < keeper.r + ball.r + 4 &&
        ball.y < 110
    ){

        ball.vy =
            Math.abs(ball.vy) + 180;

        ball.vx +=
            (ball.x - keeper.x) * 6;
    }
}

/* CAMPO */

function drawField(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    ctx.fillStyle = '#087a35';

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    const stripe = H / 12;

    for(let i=0;i<12;i++){

        ctx.fillStyle =
            i % 2
            ? '#0a8339'
            : '#087a35';

        ctx.fillRect(
            0,
            i * stripe,
            W,
            stripe
        );
    }

    ctx.strokeStyle =
        'rgba(255,255,255,.9)';

    ctx.lineWidth = 3;

    ctx.strokeRect(
        10,
        10,
        W - 20,
        H - 20
    );

    /* LINHA DO MEIO */

    ctx.beginPath();

    ctx.moveTo(
        10,
        H / 2
    );

    ctx.lineTo(
        W - 10,
        H / 2
    );

    ctx.stroke();

    /* CÍRCULO CENTRAL */

    ctx.beginPath();

    ctx.arc(
        W / 2,
        H / 2,
        58,
        0,
        Math.PI * 2
    );

    ctx.stroke();

    ctx.fillStyle =
        'rgba(255,255,255,.9)';

    ctx.beginPath();

    ctx.arc(
        W / 2,
        H / 2,
        4,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /* ÁREAS */

    ctx.strokeRect(
        W / 2 - 85,
        10,
        170,
        95
    );

    ctx.strokeRect(
        W / 2 - 85,
        H - 105,
        170,
        95
    );

    /* PEQUENA ÁREA */

    ctx.strokeRect(
        W / 2 - 45,
        10,
        90,
        48
    );

    ctx.strokeRect(
        W / 2 - 45,
        H - 58,
        90,
        48
    );

    /* GOLS */

    ctx.fillStyle = '#fff';

    ctx.fillRect(
        W / 2 - 52,
        0,
        104,
        10
    );

    ctx.fillRect(
        W / 2 - 52,
        H - 10,
        104,
        10
    );
}

/* JOGADORES */

function drawPlayer(
    p,
    color,
    number
){

    ctx.save();

    ctx.translate(
        p.x,
        p.y
    );

    ctx.fillStyle =
        'rgba(0,0,0,.25)';

    ctx.beginPath();

    ctx.ellipse(
        0,
        16,
        18,
        7,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.fillStyle = color;

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        p.r,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.fillStyle = '#fff';

    ctx.font =
        'bold 12px Arial';

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.fillText(
        number,
        0,
        0
    );

    ctx.restore();
}

/* BOLA */

function drawBall(){

    ctx.save();

    ctx.translate(
        ball.x,
        ball.y
    );

    ctx.fillStyle = '#fff';

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        ball.r,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.strokeStyle = '#222';
    ctx.lineWidth = 1.5;

    ctx.stroke();

    ctx.fillStyle = '#111';

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        3,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.restore();
}

/* DESENHO */

function draw(){

    drawField();

    drawPlayer(
        player,
        '#1479ff',
        '10'
    );

    drawPlayer(
        enemy,
        '#e53935',
        '9'
    );

    drawPlayer(
        keeper,
        '#f5c542',
        '1'
    );

    drawBall();

    for(const p of particles){

        ctx.globalAlpha = p.life;

        ctx.fillStyle = p.color;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.r,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.globalAlpha = 1;
}

/* EFEITOS */

function burst(x,y,text){

    particles.push({
        x:x,
        y:y,
        r:4,
        life:1,
        color:'#fff',
        text:text
    });

    for(let i=0;i<18;i++){

        const a =
            Math.random() *
            Math.PI *
            2;

        const s =
            80 +
            Math.random() *
            180;

        particles.push({
            x:x,
            y:y,
            r:2 + Math.random() * 3,
            vx:Math.cos(a) * s,
            vy:Math.sin(a) * s,
            life:1,
            color:
                i % 2
                ? '#7dff9d'
                : '#fff'
        });
    }
}

function updateParticles(dt){

    for(
        let i = particles.length - 1;
        i >= 0;
        i--
    ){

        const p = particles[i];

        p.life -= dt;

        if(p.vx){

            p.x += p.vx * dt;
            p.y += p.vy * dt;

            p.vx *= .94;
            p.vy *= .94;
        }

        if(p.life <= 0){

            particles.splice(i,1);
        }
    }
}

/* LOOP */

function loop(now){

    if(!running){
        return;
    }

    const dt =
        Math.min(
            (now - last) / 1000,
            .033
        );

    last = now;

    if(!paused){

        timeLeft -= dt;

        goalLock =
            Math.max(
                0,
                goalLock - dt
            );

        movePlayer(dt);

        ai(dt);

        ballPhysics(dt);

        updateParticles(dt);

        if(timeLeft <= 0){

            timeLeft = 0;

            updateHud();

            endGame();

            return;
        }

        updateHud();

        draw();
    }

    raf = requestAnimationFrame(loop);
}

/* PAUSA */

function togglePause(){

    if(!running){
        return;
    }

    paused = !paused;

    if(paused){

        panel.innerHTML = `
            <h2>PAUSADO</h2>

            <p>
                A partida está pausada.
            </p>

            <button id="resume">
                CONTINUAR
            </button>

            <button id="quit">
                SAIR
            </button>
        `;

        overlay.classList.remove('hidden');

        document.getElementById('resume').onclick =
            function(){

                paused = false;

                overlay.classList.add('hidden');

                last = performance.now();
            };

        document.getElementById('quit').onclick =
            function(){

                running = false;

                overlay.classList.add('hidden');

                game.classList.add('hidden');

                menu.classList.remove('hidden');
            };

    }
    else{

        overlay.classList.add('hidden');
    }
}

/* BOTÕES */

playBtn.addEventListener(

);

kickBtn.addEventListener(
    'click',
    kick
);

pauseBtn.addEventListener(

/* TECLADO */

document.addEventListener(
    'keydown',
    function(e){

        const k =
            e.key.toLowerCase();

        if(k === 'arrowup' || k === 'w'){
            keys.up = true;
        }

        if(k === 'arrowdown' || k === 's'){
            keys.down = true;
        }

        if(k === 'arrowleft' || k === 'a'){
            keys.left = true;
        }

        if(k === 'arrowright' || k === 'd'){
            keys.right = true;
        }

        if(k === 'shift'){
            keys.sprint = true;
        }

        if(k === ' '){

            e.preventDefault();

            kick();
        }

        if(k === 'p'){

            togglePause();
        }
    }
);

/* SOLTAR TECLAS */

document.addEventListener(
    'keyup',
    function(e){

        const k =
            e.key.toLowerCase();

        if(k === 'arrowup' || k === 'w'){
            keys.up = false;
        }

        if(k === 'arrowdown' || k === 's'){
            keys.down = false;
        }

        if(k === 'arrowleft' || k === 'a'){
            keys.left = false;
        }

        if(k === 'arrowright' || k === 'd'){
            keys.right = false;
        }

        if(k === 'shift'){
            keys.sprint = false;
        }
    }
);

/* CONTROLE TOUCH */

function bindHold(el,key){

    el.addEventListener(
        'pointerdown',
        function(e){

            e.preventDefault();

            keys[key] = true;

            if(el.setPointerCapture){
                el.setPointerCapture(
                    e.pointerId
                );
            }
        }
    );

    [
        'pointerup',
        'pointercancel',
        'pointerleave'
    ].forEach(function(eventName){

        el.addEventListener(
            eventName,
            function(e){

                e.preventDefault();

                keys[key] = false;
            }
        );
    });
}

document
    .querySelectorAll('[data-key]')
    .forEach(function(el){

        bindHold(
            el,
            el.dataset.key
        );
    });

/* RECORD */

try{

    best = Number(
        localStorage.getItem(
            'lastSecondFCBest'
        ) || 0
    );

}
catch(e){

    best = 0;
}

resize();

updateHud();
