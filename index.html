<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<meta name="theme-color" content="#050816">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>LAST SECOND v2.0</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02030b;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    touch-action:none;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
}

#game{
    position:relative;
    width:min(400px,100vw);
    height:min(680px,100vh);
    overflow:hidden;

    background:
        radial-gradient(circle at 50% 20%,#17204d 0,#080d25 35%,#02030b 75%);

    border:1px solid #26316d;

    box-shadow:
        0 0 40px rgba(70,100,255,.22);

    user-select:none;
}

#stars{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
}

.star{
    position:absolute;
    border-radius:50%;
    background:#fff;
    opacity:.7;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{opacity:.2}
    to{opacity:1}
}

.nebula{
    position:absolute;
    border-radius:50%;
    filter:blur(25px);
    opacity:.13;
    pointer-events:none;
}

.n1{
    width:230px;
    height:230px;
    left:-100px;
    top:80px;
    background:#315cff;
}

.n2{
    width:260px;
    height:180px;
    right:-120px;
    top:330px;
    background:#a42cff;
}

.n3{
    width:180px;
    height:180px;
    left:110px;
    bottom:-80px;
    background:#00b7ff;
}

#hud{
    position:absolute;
    z-index:20;
    top:0;
    left:0;
    right:0;

    padding:10px 12px;

    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:7px;

    background:linear-gradient(#03050fcc,transparent);

    font-size:12px;
    text-align:center;
}

.hudBox{
    padding:6px 4px;

    border:1px solid #28336b;
    border-radius:9px;

    background:#050817aa;

    box-shadow:0 0 10px #0005;
}

.hudValue{
    display:block;
    font-size:18px;
    font-weight:800;
    margin-top:2px;
}

.version{
    font-size:10px;
    color:#7f8cff;
    margin-top:2px;
}

#lives{
    letter-spacing:2px;
    color:#ff526d;
}

#playArea{
    position:absolute;
    left:0;
    right:0;
    top:0;
    bottom:0;
}

#player{
    position:absolute;

    width:30px;
    height:42px;

    z-index:10;

    transform:translate(-50%,-50%);

    filter:drop-shadow(0 0 7px #54d7ff);
}

.shipBody{
    position:absolute;

    left:5px;
    top:3px;

    width:20px;
    height:30px;

    background:linear-gradient(
        90deg,
        #6ae7ff,
        #d8fbff,
        #56b9ff
    );

    clip-path:polygon(
        50% 0,
        100% 100%,
        50% 78%,
        0 100%
    );

    border-radius:5px;
}

.shipCore{
    position:absolute;

    left:11px;
    top:10px;

    width:8px;
    height:10px;

    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 10px #fff,
        0 0 18px #32d7ff;
}

.flame{
    position:absolute;

    left:10px;
    top:29px;

    width:10px;
    height:12px;

    background:
        linear-gradient(
            #fff,
            #43d8ff,
            transparent
        );

    clip-path:polygon(
        50% 100%,
        0 0,
        100% 0
    );

    animation:flame .12s infinite alternate;
}

@keyframes flame{
    to{
        transform:scaleY(.55);
        opacity:.6;
    }
}

.enemy,
.asteroid,
.crystal,
.power{
    position:absolute;

    z-index:7;

    transform:translate(-50%,-50%);

    pointer-events:none;
}

.enemy{
    width:34px;
    height:28px;

    border-radius:50% 50% 45% 45%;

    background:
        linear-gradient(
            #8c75ff,
            #332070
        );

    border:2px solid #c2b9ff;

    box-shadow:
        0 0 12px #814dff;
}

.enemy:before{
    content:"";

    position:absolute;

    left:7px;
    right:7px;
    bottom:-6px;

    height:9px;

    background:#5e36bd;

    border-radius:0 0 50% 50%;
}

.enemy:after{
    content:"••";

    position:absolute;

    left:10px;
    top:5px;

    color:#8affff;

    letter-spacing:5px;
    font-size:13px;
}

.fastEnemy{
    background:
        linear-gradient(
            135deg,
            #ff5377,
            #6d0c3d
        );

    box-shadow:
        0 0 14px #ff315f;

    transform:
        translate(-50%,-50%)
        rotate(45deg);

    border-radius:6px;
}

.fastEnemy:after{
    transform:rotate(-45deg);
    color:#fff;
}

.asteroid{
    width:38px;
    height:38px;

    border-radius:
        42% 58% 55% 45%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #8c8c9b,
            #393946 55%,
            #171722
        );

    border:2px solid #777789;

    box-shadow:0 0 7px #000;
}

.crystal{
    width:18px;
    height:24px;

    background:
        linear-gradient(
            135deg,
            #fff,
            #36f0ff 45%,
            #477cff
        );

    clip-path:polygon(
        50% 0,
        100% 30%,
        75% 100%,
        25% 100%,
        0 30%
    );

    filter:
        drop-shadow(0 0 8px #2beaff);
}

.power{
    width:28px;
    height:28px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:15px;
    font-weight:bold;

    background:#07122d;

    border:2px solid #57dfff;

    box-shadow:
        0 0 12px #24cfff;
}

.shieldPower{
    border-color:#65ffb3;

    box-shadow:
        0 0 12px #36ffad;
}

.turboPower{
    border-color:#ffd24d;

    box-shadow:
        0 0 12px #ffbe2e;
}

.bullet{
    position:absolute;

    width:4px;
    height:13px;

    border-radius:5px;

    background:#fff;

    box-shadow:
        0 0 8px #57eaff;

    z-index:8;

    transform:translate(-50%,-50%);
}

.enemyBullet{
    background:#ff5778;

    box-shadow:
        0 0 8px #ff335f;
}

#startScreen,
#gameOver{
    position:absolute;

    z-index:50;

    inset:0;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    text-align:center;

    padding:25px;

    background:
        radial-gradient(
            circle,
            #0d1640dd,
            #02030bf5
        );
}

.hidden{
    display:none!important;
}

.logo{
    font-size:44px;

    letter-spacing:4px;

    font-weight:900;

    text-shadow:
        0 0 18px #3fcfff;

    margin:0;
}

.subtitle{
    color:#9ca9d9;

    margin:
        5px
        0
        25px;

    font-size:13px;

    letter-spacing:1px;
}

.versionBig{
    font-size:11px;

    color:#5ddfff;

    margin-bottom:12px;
}

button{
    border:0;
    color:#fff;

    font-weight:900;

    cursor:pointer;
}

.mainBtn{
    padding:
        14px
        35px;

    border-radius:30px;

    background:
        linear-gradient(
            90deg,
            #1d7dff,
            #7b36ff
        );

    box-shadow:
        0 0 22px #3e5cff88;

    font-size:17px;

    letter-spacing:1px;
}

.mainBtn:active{
    transform:scale(.96);
}

.tip{
    margin-top:18px;

    color:#7581aa;

    font-size:11px;

    line-height:1.6;

    max-width:290px;
}

#pause{
    position:absolute;

    z-index:40;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    padding:
        18px
        25px;

    border:
        1px solid #5b69bd;

    border-radius:15px;

    background:#050817eF;

    text-align:center;

    box-shadow:
        0 0 30px #000;
}

.pauseTitle{
    font-weight:900;
    font-size:23px;
}

.pauseText{
    font-size:11px;
    color:#9ca9d9;
    margin-top:5px;
}

#toast{
    position:absolute;

    z-index:30;

    left:50%;
    top:30%;

    transform:
        translate(-50%,-50%);

    font-weight:900;

    font-size:18px;

    text-shadow:
        0 0 10px #fff;

    pointer-events:none;

    opacity:0;
}

.floatText{
    position:absolute;

    z-index:25;

    font-weight:900;

    font-size:15px;

    pointer-events:none;

    animation:
        floatUp .8s forwards;

    text-shadow:
        0 0 8px #fff;
}

.danger{
    color:#ff637c;
}

.good{
    color:#61ffc2;
}

@keyframes floatUp{
    from{
        opacity:1;
        transform:translate(-50%,0);
    }

    to{
        opacity:0;
        transform:translate(-50%,-45px);
    }
}

#controls{
    position:absolute;

    z-index:35;

    left:0;
    right:0;
    bottom:12px;

    display:flex;

    justify-content:space-between;

    padding:
        0
        15px;

    pointer-events:none;
}

.controlSide{
    display:flex;

    gap:10px;

    pointer-events:auto;
}

.ctrl{
    width:58px;
    height:58px;

    border-radius:50%;

    border:
        1px solid #5666ad;

    background:#0a1230bb;

    color:#fff;

    font-size:24px;

    box-shadow:
        0 0 15px #0008;
}

.ctrl.fire{
    border-color:#5cecff;
    font-size:20px;
}

.ctrl:active{
    background:#203a7c;
}

#pauseHint{
    position:absolute;

    right:10px;
    bottom:85px;

    z-index:20;

    color:#6f7ba7;

    font-size:9px;
}

@media(max-height:620px){

    #game{
        height:100vh;
    }

    .logo{
        font-size:36px;
    }

    .ctrl{
        width:50px;
        height:50px;
    }

}

</style>
</head>

<body>

<div id="game">

    <div id="stars"></div>

    <div class="nebula n1"></div>
    <div class="nebula n2"></div>
    <div class="nebula n3"></div>


    <div id="hud">

        <div class="hudBox">
            SCORE
            <span id="score" class="hudValue">0</span>
        </div>

        <div class="hudBox">
            VIDAS
            <span id="lives" class="hudValue">♥♥♥</span>
        </div>

        <div class="hudBox">
            BEST

            <span id="best" class="hudValue">
                0
            </span>

            <span class="version">
                v2.0
            </span>
        </div>

    </div>


    <div id="playArea">

        <div id="player">

            <div class="shipBody"></div>

            <div class="shipCore"></div>

            <div class="flame"></div>

        </div>

    </div>


    <div id="toast"></div>


    <div id="pause" class="hidden">

        <div class="pauseTitle">
            PAUSADO
        </div>

        <div class="pauseText">
            Pressione P para continuar
        </div>

    </div>


    <div id="pauseHint">
        P = PAUSAR
    </div>


    <div id="controls">

        <div class="controlSide">

            <button
                class="ctrl"
                id="leftBtn">
                ◀
            </button>

            <button
                class="ctrl"
                id="rightBtn">
                ▶
            </button>

        </div>


        <div class="controlSide">

            <button
                class="ctrl fire"
                id="fireBtn">
                ✦
            </button>

        </div>

    </div>


    <div id="startScreen">

        <div class="versionBig">
            BUILD 2026.09.12 • v2.0
        </div>

        <h1 class="logo">
            LAST SECOND
        </h1>

        <div class="subtitle">
            SOBREVIVA O MÁXIMO QUE PUDER
        </div>

        <button
            class="mainBtn"
            id="startBtn">
            INICIAR MISSÃO
        </button>

        <div class="tip">

            Mova a nave com ← → ou A/D.<br>

            Use ESPAÇO para atirar.
            Colete cristais e power-ups.<br>

            Pressione P para pausar.

        </div>

    </div>


    <div id="gameOver" class="hidden">

        <div class="versionBig">
            LAST SECOND v2.0
        </div>

        <h2
            class="logo"
            style="font-size:34px">

            FIM DE JOGO

        </h2>

        <div class="subtitle">

            SCORE
            <b id="finalScore">0</b>

            •

            BEST
            <b id="finalBest">0</b>

        </div>

        <div
            id="recordText"
            class="good"
            style="min-height:20px;margin-bottom:15px">

        </div>

        <button
            class="mainBtn"
            id="retryBtn">

            JOGAR NOVAMENTE

        </button>

    </div>

</div>


<script>

(() => {

'use strict';


const VERSION = '2.0';

const W = 400;
const H = 680;


const game =
    document.getElementById('game');

const area =
    document.getElementById('playArea');

const playerEl =
    document.getElementById('player');


const scoreEl =
    document.getElementById('score');

const bestEl =
    document.getElementById('best');

const livesEl =
    document.getElementById('lives');


const startScreen =
    document.getElementById('startScreen');

const gameOver =
    document.getElementById('gameOver');

const pauseEl =
    document.getElementById('pause');


const finalScore =
    document.getElementById('finalScore');

const finalBest =
    document.getElementById('finalBest');

const recordText =
    document.getElementById('recordText');

const toast =
    document.getElementById('toast');


const startBtn =
    document.getElementById('startBtn');

const retryBtn =
    document.getElementById('retryBtn');


const leftBtn =
    document.getElementById('leftBtn');

const rightBtn =
    document.getElementById('rightBtn');

const fireBtn =
    document.getElementById('fireBtn');


let player = {
    x: 200,
    y: 590,
    speed: 250,
    radius: 15
};


let score = 0;
let best = 0;
let lives = 3;

let timeAlive = 0;
let difficulty = 1;

let running = false;
let paused = false;
let gameOverState = false;

let lastTime = 0;

let fireCooldown = 0;
let spawnTimer = 0;
let crystalTimer = 0;
let powerTimer = 0;
let enemyShotTimer = 0;

let shield = 0;
let turbo = 0;
let invuln = 0;


let enemies = [];
let asteroids = [];
let crystals = [];
let powers = [];

let bullets = [];
let enemyBullets = [];

let particles = [];


let keys = {
    left:false,
    right:false,
    fire:false
};


let audioCtx = null;
let musicTimer = null;


try {

    best =
        Number(
            localStorage.getItem(
                'lastSecondBestV20'
            ) || 0
        );

} catch(e) {

    best = 0;

}


bestEl.textContent = best;



function rand(a,b){

    return Math.random() * (b-a) + a;

}


function clamp(v,a,b){

    return Math.max(
        a,
        Math.min(b,v)
    );

}


function dist(a,b){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );

}


function el(tag,cls){

    const e =
        document.createElement(tag);

    e.className = cls;

    area.appendChild(e);

    return e;

}


function removeObj(o){

    if(
        o.el &&
        o.el.parentNode
    ){

        o.el.remove();

    }

}


function setPos(o){

    if(o.el){

        o.el.style.left =
            o.x + 'px';

        o.el.style.top =
            o.y + 'px';

    }

}



function createStars(){

    const box =
        document.getElementById('stars');

    box.innerHTML = '';

    for(let i=0;i<75;i++){

        const s =
            document.createElement('div');

        s.className = 'star';

        const z =
            rand(1,3);

        s.style.width =
            z + 'px';

        s.style.height =
            z + 'px';

        s.style.left =
            rand(0,100) + '%';

        s.style.top =
            rand(0,100) + '%';

        s.style.animationDelay =
            rand(0,2) + 's';

        box.appendChild(s);

    }

}


createStars();



function beep(
    freq=440,
    duration=.06,
    type='sine',
    volume=.025
){

    try{

        if(!audioCtx){

            audioCtx =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        if(
            audioCtx.state ===
            'suspended'
        ){

            audioCtx.resume();

        }


        const o =
            audioCtx.createOscillator();

        const g =
            audioCtx.createGain();


        o.type = type;

        o.frequency.value =
            freq;


        g.gain.setValueAtTime(
            volume,
            audioCtx.currentTime
        );


        g.gain.exponentialRampToValueAtTime(
            .001,
            audioCtx.currentTime + duration
        );


        o.connect(g);

        g.connect(
            audioCtx.destination
        );


        o.start();

        o.stop(
            audioCtx.currentTime +
            duration
        );

    }catch(e){}

}



function startMusic(){

    stopMusic();

    const notes = [
        196,
        247,
        294,
        330,
        294,
        247
    ];

    let i = 0;


    musicTimer =
        setInterval(() => {

            if(
                running &&
                !paused
            ){

                beep(
                    notes[
                        i++ %
                        notes.length
                    ],
                    .07,
                    'triangle',
                    .009
                );

            }

        },360);

}



function stopMusic(){

    if(musicTimer){

        clearInterval(
            musicTimer
        );

        musicTimer = null;

    }

}



function resetArrays(){

    [
        ...enemies,
        ...asteroids,
        ...crystals,
        ...powers,
        ...bullets,
        ...enemyBullets
    ].forEach(removeObj);


    enemies = [];
    asteroids = [];
    crystals = [];
    powers = [];

    bullets = [];
    enemyBullets = [];

    particles = [];

}



function resetGame(){

    resetArrays();

    score = 0;

    lives = 3;

    timeAlive = 0;

    difficulty = 1;

    shield = 0;

    turbo = 0;

    invuln = 0;

    fireCooldown = 0;

    spawnTimer = .2;

    crystalTimer = 1.5;

    powerTimer = 7;

    enemyShotTimer = 1.5;


    player.x = W/2;

    player.y = 590;


    playerEl.style.left =
        player.x + 'px';

    playerEl.style.top =
        player.y + 'px';


    scoreEl.textContent = '0';

    livesEl.textContent =
        '♥♥♥';

    bestEl.textContent =
        best;

}



function startGame(){

    resetGame();

    running = true;

    paused = false;

    gameOverState = false;

    startScreen.classList.add(
        'hidden'
    );

    gameOver.classList.add(
        'hidden'
    );

    pauseEl.classList.add(
        'hidden'
    );


    lastTime =
        performance.now();


    startMusic();

    requestAnimationFrame(
        loop
    );

}



function endGame(){

    running = false;

    gameOverState = true;

    stopMusic();


    finalScore.textContent =
        score;


    const newRecord =
        score > best;


    if(newRecord){

        best = score;


        try{

            localStorage.setItem(
                'lastSecondBestV20',
                String(best)
            );

        }catch(e){}


        recordText.textContent =
            '🏆 NOVO RECORDE!';

    }else{

        recordText.textContent =
            '';

    }


    finalBest.textContent =
        best;

    bestEl.textContent =
        best;


    gameOver.classList.remove(
        'hidden'
    );


    beep(
        110,
        .35,
        'sawtooth',
        .04
    );

}



function togglePause(){

    if(
        !running ||
        gameOverState
    ){

        return;

    }


    paused = !paused;


    pauseEl.classList.toggle(
        'hidden',
        !paused
    );


    if(!paused){

        lastTime =
            performance.now();

        requestAnimationFrame(
            loop
        );

    }

}



function oSign(){

    return Math.random() < .5
        ? 1
        : -1;

}



function spawnEnemy(){

    const fast =
        Math.random() <
        Math.min(
            .35,
            .08 + difficulty*.015
        );


    const fromSide =
        Math.random() < .2;


    const o = {

        x:
            fromSide
                ? (
                    Math.random() < .5
                        ? -35
                        : W+35
                )
                : rand(25,W-25),

        y:
            fromSide
                ? rand(100,400)
                : 70,

        radius:
            fast
                ? 15
                : 17,

        vx:
            fromSide
                ? (
                    oSign() *
                    rand(35,80)
                )
                : rand(-25,25),

        vy:
            fast
                ? rand(105,145)
                : rand(65,100),

        phase:
            rand(
                0,
                Math.PI*2
            ),

        fast,

        el:null

    };


    o.el =
        el(
            'div',
            'enemy' +
            (
                fast
                    ? ' fastEnemy'
                    : ''
            )
        );


    setPos(o);

    enemies.push(o);

}



function spawnAsteroid(){

    const o = {

        x:rand(20,W-20),

        y:-30,

        radius:rand(17,25),

        vx:rand(-30,30),

        vy:rand(70,125),

        rot:rand(0,360),

        spin:rand(-100,100),

        el:el(
            'div',
            'asteroid'
        )

    };


    o.el.style.width =
        o.radius*2 + 'px';

    o.el.style.height =
        o.radius*2 + 'px';


    setPos(o);

    asteroids.push(o);

}



function spawnCrystal(){

    const o = {

        x:rand(22,W-22),

        y:-25,

        radius:11,

        vy:rand(75,105),

        spin:rand(-2,2),

        el:el(
            'div',
            'crystal'
        )

    };


    setPos(o);

    crystals.push(o);

}



function spawnPower(){

    const shieldType =
        Math.random() < .55;


    const o = {

        x:rand(30,W-30),

        y:-25,

        radius:15,

        vy:70,

        type:
            shieldType
                ? 'shield'
                : 'turbo',

        el:
            el(
                'div',
                'power ' +
                (
                    shieldType
                        ? 'shieldPower'
                        : 'turboPower'
                )
            )

    };


    o.el.textContent =
        shieldType
            ? 'S'
            : 'T';


    setPos(o);

    powers.push(o);

}



function shoot(){

    if(
        !running ||
        paused ||
        fireCooldown > 0
    ){

        return;

    }


    fireCooldown = .22;


    const b = {

        x:player.x,

        y:player.y-25,

        radius:3,

        vy:470,

        el:
            el(
                'div',
                'bullet'
            )

    };


    setPos(b);

    bullets.push(b);


    beep(
        720,
        .045,
        'square',
        .018
    );

}



function enemyShoot(o){

    const dx =
        player.x-o.x;

    const dy =
        player.y-o.y;

    const len =
        Math.hypot(
            dx,
            dy
        ) || 1;


    const b = {

        x:o.x,

        y:o.y+10,

        radius:4,

        vx:
            dx/len*130,

        vy:
            dy/len*130,

        el:
            el(
                'div',
                'bullet enemyBullet'
            )

    };


    setPos(b);

    enemyBullets.push(b);

}



function addParticle(
    x,
    y,
    life=.5,
    size=4
){

    particles.push({

        x,
        y,

        vx:rand(-90,90),

        vy:rand(-90,90),

        life,

        max:life,

        size

    });

}



function burst(
    x,
    y,
    n=10
){

    for(
        let i=0;
        i<n;
        i++
    ){

        addParticle(
            x,
            y,
            rand(.25,.65),
            rand(2,5)
        );

    }

}



function floating(
    text,
    x,
    y,
    cls=''
){

    const e =
        document.createElement(
            'div'
        );


    e.className =
        'floatText ' + cls;


    e.textContent =
        text;


    e.style.left =
        x + 'px';

    e.style.top =
        y + 'px';


    area.appendChild(e);


    setTimeout(
        () => e.remove(),
        800
    );

}



function showToast(text){

    toast.textContent =
        text;

    toast.style.opacity =
        '1';

    toast.style.transition =
        'none';


    setTimeout(
        () => {

            toast.style.transition =
                'opacity .4s';

            toast.style.opacity =
                '0';

        },
        650
    );

}



function hitPlayer(){

    if(invuln > 0){

        return false;

    }


    if(shield > 0){

        shield = 0;

        showToast(
            '🛡️ CAMPO QUEBRADO'
        );

        beep(
            180,
            .18,
            'sawtooth',
            .035
        );

        burst(
            player.x,
            player.y,
            16
        );

        invuln = .6;

        return false;

    }


    lives--;


    livesEl.textContent =
        '♥'.repeat(
            Math.max(0,lives)
        ) +
        '♡'.repeat(
            3-Math.max(0,lives)
        );


    invuln = 1.4;


    burst(
        player.x,
        player.y,
        22
    );


    beep(
        90,
        .25,
        'sawtooth',
        .05
    );


    if(lives <= 0){

        endGame();

        return true;

    }


    return true;

}



function destroyEnemy(index){

    const o =
        enemies[index];


    score +=
        o.fast
            ? 30
            : 20;


    scoreEl.textContent =
        score;


    burst(
        o.x,
        o.y,
        14
    );


    floating(
        '+' +
        (
            o.fast
                ? 30
                : 20
        ),
        o.x,
        o.y,
        'good'
    );


    beep(
        o.fast
            ? 920
            : 620,
        .07,
        'square',
        .025
    );


    removeObj(o);

    enemies.splice(
        index,
        1
    );

}



function collectCrystal(i){

    const o =
        crystals[i];


    score += 10;


    scoreEl.textContent =
        score;


    floating(
        '+10',
        o.x,
        o.y,
        'good'
    );


    burst(
        o.x,
        o.y,
        7
    );


    beep(
        850,
        .06,
        'sine',
        .02
    );


    removeObj(o);

    crystals.splice(
        i,
        1
    );

}



function collectPower(i){

    const o =
        powers[i];


    if(o.type === 'shield'){

        shield = 7;

        showToast(
            '🛡️ CAMPO DE FORÇA'
        );

    }else{

        turbo = 5;

        showToast(
            '⚡ TURBO ATIVADO'
        );

    }


    score += 25;


    scoreEl.textContent =
        score;


    beep(
        o.type === 'shield'
            ? 540
            : 980,
        .12,
        'triangle',
        .03
    );


    removeObj(o);

    powers.splice(
        i,
        1
    );

}



function update(dt){

    timeAlive += dt;


    difficulty =
        1 +
        timeAlive/20;


    score +=
        Math.floor(
            dt*3
        );


    scoreEl.textContent =
        score;


    fireCooldown =
        Math.max(
            0,
            fireCooldown-dt
        );


    invuln =
        Math.max(
            0,
            invuln-dt
        );


    shield =
        Math.max(
            0,
            shield-dt
        );


    turbo =
        Math.max(
            0,
            turbo-dt
        );


    const move =
        (
            keys.right
                ? 1
                : 0
        ) -
        (
            keys.left
                ? 1
                : 0
        );


    const sp =
        player.speed *
        (
            turbo > 0
                ? 1.75
                : 1
        );


    player.x =
        clamp(
            player.x +
            move*sp*dt,
            18,
            W-18
        );


    if(keys.fire){

        shoot();

    }


    playerEl.style.left =
        player.x + 'px';

    playerEl.style.top =
        player.y + 'px';


    playerEl.style.opacity =
        invuln > 0 &&
        Math.floor(
            invuln*12
        ) % 2 === 0
            ? '.35'
            : '1';


    spawnTimer -= dt;


    if(spawnTimer <= 0){

        spawnEnemy();


        spawnTimer =
            Math.max(
                .35,
                1.15 -
                difficulty*.055
            );

    }


    if(timeAlive > 5){

        crystalTimer -= dt;


        if(crystalTimer <= 0){

            spawnCrystal();


            crystalTimer =
                rand(2.2,4);

        }

    }


    powerTimer -= dt;


    if(powerTimer <= 0){

        spawnPower();


        powerTimer =
            rand(8,13);

    }


    if(
        timeAlive > 8 &&
        Math.random() <
            dt*(
                .12 +
                difficulty*.008
            )
    ){

        spawnAsteroid();

    }


    enemyShotTimer -= dt;


    if(enemyShotTimer <= 0){

        if(enemies.length){

            enemyShoot(
                enemies[
                    Math.floor(
                        Math.random() *
                        enemies.length
                    )
                ]
            );

        }


        enemyShotTimer =
            Math.max(
                .65,
                1.8 -
                difficulty*.04
            );

    }



    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        const b =
            bullets[i];


        b.y -=
            b.vy*dt;


        setPos(b);


        if(b.y < -20){

            removeObj(b);

            bullets.splice(i,1);

            continue;

        }


        let hit = false;


        for(
            let j=enemies.length-1;
            j>=0;
            j--
        ){

            if(
                dist(
                    b,
                    enemies[j]
                ) <
                b.radius +
                enemies[j].radius
            ){

                removeObj(b);

                bullets.splice(i,1);

                destroyEnemy(j);

                hit = true;

                break;

            }

        }


        if(hit){

            continue;

        }

    }



    for(
        let i=enemyBullets.length-1;
        i>=0;
        i--
    ){

        const b =
            enemyBullets[i];


        b.x +=
            b.vx*dt;

        b.y +=
            b.vy*dt;


        setPos(b);


        if(
            b.y > H+30 ||
            b.x < -30 ||
            b.x > W+30
        ){

            removeObj(b);

            enemyBullets.splice(
                i,
                1
            );

            continue;

        }


        if(
            dist(
                b,
                player
            ) <
            b.radius +
            player.radius
        ){

            removeObj(b);

            enemyBullets.splice(
                i,
                1
            );

            hitPlayer();

        }

    }



    for(
        let i=enemies.length-1;
        i>=0;
        i--
    ){

        const o =
            enemies[i];


        o.y +=
            o.vy*dt;


        o.x +=
            o.vx*dt +
            Math.sin(
                timeAlive*2 +
                o.phase
            ) *
            18 *
            dt;


        if(o.x < -45){

            o.x = W+45;

        }


        if(o.x > W+45){

            o.x = -45;

        }


        setPos(o);


        if(o.y > H+50){

            removeObj(o);

            enemies.splice(
                i,
                1
            );

            continue;

        }


        if(
            dist(
                o,
                player
            ) <
            o.radius +
            player.radius
        ){

            removeObj(o);

            enemies.splice(
                i,
                1
            );

            hitPlayer();

        }

    }



    for(
        let i=asteroids.length-1;
        i>=0;
        i--
    ){

        const o =
            asteroids[i];


        o.x +=
            o.vx*dt;

        o.y +=
            o.vy*dt;

        o.rot +=
            o.spin*dt;


        o.el.style.transform =
            'translate(-50%,-50%) rotate(' +
            o.rot +
            'deg)';


        setPos(o);


        if(o.y > H+50){

            removeObj(o);

            asteroids.splice(
                i,
                1
            );

            continue;

        }


        if(
            dist(
                o,
                player
            ) <
            o.radius +
            player.radius -
            5
        ){

            removeObj(o);

            asteroids.splice(
                i,
                1
            );

            hitPlayer();

        }

    }



    for(
        let i=crystals.length-1;
        i>=0;
        i--
    ){

        const o =
            crystals[i];


        o.y +=
            o.vy*dt;


        o.el.style.transform =
            'translate(-50%,-50%) rotate(' +
            (
                timeAlive *
                90 *
                o.spin
            ) +
            'deg)';


        setPos(o);


        if(o.y > H+30){

            removeObj(o);

            crystals.splice(
                i,
                1
            );

            continue;

        }


        if(
            dist(
                o,
                player
            ) <
            o.radius +
            player.radius
        ){

            collectCrystal(i);

        }

    }



    for(
        let i=powers.length-1;
        i>=0;
        i--
    ){

        const o =
            powers[i];


        o.y +=
            o.vy*dt;


        setPos(o);


        if(o.y > H+30){

            removeObj(o);

            powers.splice(
                i,
                1
            );

            continue;

        }


        if(
            dist(
                o,
                player
            ) <
            o.radius +
            player.radius
        ){

            collectPower(i);

        }

    }



    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p =
            particles[i];


        p.life -= dt;

        p.x +=
            p.vx*dt;

        p.y +=
            p.vy*dt;


        if(p.life <= 0){

            particles.splice(
                i,
                1
            );

        }

    }

}



function loop(now){

    if(
        !running ||
        paused
    ){

        return;

    }


    let dt =
        Math.min(
            .035,
            (now-lastTime)/1000 || 0
        );


    lastTime = now;


    update(dt);


    if(running){

        requestAnimationFrame(
            loop
        );

    }

}



function bindHold(
    btn,
    prop
){

    const down =
        e => {

            e.preventDefault();

            keys[prop] = true;

        };


    const up =
        e => {

            e.preventDefault();

            keys[prop] = false;

        };


    [
        'pointerdown',
        'touchstart'
    ].forEach(
        ev =>
            btn.addEventListener(
                ev,
                down,
                {passive:false}
            )
    );


    [
        'pointerup',
        'pointerleave',
        'pointercancel',
        'touchend'
    ].forEach(
        ev =>
            btn.addEventListener(
                ev,
                up,
                {passive:false}
            )
    );

}



bindHold(
    leftBtn,
    'left'
);

bindHold(
    rightBtn,
    'right'
);

bindHold(
    fireBtn,
    'fire'
);



window.addEventListener(
    'keydown',
    e => {

        if(
            [
                'ArrowLeft',
                'ArrowRight',
                ' ',
                'a',
                'A',
                'd',
                'D',
                'p',
                'P'
            ].includes(e.key)
        ){

            e.preventDefault();

        }


        if(
            e.key === 'ArrowLeft' ||
            e.key === 'a' ||
            e.key === 'A'
        ){

            keys.left = true;

        }


        if(
            e.key === 'ArrowRight' ||
            e.key === 'd' ||
            e.key === 'D'
        ){

            keys.right = true;

        }


        if(e.key === ' '){

            keys.fire = true;

        }


        if(
            e.key === 'p' ||
            e.key === 'P'
        ){

            togglePause();

        }

    }
);



window.addEventListener(
    'keyup',
    e => {

        if(
            e.key === 'ArrowLeft' ||
            e.key === 'a' ||
            e.key === 'A'
        ){

            keys.left = false;

        }


        if(
            e.key === 'ArrowRight' ||
            e.key === 'd' ||
            e.key === 'D'
        ){

            keys.right = false;

        }


        if(e.key === ' '){

            keys.fire = false;

        }

    }
);



window.addEventListener(
    'blur',
    () => {

        keys.left =
            keys.right =
            keys.fire =
            false;


        if(
            running &&
            !paused
        ){

            togglePause();

        }

    }
);



document.addEventListener(
    'visibilitychange',
    () => {

        if(
            document.hidden &&
            running &&
            !paused
        ){

            togglePause();

        }

    }
);



startBtn.addEventListener(
    'click',
    startGame
);


retryBtn.addEventListener(
    'click',
    startGame
);



document.addEventListener(
    'contextmenu',
    e =>
        e.preventDefault()
);


console.log(
    'LAST SECOND v' +
    VERSION +
    ' carregado.'
);


})();

</script>

</body>
