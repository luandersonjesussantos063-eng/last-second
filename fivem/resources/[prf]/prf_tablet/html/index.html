<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PRF RP — Tablet de Operações</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="tablet" class="tablet" hidden aria-label="Tablet policial de operações">
    <header class="header">
      <div><span class="eyebrow">SIMULAÇÃO • PRF RP</span><h1>Painel de operações</h1></div>
      <button id="close" type="button" aria-label="Fechar tablet">✕</button>
    </header>
    <div class="notice">AMBIENTE DEMONSTRATIVO — ocorrências fictícias, sem consulta a sistemas governamentais.</div>
    <section class="summary"><div><strong id="count">0</strong><span>Chamados no painel</span></div><div><strong>ALFA</strong><span>Ambiente de desenvolvimento</span></div></section>
    <section class="section"><h2>Chamados e ocorrências</h2><div id="calls" class="calls" aria-live="polite"></div></section>
    <footer>Nova Byte • Projeto de entretenimento fictício • Sem vínculo institucional com a PRF.</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
